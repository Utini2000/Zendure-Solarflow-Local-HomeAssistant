      last_text_entity: { description: "Optional last-published input_text" }
      last_time_entity: { description: "Optional last-published input_datetime" }
      state_text_entity: { description: "Optional internal text state helper" }
    sequence:
      - wait_template: "{{ is_state('input_boolean.zendure_runtime_writers_ready','on') }}"
        timeout: "00:00:10"
        continue_on_timeout: false
      - variables:
          topic_value: "{{ topic }}"
          payload_value: "{{ payload }}"
          source_value: "{{ source | default('config') }}"
          desired_entity_value: "{{ desired_entity | default('') }}"
          desired_type_value: "{{ desired_type | default('none') }}"
          last_number: "{{ last_number_entity | default('') }}"
          last_text: "{{ last_text_entity | default('') }}"
          last_time: "{{ last_time_entity | default('') }}"
          state_text: "{{ state_text_entity | default('') }}"
          desired_matches_pre: >-
            {% if desired_entity_value | length == 0 %}
              true
            {% elif desired_type_value == 'number' %}
              {{ is_number(states(desired_entity_value))
                   and states(desired_entity_value) | int(-99999) == payload_value | int(-99998) }}
            {% elif desired_type_value == 'text_ci' %}
              {{ states(desired_entity_value) | lower == payload_value | string | lower }}
            {% else %}
              {{ states(desired_entity_value) == payload_value | string }}
            {% endif %}
          capacity: "{{ states('input_number.zendure_conf_config_bucket_capacity') | float(3) }}"
          refill_seconds: "{{ [states('input_number.zendure_conf_config_refill_seconds') | float(10), 1] | max }}"
          stored: "{{ states('input_number.zendure_config_write_tokens_u1') | float(0) }}"
          budget_ts: "{{ (state_attr('input_datetime.zendure_config_write_budget_ts_u1','timestamp') | float(0)) }}"
          refilled: >-
            {{ [capacity | float(3), stored | float(0)
                 + ([as_timestamp(now()) - budget_ts | float(0), 0] | max) / refill_seconds | float(10)] | min }}
          wait_seconds: >-
            {{ [(((1 - refilled | float(0)) * refill_seconds | float(10)) + 0.999) | int(1), 1] | max
               if refilled | float(0) < 1 else 0 }}
      - if:
          - condition: template
            value_template: "{{ not desired_matches_pre | bool }}"
        then:
