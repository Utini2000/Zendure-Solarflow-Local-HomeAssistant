                  output_ts: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) }}"
                  actual_valid: >-
                    {{ output_ts | float(0) > 1
                       and (as_timestamp(now()) - output_ts | float(0)) < 20
