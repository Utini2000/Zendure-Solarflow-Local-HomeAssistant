      - variables:
          unit_output_limit: >-
            {{ [[states('input_number.zendure_conf_max_output_per_unit') | int(800), 0] | max, 800] | min }}
          configured_system_limit: >-
            {{ [[states('input_number.zendure_conf_max_output') | int(1000), 0] | max, 1000] | min }}
          system_output_limit: >-
            {{ [configured_system_limit | int(1000), (unit_output_limit | int(800)) * 2] | min }}
          peer_output_ts: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) }}"
          peer_output_age: "{{ as_timestamp(now()) - peer_output_ts | float(0) }}"
          peer_actual_fresh: >-
            {{ peer_output_age | float(9999) < 12 and is_number(states('sensor.solarflow_2_output_power')) }}
          peer_limit_ts: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) }}"
          peer_limit_age: "{{ as_timestamp(now()) - peer_limit_ts | float(0) }}"
          peer_confirmed_recent: "{{ peer_limit_ts > 1 and peer_limit_age < 30 }}"
          peer_dispatched: "{{ states('input_number.zendure_last_dispatched_2') | int(0) }}"
          peer_confirmed: "{{ states('input_number.zendure_confirmed_output_2') | int(0) }}"
          peer_actual: "{{ states('sensor.solarflow_2_output_power') | int(0) if peer_actual_fresh | bool else 0 }}"
          peer_conservative: >-
            {{ [peer_dispatched | int(0),
                (peer_confirmed | int(0) if peer_confirmed_recent | bool else 0),
                peer_actual | int(0), 0] | max }}
          transfer_peer_validation_ok: >-
            {{ peer_reserved_validated | bool
               and is_state('input_boolean.zendure_transfer_pending','on')
               and states('input_text.zendure_transfer_lower_unit') | lower == 'u2'
               and generation_value >= 0
               and generation_value == states('input_number.zendure_transfer_generation') | int(0)
               and generation_value == states('input_number.zendure_dispatch_generation') | int(0) }}
          reserved_peer: >-
            {% if transfer_peer_validation_ok | bool %}
              {{ [peer_reserved_input | int(0), 0] | max }}
            {% else %}
              {{ [peer_reserved_input | int(0), peer_conservative | int(0), 0] | max }}
            {% endif %}
          remaining_system_capacity: "{{ [system_output_limit | int(0) - reserved_peer | int(0), 0] | max }}"
          target: >-
            {{ [0, [requested_power | int(0), unit_output_limit | int(800), remaining_system_capacity | int(0)] | min] | max }}
          generation_current_final: "{{ states('input_number.zendure_dispatch_generation') | int(0) }}"
          generation_ok_final: "{{ generation_value < 0 or generation_value == generation_current_final }}"
          desired_before: "{{ states('input_number.zendure_last_sent_1') | int(0) }}"
          dispatched_before: "{{ states('input_number.zendure_last_dispatched_1') | int(0) }}"
          confirmed: "{{ states('input_number.zendure_confirmed_output_1') | int(0) }}"
          confirmed_ts: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) }}"
          confirmed_recent: "{{ confirmed_ts > 1 and (as_timestamp(now()) - confirmed_ts) < 30 }}"
          last_dispatch_ts: "{{ (state_attr('input_datetime.zendure_last_dispatch_ts_u1','timestamp') | float(0)) }}"
          pending_before_ts: "{{ (state_attr('input_datetime.zendure_output_pending_since_u1','timestamp') | float(0)) }}"
          new_command: "{{ target != dispatched_before }}"
          confirmed_after_last_dispatch: "{{ last_dispatch_ts <= 1 or confirmed_ts >= last_dispatch_ts }}"
          ack_needed: >-
            {{ new_command or target != confirmed or not confirmed_recent or not confirmed_after_last_dispatch }}
          actual_ts: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
          actual_valid: "{{ actual_ts > 1 and (as_timestamp(now()) - actual_ts) < 20 and is_number(states('sensor.solarflow_1_output_power')) }}"
          actual_now: "{{ states('sensor.solarflow_1_output_power') | float(0) if actual_valid | bool else 0 }}"
          grid_valid: "{{ is_number(states('sensor.zendure_grid_power')) }}"
          grid_now: "{{ states('sensor.zendure_grid_power') | float(0) if grid_valid | bool else 0 }}"
          grid_bias_now: "{{ states('input_number.zendure_conf_grid_bias') | float(10) }}"
          export_unresolved: >-
            {{ grid_valid | bool
               and (is_state('binary_sensor.solarflow_persistent_export_guard','on')
                    or grid_now | float(0) < grid_bias_now | float(10) - 50) }}
          zero_effect_missing: >-
            {{ target | int(0) == 0 and (
                 (actual_valid | bool and actual_now | float(0) > 30)
                 or (not actual_valid | bool and (
                       (confirmed_recent | bool and confirmed | int(0) > 0)
                       or export_unresolved | bool
                    ))
               ) }}
          needs_downward_effect: >-
            {{ zero_effect_missing | bool
               or target | int(0) < dispatched_before | int(0)
               or (
                 force_mode | bool
                 and (
                   (actual_valid | bool and actual_now | float(0) > target | float(0) + 30)
                   or (not actual_valid | bool and confirmed_recent | bool
                       and confirmed | int(0) > target | int(0) + 30)
                   or (not actual_valid | bool and not confirmed_recent | bool
                       and grid_now | float(0) < grid_bias_now | float(10) - 50)
                 )
               ) }}
          needs_upward_effect: >-
            {{ target | int(0) > dispatched_before | int(0)
               or (
                 force_mode | bool
                 and not needs_downward_effect | bool
                 and (
                   (actual_valid | bool and actual_now | float(0) < target | float(0) - 50
                    and grid_now | float(0) > grid_bias_now | float(10) + 100)
                   or (not actual_valid | bool and confirmed_recent | bool
                       and confirmed | int(0) < target | int(0) - 50
                       and grid_now | float(0) > grid_bias_now | float(10) + 100)
                 )
               ) }}
          retry_effect_needed: "{{ needs_downward_effect | bool or needs_upward_effect | bool }}"
          bucket_capacity: "{{ states('input_number.zendure_conf_write_bucket_capacity') | float(5) }}"
          refill_seconds: "{{ [states('input_number.zendure_conf_write_refill_seconds') | float(4), 0.5] | max }}"
          bucket_stored: "{{ states('input_number.zendure_write_tokens_u1') | float(bucket_capacity | float(5)) }}"
          bucket_ts: "{{ (state_attr('input_datetime.zendure_write_budget_ts_u1','timestamp') | float(0)) }}"
          bucket_elapsed: "{{ [as_timestamp(now()) - bucket_ts | float(0), 0] | max }}"
          bucket_refilled: >-
            {{ [bucket_capacity | float(5), bucket_stored | float(0)
                 + bucket_elapsed | float(0) / refill_seconds | float(4)] | min }}
          reserved_reduction_tokens_raw: "{{ states('input_number.zendure_conf_write_reserved_reduction_tokens') | float(1) }}"
          reserved_reduction_tokens: >-
            {{ [[reserved_reduction_tokens_raw | float(1), 0] | max,
                 [bucket_capacity | float(5) - 1, 0] | max] | min }}
          is_increase: "{{ needs_upward_effect | bool and not needs_downward_effect | bool }}"
          required_tokens: "{{ (1 + reserved_reduction_tokens | float(1)) if is_increase | bool else 1 }}"
          budget_available: "{{ bucket_refilled | float(0) >= required_tokens | float(1) }}"
          tokens_after_publish: "{{ [bucket_refilled | float(0) - 1, 0] | max | round(2) }}"
          token_wait_seconds: >-
            {{ [((((required_tokens | float(1)) - bucket_refilled | float(0)) * refill_seconds | float(4)) + 0.999) | int(1), 1] | max
                if not budget_available | bool else 1 }}
          next_retry_seconds: >-
            {% set age = as_timestamp(now()) - pending_before_ts if pending_before_ts > 1 else 0 %}
            {{ 10 if age < 60 else 30 if age < 300 else 60 }}
          publish_needed: >-
            {{ new_command | bool or (force_mode | bool and retry_effect_needed | bool) }}
          publish_allowed: >-
            {{ publish_needed | bool and budget_available | bool }}
      - if:
          - condition: template
            value_template: "{{ not generation_ok_final }}"
        then:
          - stop: "Stale U1 dispatch generation dropped immediately before publish."
      - if:
          - condition: template
            value_template: "{{ write_desired and target != desired_before }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_1 }
            data: { value: "{{ target }}" }
      - variables:
          generation_current_publish: "{{ states('input_number.zendure_dispatch_generation') | int(0) }}"
      - if:
          - condition: template
            value_template: "{{ generation_value >= 0 and generation_value != generation_current_publish }}"
        then:
          - stop: "Stale U1 dispatch generation dropped at publish boundary."
      - if:
          - condition: template
            value_template: "{{ publish_allowed | bool }}"
        then:
          - action: script.zendure_wire_publish_u1
            data:
              topic: !secret zendure_topic_u1_number_outputLimit_set
              payload: "{{ target }}"
              source: "{{ command_source }}"
              command_class: "output"
              generation: "{{ generation_value }}"
              desired_entity: "{{ 'input_number.zendure_last_sent_1' if coalesce_mode | bool else '' }}"
              desired_type: "number"
              expected_value: "{{ target }}"
              output_tokens_after: "{{ tokens_after_publish }}"
              output_budget_before: "{{ bucket_refilled }}"
              output_force: "{{ force_mode }}"
              output_safety_zero: "{{ safety_zero_mode }}"
              output_ensure_mode: "{{ ensure_mode }}"
              output_reassert_mode: "{{ reassert_mode }}"
              output_peer_reservation: "{{ peer_reserved_input }}"
              output_peer_reservation_validated: "{{ peer_reserved_validated }}"
              output_coalesce_latest: "{{ coalesce_mode }}"

      - if:
          - condition: template
            value_template: "{{ publish_needed | bool and not publish_allowed | bool }}"
        then:
          - action: script.zendure_store_deferred_u1
            data:
              target: "{{ target }}"
              force: "{{ force_mode }}"
              safety_zero: "{{ safety_zero_mode }}"
              ensure_output_mode: "{{ ensure_mode }}"
              reassert_output_mode: "{{ reassert_mode }}"
              generation: "{{ generation_value }}"
              source: "{{ command_source }}"
              peer_reservation: "{{ peer_reserved_input }}"
              peer_reservation_validated: "{{ peer_reserved_validated }}"
              coalesce_latest: "{{ coalesce_mode }}"
              duration: "{{ token_wait_seconds | int(1) }}"
