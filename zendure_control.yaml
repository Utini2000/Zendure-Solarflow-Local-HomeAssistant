################################################################################
#                   ZENDURE SOLARFLOW CONTROL PACKAGE (V185)                    #
################################################################################
#
# DESCRIPTION:
# Advanced local control for Zendure SolarFlow with Shelly 3EM.
# Features strict validation, safe math, and separate state/loop logic.
#
# Complete Changelog:
# https://github.com/Utini2000/Zendure-Solarflow-Local-HomeAssistant/blob/main/Changelog

# ==============================================================================
# 1. KONFIGURATION (Input Helpers)
# ==============================================================================
input_boolean:
  zendure_auto_mode:
    name: "Zendure Automatik Aktiv"
    icon: mdi:robot

  # Getrennte Helfer für Selective Emergency
  zendure_emergency_u1:
    name: "Intern: Status Not-Ladung U1"
    icon: mdi:battery-alert
    initial: off
  zendure_emergency_u2:
    name: "Intern: Status Not-Ladung U2"
    icon: mdi:battery-alert
    initial: off

  zendure_calib_mode_u1:
    name: "Status: Kalibrierung U1"
    icon: mdi:battery-sync
  zendure_calib_mode_u2:
    name: "Status: Kalibrierung U2"
    icon: mdi:battery-sync
  zendure_force_calib_u1:
    name: "Intern: Force Kalibrierung U1"
    icon: mdi:calendar-refresh
  zendure_force_calib_u2:
    name: "Intern: Force Kalibrierung U2"
    icon: mdi:calendar-refresh

  zendure_vguard_u1:
    name: "Status: Voltage Guard U1"
    icon: mdi:battery-heart-variant
  zendure_vguard_u2:
    name: "Status: Voltage Guard U2"
    icon: mdi:battery-heart-variant

  zendure_batt_temp_cooldown_u1:
    name: "Status: Batterie Temperatur-Cooldown U1"
    icon: mdi:thermometer-alert
  zendure_batt_temp_cooldown_u2:
    name: "Status: Batterie Temperatur-Cooldown U2"
    icon: mdi:thermometer-alert
  zendure_hub_temp_cooldown_u1:
    name: "Status: Hub/WR Temperatur-Cooldown U1"
    icon: mdi:thermometer-alert
  zendure_hub_temp_cooldown_u2:
    name: "Status: Hub/WR Temperatur-Cooldown U2"
    icon: mdi:thermometer-alert


  # Traffic guard: one best-effort 0W write per offline episode.
  zendure_offline_zero_attempted_u1:
    name: "Intern: Offline-0W Versuch U1"
    icon: mdi:wifi-off
  zendure_offline_zero_attempted_u2:
    name: "Intern: Offline-0W Versuch U2"
    icon: mdi:wifi-off

  # One immediate 0W bypass per real safety episode; only confirmed healthy positive operation rearms it.
  zendure_emergency_zero_bypass_used_u1:
    name: "Intern: Emergency-0W Bypass benutzt U1"
    icon: mdi:shield-bolt
  zendure_emergency_zero_bypass_used_u2:
    name: "Intern: Emergency-0W Bypass benutzt U2"
    icon: mdi:shield-bolt
  # Persistent marker: the conservative one-time bootstrap has completed before.
  zendure_runtime_guards_initialized:
    name: "Intern: Runtime-Schreibschutz jemals initialisiert"
    icon: mdi:shield-check
  # Per-start barrier. This always starts OFF and is enabled only after validation.
  zendure_runtime_writers_ready:
    name: "Intern: MQTT Writer bereit"
    icon: mdi:shield-check-outline
    initial: off

  # Priority-zero versus normal-wire interlock.
  zendure_wire_emergency_lock_u1:
    name: "Intern: Emergency Wire Lock U1"
    icon: mdi:lock-alert
    initial: off
  zendure_wire_emergency_lock_u2:
    name: "Intern: Emergency Wire Lock U2"
    icon: mdi:lock-alert
    initial: off

  # Deferred OutputLimit context. Safety context may only become stricter while queued.
  zendure_deferred_force_u1:
    name: "Intern: Deferred Force U1"
    initial: off
  zendure_deferred_force_u2:
    name: "Intern: Deferred Force U2"
    initial: off
  zendure_deferred_safety_zero_u1:
    name: "Intern: Deferred Safety Zero U1"
    initial: off
  zendure_deferred_safety_zero_u2:
    name: "Intern: Deferred Safety Zero U2"
    initial: off
  zendure_deferred_ensure_output_mode_u1:
    name: "Intern: Deferred Ensure Output Mode U1"
    initial: off
  zendure_deferred_ensure_output_mode_u2:
    name: "Intern: Deferred Ensure Output Mode U2"
    initial: off
  zendure_deferred_reassert_output_mode_u1:
    name: "Intern: Deferred Reassert Output Mode U1"
    initial: off
  zendure_deferred_reassert_output_mode_u2:
    name: "Intern: Deferred Reassert Output Mode U2"
    initial: off
  zendure_deferred_coalesce_latest_u1:
    name: "Intern: Deferred Coalesce Latest U1"
    initial: off
  zendure_deferred_coalesce_latest_u2:
    name: "Intern: Deferred Coalesce Latest U2"
    initial: off
  zendure_deferred_peer_validated_u1:
    name: "Intern: Deferred Peer Reservation Validated U1"
    initial: off
  zendure_deferred_peer_validated_u2:
    name: "Intern: Deferred Peer Reservation Validated U2"
    initial: off

  # V175: exactly one controlled unit-to-unit transfer may be pending.
  zendure_transfer_pending:
    name: "Intern: Pending Unit Transfer"
    icon: mdi:swap-horizontal
    initial: off

  zendure_bypass_u1:
    name: "Intern: Bypass Latch U1"
    icon: mdi:lock-clock
    initial: off
  zendure_bypass_u2:
    name: "Intern: Bypass Latch U2"
    icon: mdi:lock-clock
    initial: off
  zendure_conf_calib_isolation:
    name: "Kalibrierung: Andere Unit pausieren"
    icon: mdi:transmission-tower-off
    initial: off

  zendure_calib_discharge_u1:
    name: "Status: Kalibrierung Entladen U1"
    icon: mdi:battery-arrow-down
    initial: off
  zendure_calib_discharge_u2:
    name: "Status: Kalibrierung Entladen U2"
    icon: mdi:battery-arrow-down
    initial: off

timer:
  zendure_ack_retry_u1:
    name: "Intern: Output ACK Retry U1"
    duration: "00:00:10"
