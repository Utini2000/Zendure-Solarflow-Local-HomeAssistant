                  actual_output: "{{ states('sensor.solarflow_2_output_power') | float(0) if actual_valid | bool else 0 }}"
                  grid_valid: "{{ is_number(states('sensor.zendure_grid_power')) }}"
                  grid_now: "{{ states('sensor.zendure_grid_power') | float(0) if grid_valid | bool else 0 }}"
                  grid_bias: "{{ states('input_number.zendure_conf_grid_bias') | float(10) }}"
                  export_unresolved: >-
                    {{ grid_valid | bool
                       and (is_state('binary_sensor.solarflow_persistent_export_guard','on')
                            or grid_now | float(0) < grid_bias | float(10) - 50) }}
                  physical_zero: "{{ actual_valid | bool and actual_output | float(0) <= 30 }}"
                  zero_ack_safe: >-
                    {{ current_dispatched | int(0) != 0
                       or physical_zero | bool
                       or (not actual_valid | bool and grid_valid | bool and not export_unresolved | bool) }}
                  ack_matches_current: >-
                    {{ pending_ts | float(0) > 1
                       and dispatch_ts | float(0) > 1
                       and readback_ts | float(0) >= dispatch_ts | float(0)
                       and readback | int(0) == current_dispatched | int(0)
