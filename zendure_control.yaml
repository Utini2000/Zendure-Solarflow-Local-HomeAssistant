            target: { entity_id: input_datetime.zendure_last_any_publish_ts_u2 }
            data: { timestamp: "{{ dispatch_ts }}" }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_dispatch_ts_u2 }
            data: { timestamp: "{{ dispatch_ts }}" }
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_dispatched_2 }
            data: { value: 0 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_output_pending_since_u2 }
            data: { timestamp: "{{ dispatch_ts }}" }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_emergency_zero_bypass_used_u2 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_emergency_zero_ts_u2 }
            data: { timestamp: "{{ dispatch_ts }}" }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_last_output_publish_u2 }
            data:
              value: >-
                {{ now().isoformat() }}|u2|0W|{{ command_source }}|force=true|bypass=true|gen={{ generation_value }}|budget=emergency
          - event: zendure_outputlimit_publish
            event_data:
              unit: 2
              target: 0
              source: "{{ command_source }}"
              force: true
              emergency_bypass: true
              generation: "{{ generation_value }}"
              seconds_since_previous: "{{ (dispatch_ts | float(0) - last_any_publish_ts | float(0)) | round(3) }}"
              budget_before: emergency
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_wire_emergency_lock_u2 }
          - action: timer.start
            target: { entity_id: timer.zendure_ack_retry_u2 }
            data: { duration: 10 }
        else:
          - if:
              - condition: template
                value_template: "{{ zero_effect_needed | bool and (bypass_used | bool or not emergency_bypass_cooldown_ok | bool) }}"
            then:
              - action: script.zendure_dispatch_u2_output
                data:
                  power: 0
                  ensure_output_mode: false
                  force: true
                  reassert_output_mode: false
                  generation: "{{ states('input_number.zendure_dispatch_generation') | int(0) }}"
                  update_desired: false
                  coalesce_latest: false
                  peer_reservation: 0
                  peer_reservation_validated: false
                  safety_zero: true
