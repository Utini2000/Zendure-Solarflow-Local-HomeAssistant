# ==============================================================================
# 5. SCRIPTS (RESET/SAFETY HELPERS)
# ==============================================================================
script:
  zendure_set_u1_outputlimit_zero:
    alias: "Zendure: U1 OutputLimit -> 0W"
    mode: restart
    fields:
      source: { description: "Diagnostic safety-zero source" }
    sequence:
      - action: script.zendure_clear_pending_transfer
      - variables:
          generation_invalidate: "{{ ((as_timestamp(now()) * 1000000) | int) % 1000000000 }}"
      - if:
          - condition: template
            value_template: "{{ states('input_number.zendure_last_sent_1') | int(0) != 0 }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_1 }
            data: { value: 0 }
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_dispatch_generation }
        data: { value: "{{ generation_invalidate }}" }
      - action: script.zendure_dispatch_u1_emergency_zero
        data:
          generation: "{{ generation_invalidate }}"
          update_desired: true
          source: "{{ source | default('safety_zero') }}"

  zendure_set_u2_outputlimit_zero:
    alias: "Zendure: U2 OutputLimit -> 0W"
    mode: restart
    fields:
      source: { description: "Diagnostic safety-zero source" }
    sequence:
      - action: script.zendure_clear_pending_transfer
      - variables:
          generation_invalidate: "{{ ((as_timestamp(now()) * 1000000) | int) % 1000000000 }}"
      - if:
          - condition: template
            value_template: "{{ states('input_number.zendure_last_sent_2') | int(0) != 0 }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_2 }
            data: { value: 0 }
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_dispatch_generation }
        data: { value: "{{ generation_invalidate }}" }
      - action: script.zendure_dispatch_u2_emergency_zero
        data:
          generation: "{{ generation_invalidate }}"
          update_desired: true
          source: "{{ source | default('safety_zero') }}"

  zendure_clear_deferred_u1:
    alias: "Zendure: Clear Deferred Output U1"
    mode: restart
    max_exceeded: warning
    sequence:
      - action: timer.cancel
        target: { entity_id: timer.zendure_writer_deferred_u1 }
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.zendure_deferred_force_u1
            - input_boolean.zendure_deferred_safety_zero_u1
            - input_boolean.zendure_deferred_ensure_output_mode_u1
            - input_boolean.zendure_deferred_reassert_output_mode_u1
            - input_boolean.zendure_deferred_coalesce_latest_u1
            - input_boolean.zendure_deferred_peer_validated_u1
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.zendure_deferred_target_u1
            - input_number.zendure_deferred_generation_u1
            - input_number.zendure_deferred_peer_reservation_u1
        data: { value: 0 }
      - action: input_text.set_value
        target: { entity_id: input_text.zendure_deferred_source_u1 }
        data: { value: "none" }

  zendure_clear_deferred_u2:
    alias: "Zendure: Clear Deferred Output U2"
    mode: restart
    max_exceeded: warning
    sequence:
      - action: timer.cancel
        target: { entity_id: timer.zendure_writer_deferred_u2 }
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.zendure_deferred_force_u2
            - input_boolean.zendure_deferred_safety_zero_u2
            - input_boolean.zendure_deferred_ensure_output_mode_u2
            - input_boolean.zendure_deferred_reassert_output_mode_u2
            - input_boolean.zendure_deferred_coalesce_latest_u2
            - input_boolean.zendure_deferred_peer_validated_u2
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.zendure_deferred_target_u2
            - input_number.zendure_deferred_generation_u2
            - input_number.zendure_deferred_peer_reservation_u2
        data: { value: 0 }
      - action: input_text.set_value
        target: { entity_id: input_text.zendure_deferred_source_u2 }
        data: { value: "none" }

  zendure_store_deferred_u1:
    alias: "Zendure: Store Deferred Output U1"
    mode: restart
    max_exceeded: warning
    fields:
      target: { description: "Deferred target" }
      force: { description: "Preserve forced retry semantics" }
      safety_zero: { description: "Preserve safety-zero semantics" }
      ensure_output_mode: { description: "Preserve output-mode request" }
      reassert_output_mode: { description: "Preserve mode reassert request" }
      generation: { description: "Dispatch generation" }
      source: { description: "Original diagnostic source" }
      peer_reservation: { description: "Peer reservation" }
      peer_reservation_validated: { description: "Physical peer validation" }
      coalesce_latest: { description: "Use latest desired target" }
      duration: { description: "Retry delay in seconds" }
    sequence:
      - variables:
          existing_safety: "{{ is_state('input_boolean.zendure_deferred_safety_zero_u1','on') }}"
          incoming_safety: "{{ safety_zero | default(false) | bool }}"
          merged_safety: "{{ existing_safety | bool or incoming_safety | bool }}"
          existing_force: "{{ is_state('input_boolean.zendure_deferred_force_u1','on') }}"
          merged_force: "{{ existing_force | bool or force | default(false) | bool or merged_safety | bool }}"
          target_value: "{{ 0 if merged_safety | bool else [0, [target | int(0), 800] | min] | max }}"
          ensure_value: "{{ false if merged_safety | bool else ensure_output_mode | default(true) | bool }}"
          reassert_value: "{{ false if merged_safety | bool else reassert_output_mode | default(false) | bool }}"
          coalesce_value: "{{ false if merged_safety | bool else coalesce_latest | default(false) | bool }}"
          generation_value: >-
            {{ generation | int(-1) if generation | default(-1) | int(-1) >= 0
               else states('input_number.zendure_dispatch_generation') | int(0) }}
          peer_value: "{{ 0 if merged_safety | bool else [0, [peer_reservation | default(0) | int(0), 800] | min] | max }}"
          peer_valid_value: "{{ false if merged_safety | bool else peer_reservation_validated | default(false) | bool }}"
          source_value: >-
            {% if incoming_safety | bool %}{{ source | default('deferred_safety_zero') }}
            {% elif existing_safety | bool %}{{ states('input_text.zendure_deferred_source_u1') }}
            {% else %}{{ source | default('writer_deferred') }}{% endif %}
          duration_value: "{{ [duration | default(1) | int(1), 1] | max }}"
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_deferred_target_u1 }
        data: { value: "{{ target_value }}" }
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_deferred_generation_u1 }
        data: { value: "{{ generation_value }}" }
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_deferred_peer_reservation_u1 }
        data: { value: "{{ peer_value }}" }
      - action: input_text.set_value
        target: { entity_id: input_text.zendure_deferred_source_u1 }
        data: { value: "{{ source_value }}" }
      - choose:
          - conditions: "{{ merged_force | bool }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_deferred_force_u1 }
        default:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_deferred_force_u1 }
      - choose:
          - conditions: "{{ merged_safety | bool }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_deferred_safety_zero_u1 }
        default:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_deferred_safety_zero_u1 }
      - choose:
          - conditions: "{{ ensure_value | bool }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_deferred_ensure_output_mode_u1 }
        default:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_deferred_ensure_output_mode_u1 }
      - choose:
          - conditions: "{{ reassert_value | bool }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_deferred_reassert_output_mode_u1 }
        default:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_deferred_reassert_output_mode_u1 }
      - choose:
          - conditions: "{{ coalesce_value | bool }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_deferred_coalesce_latest_u1 }
        default:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_deferred_coalesce_latest_u1 }
      - choose:
          - conditions: "{{ peer_valid_value | bool }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_deferred_peer_validated_u1 }
        default:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_deferred_peer_validated_u1 }
      - action: timer.start
        target: { entity_id: timer.zendure_writer_deferred_u1 }
        data: { duration: "{{ duration_value }}" }

  zendure_store_deferred_u2:
    alias: "Zendure: Store Deferred Output U2"
    mode: restart
    max_exceeded: warning
    fields:
      target: { description: "Deferred target" }
