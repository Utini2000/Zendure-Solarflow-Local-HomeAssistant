    alias: "Zendure: Manual Emergency Start U1"
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.zendure_vguard_u1
            - input_boolean.zendure_calib_discharge_u1
            - input_boolean.zendure_calib_mode_u1
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
        data: { timestamp: 0 }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.zendure_emergency_u1 }
      - variables:
          charge_temp_cap_u1: "{{ states('sensor.solarflow_1_charge_temperature_cap') | int(0) }}"
          soc1: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
          ss1: "{{ 300 if soc1 < 12 else 800 }}"
          limit_emerg_u1: "{{ [300, charge_temp_cap_u1 | int(0), ss1 | int] | min }}"
      - action: script.zendure_dispatch_u1_ac_mode
        data:
          mode: "Input mode"
          force: true
      - action: script.zendure_set_u1_outputlimit_zero
      - action: script.zendure_dispatch_u1_inputlimit
        data:
          power: "{{ limit_emerg_u1|int }}"
          force: true
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_last_sent_1 }
        data: { value: 0 }
      - action: notify.send_message
        target:
          entity_id: !secret telegram_id1
        data:
          message: "🛠️ *Manuelle Notladung U1*\nGestartet (Input mode, InputLimit {{ limit_emerg_u1|int }}W)."

  zendure_start_emergency_u2_manual:
    alias: "Zendure: Manual Emergency Start U2"
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.zendure_vguard_u2
            - input_boolean.zendure_calib_discharge_u2
            - input_boolean.zendure_calib_mode_u2
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
        data: { timestamp: 0 }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.zendure_emergency_u2 }
      - variables:
          charge_temp_cap_u2: "{{ states('sensor.solarflow_2_charge_temperature_cap') | int(0) }}"
          soc2: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
          ss2: "{{ 300 if soc2 < 12 else 800 }}"
          limit_emerg_u2: "{{ [300, charge_temp_cap_u2 | int(0), ss2 | int] | min }}"
      - action: script.zendure_dispatch_u2_ac_mode
        data:
          mode: "Input mode"
          force: true
      - action: script.zendure_set_u2_outputlimit_zero
      - action: script.zendure_dispatch_u2_inputlimit
        data:
          power: "{{ limit_emerg_u2|int }}"
          force: true
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_last_sent_2 }
        data: { value: 0 }
      - action: notify.send_message
        target:
          entity_id: !secret telegram_id1
        data:
          message: "🛠️ *Manuelle Notladung U2*\nGestartet (Input mode, InputLimit {{ limit_emerg_u2|int }}W)."

  zendure_reset_u1_output_safe:
    alias: "Zendure: Reset U1 auf Output 0W"
    mode: restart
    sequence:
      # Remove dangerous output first. This priority path is independent of the
      # configuration token budget and is attempted even with stale status data.
      - action: script.zendure_set_u1_outputlimit_zero
        data:
          source: "reset_output_safe"
      # Configuration cleanup follows only when the unit status is usable.
      - if:
          - condition: template
            value_template: "{{ states('sensor.solarflow_1_status_raw') | upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
        then:
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: 0
              force: true
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_ac_mode_u1 }
            data: { value: "Output mode" }
          - if:
              - condition: template
                value_template: "{{ states('sensor.solarflow_1_ac_mode') != 'Output mode' }}"
            then:
              - action: script.zendure_dispatch_u1_ac_mode
                data:
                  mode: "Output mode"
                  force: true

  zendure_reset_u2_output_safe:
    alias: "Zendure: Reset U2 auf Output 0W"
    mode: restart
    sequence:
      # Remove dangerous output first. This priority path is independent of the
      # configuration token budget and is attempted even with stale status data.
      - action: script.zendure_set_u2_outputlimit_zero
        data:
          source: "reset_output_safe"
      # Configuration cleanup follows only when the unit status is usable.
      - if:
          - condition: template
            value_template: "{{ states('sensor.solarflow_2_status_raw') | upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
        then:
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: 0
              force: true
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_ac_mode_u2 }
            data: { value: "Output mode" }
          - if:
              - condition: template
                value_template: "{{ states('sensor.solarflow_2_ac_mode') != 'Output mode' }}"
            then:
              - action: script.zendure_dispatch_u2_ac_mode
                data:
                  mode: "Output mode"
                  force: true

# ==============================================================================
# 6. AUTOMATISIERUNGEN
# ==============================================================================
automation:
  # --- 5.0 INPUT-LIMIT ACK SYNC ---
  - alias: "Zendure: Sync U1 InputLimit Memory from MQTT"
    id: "zendure_sync_u1_inputlimit_memory_from_mqtt"
    mode: queued
    initial_state: true
    triggers:
      - trigger: state
        entity_id: sensor.solarflow_1_input_limit
        id: "u1_inputlimit_changed"
        for: "00:00:02"
      - trigger: homeassistant
        event: start
        id: "startup"
    conditions:
      - condition: template
        value_template: >
          {% set real = states('sensor.solarflow_1_input_limit') %}
          {% set mem = states('input_number.zendure_last_inputlimit_u1') | int(-1) %}
          {% set hb = states.sensor.solarflow_1_status_raw %}
          {% set hb_ok = hb is not none and hb.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(hb.last_reported, default=0)) < 300 %}
          {{ hb_ok and is_number(real) and (real | int(0)) != mem }}
    actions:
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_last_inputlimit_u1 }
        data:
          value: "{{ [[states('sensor.solarflow_1_input_limit') | int(0),0]|max,800]|min }}"


  - alias: "Zendure: Sync U2 InputLimit Memory from MQTT"
    id: "zendure_sync_u2_inputlimit_memory_from_mqtt"
    mode: queued
    initial_state: true
    triggers:
      - trigger: state
        entity_id: sensor.solarflow_2_input_limit
        id: "u2_inputlimit_changed"
        for: "00:00:02"
      - trigger: homeassistant
        event: start
        id: "startup"
    conditions:
      - condition: template
        value_template: >
          {% set real = states('sensor.solarflow_2_input_limit') %}
          {% set mem = states('input_number.zendure_last_inputlimit_u2') | int(-1) %}
          {% set hb = states.sensor.solarflow_2_status_raw %}
          {% set hb_ok = hb is not none and hb.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(hb.last_reported, default=0)) < 300 %}
          {{ hb_ok and is_number(real) and (real | int(0)) != mem }}
    actions:
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_last_inputlimit_u2 }
        data:
          value: "{{ [[states('sensor.solarflow_2_input_limit') | int(0),0]|max,800]|min }}"

  # --- 5.1 KILL SWITCH ---
  - alias: "Zendure: Safety Kill Switch (Auto-Mode OFF)"
    id: "zendure_safety_kill_switch"
    mode: restart
    initial_state: true
    triggers:
      - trigger: state
        entity_id: input_boolean.zendure_auto_mode
        to: "off"
        id: "off"
      - trigger: state
        entity_id: input_boolean.zendure_auto_mode
        to: "on"
        id: "on"
    actions:
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'on' }}"
        then:
          - stop: "Auto-Mode switched ON. Kill-Switch cancelled."

      - action: script.zendure_clear_pending_transfer

      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.zendure_emergency_u1
            - input_boolean.zendure_emergency_u2
            - input_boolean.zendure_calib_mode_u1
            - input_boolean.zendure_calib_mode_u2
            - input_boolean.zendure_vguard_u1
            - input_boolean.zendure_vguard_u2
            - input_boolean.zendure_calib_discharge_u1
            - input_boolean.zendure_calib_discharge_u2
            - input_boolean.zendure_force_calib_u1
            - input_boolean.zendure_force_calib_u2

      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.zendure_natural_full_hold_start_u1 }
        data: { timestamp: 0 }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.zendure_natural_balance_start_u1 }
        data: { timestamp: 0 }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.zendure_natural_full_hold_start_u2 }
        data: { timestamp: 0 }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.zendure_natural_balance_start_u2 }
        data: { timestamp: 0 }

      - repeat:
          count: 3
          sequence:
            - condition: state
              entity_id: input_boolean.zendure_auto_mode
              state: "off"

            - parallel:
                - action: script.zendure_reset_u1_output_safe
                - action: script.zendure_reset_u2_output_safe
            - delay: "00:00:01"

# --- 6.0 INITIALIZATION ---
  - alias: "Zendure: Runtime Write Guards Bootstrap"
    id: "zendure_runtime_write_guards_bootstrap"
    mode: single
    max_exceeded: warning
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      # writers_ready is deliberately non-persistent and starts OFF on every HA start.
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.zendure_runtime_writers_ready }
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.zendure_wire_emergency_lock_u1
            - input_boolean.zendure_wire_emergency_lock_u2
      - action: script.zendure_clear_deferred_u1
      - action: script.zendure_clear_deferred_u2
      - delay: "00:00:01"
      - variables:
          first_init: "{{ not is_state('input_boolean.zendure_runtime_guards_initialized','on') }}"
          now_ts: "{{ now().timestamp() }}"
          out_cap: "{{ states('input_number.zendure_conf_write_bucket_capacity') | float(5) }}"
          cfg_cap: "{{ states('input_number.zendure_conf_config_bucket_capacity') | float(3) }}"
      - if:
          - condition: template
            value_template: "{{ first_init | bool }}"
        then:
          - parallel:
              - action: input_number.set_value
                target:
                  entity_id:
                    - input_number.zendure_write_tokens_u1
                    - input_number.zendure_write_tokens_u2
                data: { value: 1 }
              - action: input_number.set_value
                target:
                  entity_id:
                    - input_number.zendure_config_write_tokens_u1
                    - input_number.zendure_config_write_tokens_u2
                data: { value: 0 }
              - action: input_datetime.set_datetime
                target:
                  entity_id:
                    - input_datetime.zendure_write_budget_ts_u1
                    - input_datetime.zendure_write_budget_ts_u2
                    - input_datetime.zendure_config_write_budget_ts_u1
                    - input_datetime.zendure_config_write_budget_ts_u2
                    - input_datetime.zendure_last_emergency_zero_ts_u1
                    - input_datetime.zendure_last_emergency_zero_ts_u2
                    - input_datetime.zendure_last_any_publish_ts_u1
                    - input_datetime.zendure_last_any_publish_ts_u2
                data: { timestamp: "{{ now_ts }}" }
              - action: input_boolean.turn_on
                target:
                  entity_id:
                    - input_boolean.zendure_emergency_zero_bypass_used_u1
                    - input_boolean.zendure_emergency_zero_bypass_used_u2
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_runtime_guards_initialized }
        else:
          - parallel:
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_number(states('input_number.zendure_write_tokens_u1'))
                         or states('input_number.zendure_write_tokens_u1') | float(-1) < 0
                         or states('input_number.zendure_write_tokens_u1') | float(99) > out_cap | float(5) }}
                then:
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_write_tokens_u1 }
                    data: { value: 1 }
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_number(states('input_number.zendure_write_tokens_u2'))
                         or states('input_number.zendure_write_tokens_u2') | float(-1) < 0
                         or states('input_number.zendure_write_tokens_u2') | float(99) > out_cap | float(5) }}
                then:
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_write_tokens_u2 }
                    data: { value: 1 }
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_number(states('input_number.zendure_config_write_tokens_u1'))
                         or states('input_number.zendure_config_write_tokens_u1') | float(-1) < 0
                         or states('input_number.zendure_config_write_tokens_u1') | float(99) > cfg_cap | float(3) }}
                then:
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_config_write_tokens_u1 }
                    data: { value: 0 }
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_number(states('input_number.zendure_config_write_tokens_u2'))
                         or states('input_number.zendure_config_write_tokens_u2') | float(-1) < 0
                         or states('input_number.zendure_config_write_tokens_u2') | float(99) > cfg_cap | float(3) }}
                then:
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_config_write_tokens_u2 }
                    data: { value: 0 }
              - if:
                  - condition: template
                    value_template: "{{ (state_attr('input_datetime.zendure_write_budget_ts_u1','timestamp') | float(0)) <= 1 }}"
                then:
                  - action: input_datetime.set_datetime
                    target: { entity_id: input_datetime.zendure_write_budget_ts_u1 }
                    data: { timestamp: "{{ now_ts }}" }
              - if:
                  - condition: template
                    value_template: "{{ (state_attr('input_datetime.zendure_write_budget_ts_u2','timestamp') | float(0)) <= 1 }}"
                then:
                  - action: input_datetime.set_datetime
                    target: { entity_id: input_datetime.zendure_write_budget_ts_u2 }
                    data: { timestamp: "{{ now_ts }}" }
              - if:
                  - condition: template
                    value_template: "{{ (state_attr('input_datetime.zendure_config_write_budget_ts_u1','timestamp') | float(0)) <= 1 }}"
                then:
                  - action: input_datetime.set_datetime
                    target: { entity_id: input_datetime.zendure_config_write_budget_ts_u1 }
                    data: { timestamp: "{{ now_ts }}" }
              - if:
                  - condition: template
                    value_template: "{{ (state_attr('input_datetime.zendure_config_write_budget_ts_u2','timestamp') | float(0)) <= 1 }}"
                then:
                  - action: input_datetime.set_datetime
                    target: { entity_id: input_datetime.zendure_config_write_budget_ts_u2 }
                    data: { timestamp: "{{ now_ts }}" }
              - if:
                  - condition: template
                    value_template: "{{ (state_attr('input_datetime.zendure_last_any_publish_ts_u1','timestamp') | float(0)) <= 1 }}"
                then:
                  - action: input_datetime.set_datetime
                    target: { entity_id: input_datetime.zendure_last_any_publish_ts_u1 }
                    data: { timestamp: "{{ now_ts }}" }
              - if:
                  - condition: template
                    value_template: "{{ (state_attr('input_datetime.zendure_last_any_publish_ts_u2','timestamp') | float(0)) <= 1 }}"
                then:
                  - action: input_datetime.set_datetime
                    target: { entity_id: input_datetime.zendure_last_any_publish_ts_u2 }
                    data: { timestamp: "{{ now_ts }}" }
      # Validate restored emergency timing/latches conservatively before opening writers.
      - if:
          - condition: template
            value_template: "{{ state_attr('input_datetime.zendure_last_emergency_zero_ts_u1','timestamp') | float(0) <= 1 }}"
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_emergency_zero_ts_u1 }
            data: { timestamp: "{{ now_ts }}" }
      - if:
          - condition: template
            value_template: "{{ state_attr('input_datetime.zendure_last_emergency_zero_ts_u2','timestamp') | float(0) <= 1 }}"
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_emergency_zero_ts_u2 }
            data: { timestamp: "{{ now_ts }}" }
      - if:
          - condition: template
            value_template: "{{ states('input_boolean.zendure_emergency_zero_bypass_used_u1') not in ['on','off'] }}"
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_emergency_zero_bypass_used_u1 }
      - if:
          - condition: template
            value_template: "{{ states('input_boolean.zendure_emergency_zero_bypass_used_u2') not in ['on','off'] }}"
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_emergency_zero_bypass_used_u2 }
      # Last bootstrap action: all restored runtime guards are now safe to use.
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.zendure_runtime_writers_ready }

  - alias: "Zendure: Initialize Calibration Timer"
    id: "zendure_init_calib_timer"
    mode: single
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          ts_now: "{{ as_timestamp(now()) | int(0) }}"
      - if:
          - condition: template
            value_template: >
              {{ states('input_datetime.zendure_last_full_charge_1') in ['unknown', 'unavailable', 'none'] }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_1 }
            data: { timestamp: "{{ ts_now }}" }
      - if:
          - condition: template
            value_template: >
              {{ states('input_datetime.zendure_last_full_charge_2') in ['unknown', 'unavailable', 'none'] }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_2 }
            data: { timestamp: "{{ ts_now }}" }
      - if:
          - condition: template
            value_template: >
              {{ as_timestamp(states('input_datetime.zendure_last_full_charge_1'), default=0) < 946684800 }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_1 }
            data: { timestamp: "{{ ts_now }}" }
      - if:
          - condition: template
            value_template: >
              {{ as_timestamp(states('input_datetime.zendure_last_full_charge_2'), default=0) < 946684800 }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_2 }
            data: { timestamp: "{{ ts_now }}" }
      - variables:
          soc_off: "{{ states('input_number.zendure_conf_soc_off') | float(20) }}"
          min_out: "{{ states('input_number.zendure_conf_vguard_set_min_output') | float(30) }}"
      - if:
          - condition: state
            entity_id: input_boolean.zendure_vguard_u1
            state: "on"
        then:
          - action: script.zendure_set_u1_outputlimit_zero
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_1 }
            data: { value: 0 }
      - if:
          - condition: state
            entity_id: input_boolean.zendure_vguard_u2
            state: "on"
        then:
          - action: script.zendure_set_u2_outputlimit_zero
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_2 }
            data: { value: 0 }
      - if:
          - condition: template
            value_template: >
              {% set vmin = states('sensor.solarflow_1_cell_min_vol')|float(99) %}
              {% set soc = states('sensor.solarflow_1_battery_level')|float(100) %}
              {% set out_pwr = states('sensor.solarflow_1_output_power')|float(0) %}
              {% set normal_set = (soc <= (soc_off + 8) and vmin <= 3.02 and out_pwr > min_out) %}
              {% set hard_set = (soc <= (soc_off + 4) and vmin > 2.0 and vmin <= 2.95) %}
              {{ is_state('input_boolean.zendure_auto_mode','on')
                 and is_state('input_boolean.zendure_calib_discharge_u1','off')
                 and is_state('input_boolean.zendure_calib_mode_u1','off')
                 and is_state('input_boolean.zendure_emergency_u1','off')
                 and states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                 and (normal_set or hard_set) }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_vguard_u1 }
          - action: script.zendure_set_u1_outputlimit_zero
      - if:
          - condition: template
            value_template: >
              {% set vmin = states('sensor.solarflow_2_cell_min_vol')|float(99) %}
              {% set soc = states('sensor.solarflow_2_battery_level')|float(100) %}
              {% set out_pwr = states('sensor.solarflow_2_output_power')|float(0) %}
              {% set normal_set = (soc <= (soc_off + 8) and vmin <= 3.02 and out_pwr > min_out) %}
              {% set hard_set = (soc <= (soc_off + 4) and vmin > 2.0 and vmin <= 2.95) %}
              {{ is_state('input_boolean.zendure_auto_mode','on')
                 and is_state('input_boolean.zendure_calib_discharge_u2','off')
                 and is_state('input_boolean.zendure_calib_mode_u2','off')
                 and is_state('input_boolean.zendure_emergency_u2','off')
                 and states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                 and (normal_set or hard_set) }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_vguard_u2 }
          - action: script.zendure_set_u2_outputlimit_zero

  # --- 6.1 CONFIRMED OUTPUT SYNC ON STARTUP ---
  - alias: "Zendure: Sync Confirmed Output on Start"
    id: "zendure_sync_confirmed_on_start"
    mode: single
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:10"
      - parallel:
          - if:
              - condition: template
                value_template: >-
                  {{ is_number(states('sensor.solarflow_1_output_limit'))
                     and states('sensor.solarflow_1_status_raw') | upper
                         not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                     and (as_timestamp(now()) - as_timestamp(
                          state_attr('sensor.solarflow_1_mqtt_freshness','status_ts'), 0)) < 300
                     and (as_timestamp(now()) - as_timestamp(
                          state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0)) < 30 }}
            then:
              - variables:
                  readback: "{{ [[states('sensor.solarflow_1_output_limit') | int(0), 0] | max, 800] | min }}"
                  readback_ts: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) }}"
                  pending_ts: "{{ state_attr('input_datetime.zendure_output_pending_since_u1','timestamp') | float(0) }}"
                  dispatch_ts: "{{ state_attr('input_datetime.zendure_last_dispatch_ts_u1','timestamp') | float(0) }}"
                  current_dispatched: "{{ states('input_number.zendure_last_dispatched_1') | int(0) }}"
                  current_desired: "{{ states('input_number.zendure_last_sent_1') | int(0) }}"
                  auto_off: "{{ is_state('input_boolean.zendure_auto_mode','off') }}"
                  output_ts: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
                  actual_valid: >-
                    {{ output_ts | float(0) > 1
                       and (as_timestamp(now()) - output_ts | float(0)) < 20
                       and is_number(states('sensor.solarflow_1_output_power')) }}
                  actual_output: "{{ states('sensor.solarflow_1_output_power') | float(0) if actual_valid | bool else 0 }}"
                  grid_valid: "{{ is_number(states('sensor.zendure_grid_power')) }}"
                  grid_now: "{{ states('sensor.zendure_grid_power') | float(0) if grid_valid | bool else 0 }}"
                  grid_bias: "{{ states('input_number.zendure_conf_grid_bias') | float(10) }}"
                  export_unresolved: >-
                    {{ grid_valid | bool
                       and (is_state('binary_sensor.solarflow_persistent_export_guard','on')
                            or grid_now | float(0) < grid_bias | float(10) - 50) }}
                  physical_zero: "{{ actual_valid | bool and actual_output | float(0) <= 30 }}"
                  zero_ack_safe: >-
                    {{ current_dispatched | int(0) != 0
                       or physical_zero | bool
                       or (not actual_valid | bool and grid_valid | bool and not export_unresolved | bool) }}
                  ack_matches_current: >-
                    {{ pending_ts | float(0) > 1
                       and dispatch_ts | float(0) > 1
                       and readback_ts | float(0) >= dispatch_ts | float(0)
                       and readback | int(0) == current_dispatched | int(0)
                       and zero_ack_safe | bool }}
                  zero_still_needed: >-
                    {{ (auto_off | bool or current_desired | int(0) == 0)
                       and (readback | int(0) > 0
                            or (actual_valid | bool and actual_output | float(0) > 30)
                            or (not actual_valid | bool and export_unresolved | bool)) }}
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_confirmed_output_1 }
                data: { value: "{{ readback }}" }
              - if:
                  - condition: template
                    value_template: "{{ ack_matches_current | bool }}"
                then:
                  - action: input_datetime.set_datetime
                    target: { entity_id: input_datetime.zendure_output_pending_since_u1 }
                    data: { datetime: "1970-01-01 00:00:00" }
                  - action: timer.cancel
                    target: { entity_id: timer.zendure_ack_retry_u1 }
              - if:
