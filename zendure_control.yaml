      - name: "SolarFlow 1 Output Block Reason"
        unique_id: solarflow_1_output_block_reason
        default_entity_id: sensor.solarflow_1_output_block_reason
        icon: mdi:shield-alert
        state: >
          {% set status = states('sensor.solarflow_1_status_raw') | upper %}
          {% set hb = states.sensor.solarflow_1_status_raw %}
          {% set now_ts = as_timestamp(now()) %}
          {% set hb_fresh = hb is not none and (now_ts - as_timestamp(hb.last_reported, 0)) < 300 %}
          {% set vmin_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness', 'vmin_ts'), 0) %}
          {% set batt_temp_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness', 'battery_temp_ts'), 0) %}
          {% set hub_temp_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness', 'hub_temp_ts'), 0) %}
          {% set vmin_valid_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness', 'vmin_valid_ts'), 0) %}
          {% set batt_temp_valid_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness', 'battery_temp_valid_ts'), 0) %}
          {% set hub_temp_valid_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness', 'hub_temp_valid_ts'), 0) %}
          {% set telemetry_seen = vmin_ts > 1 and (batt_temp_ts > 1 or hub_temp_ts > 1) %}
          {% set vmin_age = now_ts - vmin_ts %}
          {% set batt_temp_age = now_ts - batt_temp_ts %}
          {% set hub_temp_age = now_ts - hub_temp_ts %}
          {% set vmin_valid_age = now_ts - vmin_valid_ts %}
          {% set batt_temp_valid_age = now_ts - batt_temp_valid_ts %}
          {% set hub_temp_valid_age = now_ts - hub_temp_valid_ts %}
          {% set soc = states('sensor.solarflow_1_battery_level') | float(-1) %}
          {% set soc_off = states('input_number.zendure_conf_soc_off') | float(20) %}
          {% set vmin_state = states('sensor.solarflow_1_cell_min_vol') %}
          {% set vmin = vmin_state | float(0) %}
          {% set reason = states('input_text.zendure_bypass_reason_u1') %}
          {% set batt_temp_state = states('sensor.solarflow_1_battery_temp_control') %}
          {% set hub_temp_state = states('sensor.solarflow_1_hub_temp_control') %}
          {% set batt_temp = batt_temp_state | float(999) %}
          {% set hub_temp = hub_temp_state | float(999) %}
          {% set batt_temp_valid = batt_temp_valid_age < 300 and is_number(batt_temp_state) %}
          {% set hub_temp_valid = hub_temp_valid_age < 300 and is_number(hub_temp_state) %}
          {% if status in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %} status_offline
          {% elif not hb_fresh %} heartbeat_stale
          {% elif is_state('input_boolean.zendure_vguard_u1','on') %} vguard_latch
          {% elif is_state('input_boolean.zendure_emergency_u1','on') %} emergency_charge
          {% elif is_state('input_boolean.zendure_calib_mode_u1','on') %} calibration_mode
          {% elif is_state('input_boolean.zendure_calib_discharge_u1','on') %} discharging_calib
          {% elif soc < 0 %} soc_invalid
          {% elif is_state('input_boolean.zendure_bypass_u1','on') and reason == 'vmin_early_stop' %} vmin_early_stop
          {% elif is_state('input_boolean.zendure_bypass_u1','on') and reason == 'soc_off_stop' %} soc_off_guard
          {% elif soc <= soc_off %} soc_off_guard
          {% elif is_state('input_boolean.zendure_bypass_u1','on') %} bypass_wait_restart
          {% elif not telemetry_seen %} telemetry_initializing
          {% elif vmin_age >= 300 %} vmin_stale
          {% elif vmin_valid_age >= 300 or not is_number(vmin_state) or vmin <= 0 %} vmin_invalid
          {% elif vmin < 3.00 %} vmin_hard_guard
          {% elif vmin < 3.05 %} vmin_softcap_deep
          {% elif vmin < 3.12 %} vmin_pv_only_guard
          {% elif not batt_temp_valid and not hub_temp_valid and batt_temp_age >= 300 and hub_temp_age >= 300 %} temperature_both_stale
          {% elif not batt_temp_valid and not hub_temp_valid %} temperature_both_invalid
          {% elif batt_temp_valid and (is_state('input_boolean.zendure_batt_temp_cooldown_u1','on') or batt_temp >= 58) %} battery_temp_cooldown_58
          {% elif hub_temp_valid and (is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') or hub_temp >= 65) %} hub_temp_cooldown_65
          {% elif batt_temp_valid and batt_temp >= 55 %} battery_temp_pv_only_55
          {% elif batt_temp_valid and batt_temp >= 53 %} battery_temp_softcap_53
          {% elif batt_temp_valid and batt_temp >= 50 %} battery_temp_softcap_50
          {% elif hub_temp_valid and hub_temp >= 62 %} hub_temp_softcap_62
          {% elif hub_temp_valid and hub_temp >= 60 %} hub_temp_softcap_60
          {% elif hub_temp_valid and hub_temp >= 58 %} hub_temp_softcap_58
          {% elif hub_temp_valid and hub_temp >= 55 %} hub_temp_softcap_55
          {% elif not batt_temp_valid %} temperature_degraded_battery_missing
          {% elif not hub_temp_valid %} temperature_degraded_hub_missing
          {% else %} freigegeben {% endif %}
      - name: "SolarFlow 2 Output Block Reason"
