                 + ([as_timestamp(now()) - budget_ts_final | float(0), 0] | max) / refill_final | float(10)] | min }}
          allowed: "{{ refilled_final | float(0) >= 1 }}"
          tokens_after: "{{ [refilled_final | float(0) - 1, 0] | max | round(2) }}"
      - condition: template
        value_template: "{{ allowed | bool }}"
      - action: script.zendure_wire_publish_u1
        data:
          topic: "{{ topic_value }}"
          payload: "{{ payload_value }}"
          source: "{{ source_value }}"
          command_class: "config"
          generation: -1
          desired_entity: "{{ desired_entity_value }}"
          desired_type: "{{ desired_type_value }}"
          expected_value: "{{ payload_value }}"
