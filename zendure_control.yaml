               or is_state('input_boolean.zendure_deferred_safety_zero_u2','on') }}
          zero_new_episode: >-
            {{ zero_still_needed | bool
               and pending_ts | float(0) <= 1
               and not deferred_zero_active | bool }}
          zero_pending_timer_missing: >-
            {{ zero_still_needed | bool
               and pending_ts | float(0) > 1
               and not is_state('timer.zendure_ack_retry_u2','active') }}
          pending_age: >-
            {{ [received_ts | float(0) - pending_ts | float(0), 0] | max
               if pending_ts | float(0) > 1 else 0 }}
          retry_interval: "{{ 10 if pending_age | float(0) < 60 else 30 if pending_age | float(0) < 300 else 60 }}"
          since_dispatch: >-
            {{ [received_ts | float(0) - dispatch_ts | float(0), 0] | max
               if dispatch_ts | float(0) > 1 else 0 }}
          zero_timer_delay: >-
            {% if not actual_valid | bool and not grid_valid | bool
                  and since_dispatch | float(0) >= retry_interval | float(10) %}
              {{ retry_interval | int(10) }}
            {% else %}
              {{ [1, retry_interval | int(10) - since_dispatch | int(0)] | max }}
            {% endif %}
      - condition: template
        value_template: "{{ status_ok }}"
      - if:
          - condition: template
            value_template: "{{ readback != states('input_number.zendure_confirmed_output_2') | int(-1) }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_confirmed_output_2 }
            data: { value: "{{ readback }}" }
      - if:
          - condition: template
            value_template: "{{ ack_match | bool }}"
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_output_pending_since_u2 }
            data: { datetime: "1970-01-01 00:00:00" }
          - action: timer.cancel
            target: { entity_id: timer.zendure_ack_retry_u2 }
      - if:
          - condition: template
            value_template: "{{ not auto_on | bool and desired | int(0) != 0 }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_2 }
            data: { value: 0 }
      - if:
          - condition: template
            value_template: "{{ zero_new_episode | bool }}"
        then:
          - action: script.zendure_set_u2_outputlimit_zero
            data:
              source: "live_mqtt_zero_start"
      - if:
          - condition: template
            value_template: "{{ zero_pending_timer_missing | bool }}"
        then:
          - action: timer.start
            target: { entity_id: timer.zendure_ack_retry_u2 }
            data: { duration: "{{ zero_timer_delay | int(10) }}" }

  - alias: "Zendure: Deferred Output Writer"
    id: "zendure_deferred_output_writer"
    mode: parallel
    max: 2
    max_exceeded: warning
    initial_state: true
    triggers:
      - trigger: timer.finished
        target: { entity_id: timer.zendure_writer_deferred_u1 }
        id: u1
      - trigger: timer.finished
        target: { entity_id: timer.zendure_writer_deferred_u2 }
        id: u2
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_runtime_writers_ready
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u1' }}"
            sequence:
              - variables:
                  deferred_target: "{{ states('input_number.zendure_deferred_target_u1') | int(0) }}"
                  deferred_force: "{{ is_state('input_boolean.zendure_deferred_force_u1','on') }}"
                  deferred_safety: "{{ is_state('input_boolean.zendure_deferred_safety_zero_u1','on') }}"
                  deferred_ensure: "{{ is_state('input_boolean.zendure_deferred_ensure_output_mode_u1','on') }}"
                  deferred_reassert: "{{ is_state('input_boolean.zendure_deferred_reassert_output_mode_u1','on') }}"
                  deferred_coalesce: "{{ is_state('input_boolean.zendure_deferred_coalesce_latest_u1','on') }}"
                  deferred_peer_valid: "{{ is_state('input_boolean.zendure_deferred_peer_validated_u1','on') }}"
                  deferred_generation: "{{ states('input_number.zendure_deferred_generation_u1') | int(0) }}"
                  deferred_peer: "{{ states('input_number.zendure_deferred_peer_reservation_u1') | int(0) }}"
                  deferred_source: "{{ states('input_text.zendure_deferred_source_u1') }}"
                  control_allowed: >-
                    {{ is_state('input_boolean.zendure_auto_mode','on')
                       or deferred_target | int(0) == 0 }}
              - action: script.zendure_clear_deferred_u1
              - if:
                  - condition: template
                    value_template: "{{ not control_allowed | bool }}"
                then:
                  - stop: "Positive deferred U1 target discarded while Auto Mode is OFF."
              - action: script.zendure_dispatch_u1_output
                data:
                  power: "{{ deferred_target }}"
                  ensure_output_mode: "{{ false if deferred_safety | bool else deferred_ensure }}"
                  force: "{{ deferred_force or deferred_safety }}"
                  reassert_output_mode: "{{ false if deferred_safety | bool else deferred_reassert }}"
                  generation: "{{ deferred_generation }}"
                  update_desired: false
                  coalesce_latest: "{{ false if deferred_safety | bool else deferred_coalesce }}"
                  peer_reservation: "{{ 0 if deferred_safety | bool else deferred_peer }}"
                  peer_reservation_validated: "{{ false if deferred_safety | bool else deferred_peer_valid }}"
                  safety_zero: "{{ deferred_safety }}"
                  source: "{{ deferred_source if deferred_source not in ['unknown','unavailable','none',''] else 'writer_deferred' }}"
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u2' }}"
            sequence:
              - variables:
                  deferred_target: "{{ states('input_number.zendure_deferred_target_u2') | int(0) }}"
                  deferred_force: "{{ is_state('input_boolean.zendure_deferred_force_u2','on') }}"
                  deferred_safety: "{{ is_state('input_boolean.zendure_deferred_safety_zero_u2','on') }}"
                  deferred_ensure: "{{ is_state('input_boolean.zendure_deferred_ensure_output_mode_u2','on') }}"
                  deferred_reassert: "{{ is_state('input_boolean.zendure_deferred_reassert_output_mode_u2','on') }}"
                  deferred_coalesce: "{{ is_state('input_boolean.zendure_deferred_coalesce_latest_u2','on') }}"
                  deferred_peer_valid: "{{ is_state('input_boolean.zendure_deferred_peer_validated_u2','on') }}"
                  deferred_generation: "{{ states('input_number.zendure_deferred_generation_u2') | int(0) }}"
                  deferred_peer: "{{ states('input_number.zendure_deferred_peer_reservation_u2') | int(0) }}"
                  deferred_source: "{{ states('input_text.zendure_deferred_source_u2') }}"
                  control_allowed: >-
                    {{ is_state('input_boolean.zendure_auto_mode','on')
                       or deferred_target | int(0) == 0 }}
              - action: script.zendure_clear_deferred_u2
              - if:
                  - condition: template
                    value_template: "{{ not control_allowed | bool }}"
                then:
                  - stop: "Positive deferred U2 target discarded while Auto Mode is OFF."
              - action: script.zendure_dispatch_u2_output
                data:
                  power: "{{ deferred_target }}"
                  ensure_output_mode: "{{ false if deferred_safety | bool else deferred_ensure }}"
                  force: "{{ deferred_force or deferred_safety }}"
                  reassert_output_mode: "{{ false if deferred_safety | bool else deferred_reassert }}"
                  generation: "{{ deferred_generation }}"
                  update_desired: false
                  coalesce_latest: "{{ false if deferred_safety | bool else deferred_coalesce }}"
                  peer_reservation: "{{ 0 if deferred_safety | bool else deferred_peer }}"
                  peer_reservation_validated: "{{ false if deferred_safety | bool else deferred_peer_valid }}"
                  safety_zero: "{{ deferred_safety }}"
                  source: "{{ deferred_source if deferred_source not in ['unknown','unavailable','none',''] else 'writer_deferred' }}"


  # --- 6.2b TRAFFIC-AWARE ACK / EXPORT RECOVERY ---
  - alias: "Zendure: Output ACK Recovery"
    id: "zendure_output_ack_recovery"
    mode: queued
    max: 10
    max_exceeded: warning
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: state
        entity_id: input_boolean.zendure_runtime_writers_ready
        to: "on"
        id: writers_ready
      - trigger: timer.finished
        target:
          entity_id: timer.zendure_ack_retry_u1
        id: ack_timer_u1
      - trigger: timer.finished
        target:
          entity_id: timer.zendure_ack_retry_u2
        id: ack_timer_u2
      - trigger: state
        entity_id: binary_sensor.solarflow_persistent_export_guard
        to: "on"
        id: persistent_export
      - trigger: state
        entity_id: binary_sensor.solarflow_persistent_import_guard
        to: "on"
        id: persistent_import
      - trigger: state
        entity_id:
          - sensor.solarflow_1_output_limit
          - sensor.solarflow_2_output_limit
        id: readback
      - trigger: state
        entity_id:
          - sensor.solarflow_1_output_power
          - sensor.solarflow_2_output_power
        id: physical_output
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_runtime_writers_ready
        state: "on"
    actions:
      - variables:
          now_ts: "{{ as_timestamp(now()) }}"
          grid: "{{ states('sensor.zendure_grid_power') | float(0) }}"
          bias: "{{ states('input_number.zendure_conf_grid_bias') | float(10) }}"
          grid_error: "{{ grid | float(0) - bias | float(10) }}"
          export_active: "{{ is_state('binary_sensor.solarflow_persistent_export_guard','on') }}"
          import_active: "{{ is_state('binary_sensor.solarflow_persistent_import_guard','on') }}"
          export_episode_ts: "{{ as_timestamp(states.binary_sensor.solarflow_persistent_export_guard.last_changed, 0) }}"
          import_episode_ts: "{{ as_timestamp(states.binary_sensor.solarflow_persistent_import_guard.last_changed, 0) }}"
          desired1: "{{ states('input_number.zendure_last_sent_1') | int(0) }}"
          desired2: "{{ states('input_number.zendure_last_sent_2') | int(0) }}"
          auto_on: "{{ is_state('input_boolean.zendure_auto_mode','on') }}"
          control_allowed1: "{{ auto_on | bool or desired1 | int(0) == 0 }}"
          control_allowed2: "{{ auto_on | bool or desired2 | int(0) == 0 }}"
          confirmed1: "{{ states('input_number.zendure_confirmed_output_1') | int(0) }}"
          confirmed2: "{{ states('input_number.zendure_confirmed_output_2') | int(0) }}"
          dispatched1: "{{ states('input_number.zendure_last_dispatched_1') | int(0) }}"
          dispatched2: "{{ states('input_number.zendure_last_dispatched_2') | int(0) }}"
          pending_ts1: "{{ (state_attr('input_datetime.zendure_output_pending_since_u1','timestamp') | float(0)) }}"
          pending_ts2: "{{ (state_attr('input_datetime.zendure_output_pending_since_u2','timestamp') | float(0)) }}"
          pending_age1: "{{ now_ts - pending_ts1 if pending_ts1 > 1 else 0 }}"
          pending_age2: "{{ now_ts - pending_ts2 if pending_ts2 > 1 else 0 }}"
          last_dispatch_ts1: "{{ (state_attr('input_datetime.zendure_last_dispatch_ts_u1','timestamp') | float(0)) }}"
          last_dispatch_ts2: "{{ (state_attr('input_datetime.zendure_last_dispatch_ts_u2','timestamp') | float(0)) }}"
          output_limit_ts1: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) }}"
          output_limit_ts2: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) }}"
          output_power_ts1: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
          output_power_ts2: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) }}"
          since_dispatch1: "{{ now_ts - last_dispatch_ts1 }}"
          since_dispatch2: "{{ now_ts - last_dispatch_ts2 }}"
          retry_interval1: "{{ 10 if pending_age1 < 60 else 30 if pending_age1 < 300 else 60 }}"
          retry_interval2: "{{ 10 if pending_age2 < 60 else 30 if pending_age2 < 300 else 60 }}"
          status_age1: "{{ now_ts - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','status_ts'), 0) }}"
          status_age2: "{{ now_ts - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','status_ts'), 0) }}"
          online1: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and status_age1 < 300 }}"
          online2: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and status_age2 < 300 }}"
          busy1: >
            {{ is_state('input_boolean.zendure_emergency_u1','on') or
               is_state('input_boolean.zendure_calib_mode_u1','on') or
               is_state('input_boolean.zendure_vguard_u1','on') or
               is_state('input_boolean.zendure_batt_temp_cooldown_u1','on') or
               is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') }}
          busy2: >
            {{ is_state('input_boolean.zendure_emergency_u2','on') or
               is_state('input_boolean.zendure_calib_mode_u2','on') or
               is_state('input_boolean.zendure_vguard_u2','on') or
               is_state('input_boolean.zendure_batt_temp_cooldown_u2','on') or
               is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') }}
          out_limit_age1: "{{ now_ts - output_limit_ts1 }}"
          out_limit_age2: "{{ now_ts - output_limit_ts2 }}"
          out_power_age1: "{{ now_ts - output_power_ts1 }}"
          out_power_age2: "{{ now_ts - output_power_ts2 }}"
          actual_valid1: "{{ out_power_age1 < 20 and is_number(states('sensor.solarflow_1_output_power')) }}"
          actual_valid2: "{{ out_power_age2 < 20 and is_number(states('sensor.solarflow_2_output_power')) }}"
          actual1: "{{ states('sensor.solarflow_1_output_power') | float(0) if actual_valid1 | bool else 0 }}"
          actual2: "{{ states('sensor.solarflow_2_output_power') | float(0) if actual_valid2 | bool else 0 }}"
          actual_fresh1: "{{ actual1 | int(0) if actual_valid1 | bool else 0 }}"
          actual_fresh2: "{{ actual2 | int(0) if actual_valid2 | bool else 0 }}"
          mismatch1: "{{ dispatched1 != confirmed1 or (pending_ts1 > 1 and output_limit_ts1 < last_dispatch_ts1) }}"
          mismatch2: "{{ dispatched2 != confirmed2 or (pending_ts2 > 1 and output_limit_ts2 < last_dispatch_ts2) }}"
          grid_valid: "{{ is_number(states('sensor.zendure_grid_power')) }}"
          export_unresolved: >-
            {{ grid_valid | bool
               and (export_active | bool or grid_error | float(0) < -50) }}
          physical_zero1: "{{ actual_valid1 | bool and actual1 | float(0) <= 30 }}"
          physical_zero2: "{{ actual_valid2 | bool and actual2 | float(0) <= 30 }}"
          zero_ack_safe1: >-
            {{ dispatched1 | int(0) != 0
               or physical_zero1 | bool
               or (not actual_valid1 | bool and grid_valid | bool and not export_unresolved | bool) }}
          zero_ack_safe2: >-
            {{ dispatched2 | int(0) != 0
               or physical_zero2 | bool
               or (not actual_valid2 | bool and grid_valid | bool and not export_unresolved | bool) }}
          ack_confirmed1: >-
            {{ pending_ts1 > 1 and output_limit_ts1 >= last_dispatch_ts1
               and confirmed1 == dispatched1 and zero_ack_safe1 | bool }}
          ack_confirmed2: >-
            {{ pending_ts2 > 1 and output_limit_ts2 >= last_dispatch_ts2
               and confirmed2 == dispatched2 and zero_ack_safe2 | bool }}
          physical_effective1: >-
            {{ pending_ts1 > 1 and actual_valid1 | bool and output_power_ts1 >= last_dispatch_ts1
               and ((actual1 | float(0)) - (dispatched1 | float(0))) | abs <= 30 }}
          physical_effective2: >-
            {{ pending_ts2 > 1 and actual_valid2 | bool and output_power_ts2 >= last_dispatch_ts2
               and ((actual2 | float(0)) - (dispatched2 | float(0))) | abs <= 30 }}
          pending_heal1_transport: "{{ ack_confirmed1 | bool or physical_effective1 | bool }}"
          pending_heal2_transport: "{{ ack_confirmed2 | bool or physical_effective2 | bool }}"
          actual_over1: "{{ actual_valid1 | bool and actual1 > dispatched1 + 30 }}"
          actual_over2: "{{ actual_valid2 | bool and actual2 > dispatched2 + 30 }}"
          actual_under1: "{{ actual_valid1 | bool and actual1 < dispatched1 - 50 }}"
          actual_under2: "{{ actual_valid2 | bool and actual2 < dispatched2 - 50 }}"
          confirmed_over1: "{{ out_limit_age1 < 30 and confirmed1 > dispatched1 + 30 }}"
          confirmed_over2: "{{ out_limit_age2 < 30 and confirmed2 > dispatched2 + 30 }}"
          confirmed_under1: "{{ out_limit_age1 < 30 and confirmed1 < dispatched1 - 50 }}"
          confirmed_under2: "{{ out_limit_age2 < 30 and confirmed2 < dispatched2 - 50 }}"
          zero_unverified_export1: >-
            {{ desired1 | int(0) == 0
               and dispatched1 | int(0) == 0
               and not actual_valid1 | bool
               and export_unresolved | bool
               and online1 | bool }}
          zero_unverified_export2: >-
            {{ desired2 | int(0) == 0
               and dispatched2 | int(0) == 0
               and not actual_valid2 | bool
               and export_unresolved | bool
               and online2 | bool }}
          zero_verification_unavailable1: >-
            {{ dispatched1 | int(0) == 0
               and not actual_valid1 | bool
               and not grid_valid | bool }}
          zero_verification_unavailable2: >-
            {{ dispatched2 | int(0) == 0
               and not actual_valid2 | bool
               and not grid_valid | bool }}
          zero_problem1: >-
            {{ dispatched1 == 0 and ((actual_valid1 | bool and actual1 > 30)
               or (out_limit_age1 < 30 and confirmed1 > 0)
               or zero_unverified_export1 | bool) }}
          zero_problem2: >-
            {{ dispatched2 == 0 and ((actual_valid2 | bool and actual2 > 30)
               or (out_limit_age2 < 30 and confirmed2 > 0)
               or zero_unverified_export2 | bool) }}
          retry_problem1: >-
            {{ zero_problem1 | bool or actual_over1 | bool
               or (grid_error < -50 and confirmed_over1 | bool)
               or (grid_error > 100 and (actual_under1 | bool or confirmed_under1 | bool)) }}
          retry_problem2: >-
            {{ zero_problem2 | bool or actual_over2 | bool
               or (grid_error < -50 and confirmed_over2 | bool)
               or (grid_error > 100 and (actual_under2 | bool or confirmed_under2 | bool)) }}
          pending_soft_clear1: "{{ pending_ts1 > 1 and pending_age1 >= 10 and not retry_problem1 | bool }}"
          pending_soft_clear2: "{{ pending_ts2 > 1 and pending_age2 >= 10 and not retry_problem2 | bool }}"
          pending_heal1: >-
            {{ (pending_heal1_transport | bool or pending_soft_clear1 | bool)
               and zero_ack_safe1 | bool }}
          pending_heal2: >-
            {{ (pending_heal2_transport | bool or pending_soft_clear2 | bool)
               and zero_ack_safe2 | bool }}
          retry_allowed1: "{{ not busy1 or dispatched1 == 0 }}"
          retry_allowed2: "{{ not busy2 or dispatched2 == 0 }}"
          retry_due1: >
            {{ control_allowed1 | bool and online1 and retry_allowed1
               and (mismatch1 | bool or zero_unverified_export1 | bool)
               and not pending_heal1 | bool and retry_problem1 | bool and pending_ts1 > 1
               and pending_age1 >= 10 and since_dispatch1 >= retry_interval1 }}
          retry_due2: >
            {{ control_allowed2 | bool and online2 and retry_allowed2
               and (mismatch2 | bool or zero_unverified_export2 | bool)
               and not pending_heal2 | bool and retry_problem2 | bool and pending_ts2 > 1
               and pending_age2 >= 10 and since_dispatch2 >= retry_interval2 }}
          physical_zero_followup_due1: >-
            {{ control_allowed1 | bool and online1 and desired1 == 0 and dispatched1 == 0 and actual_valid1 | bool and actual1 > 30
               and grid_error < -50 and since_dispatch1 >= 30 }}
          physical_zero_followup_due2: >-
            {{ control_allowed2 | bool and online2 and desired2 == 0 and dispatched2 == 0 and actual_valid2 | bool and actual2 > 30
               and grid_error < -50 and since_dispatch2 >= 30 }}

          export_problem_online1: >
            {{ control_allowed1 | bool and export_active and online1 and retry_allowed1 and
               (zero_unverified_export1 | bool
                or (out_limit_age1 < 30 and confirmed1 > desired1 + 30)
                or (actual_valid1 | bool and actual1 > desired1 + 30)) }}
          export_problem_online2: >
            {{ control_allowed2 | bool and export_active and online2 and retry_allowed2 and
               (zero_unverified_export2 | bool
                or (out_limit_age2 < 30 and confirmed2 > desired2 + 30)
                or (actual_valid2 | bool and actual2 > desired2 + 30)) }}
          import_problem_online1: >
            {{ auto_on | bool and import_active and online1 and retry_allowed1 and dispatched1 > 0
               and (actual_under1 | bool or confirmed_under1 | bool) }}
          import_problem_online2: >
            {{ auto_on | bool and import_active and online2 and retry_allowed2 and dispatched2 > 0
               and (actual_under2 | bool or confirmed_under2 | bool) }}
          last_export_retry_ts1: "{{ (state_attr('input_datetime.zendure_last_export_retry_ts_u1','timestamp') | float(0)) }}"
          last_export_retry_ts2: "{{ (state_attr('input_datetime.zendure_last_export_retry_ts_u2','timestamp') | float(0)) }}"
          last_import_retry_ts1: "{{ (state_attr('input_datetime.zendure_last_import_retry_ts_u1','timestamp') | float(0)) }}"
          last_import_retry_ts2: "{{ (state_attr('input_datetime.zendure_last_import_retry_ts_u2','timestamp') | float(0)) }}"
          export_immediate_due1: >
            {{ export_problem_online1 and since_dispatch1 >= 3 and export_episode_ts > 1
               and not is_state('input_boolean.zendure_offline_zero_attempted_u1','on')
               and last_export_retry_ts1 < export_episode_ts }}
          export_immediate_due2: >
            {{ export_problem_online2 and since_dispatch2 >= 3 and export_episode_ts > 1
               and not is_state('input_boolean.zendure_offline_zero_attempted_u2','on')
               and last_export_retry_ts2 < export_episode_ts }}
          import_immediate_due1: >
            {{ import_problem_online1 and since_dispatch1 >= 3 and import_episode_ts > 1
               and last_import_retry_ts1 < import_episode_ts }}
          import_immediate_due2: >
            {{ import_problem_online2 and since_dispatch2 >= 3 and import_episode_ts > 1
               and last_import_retry_ts2 < import_episode_ts }}

          offline_known_output1: "{{ [dispatched1, confirmed1, actual_fresh1] | max }}"
          offline_known_output2: "{{ [dispatched2, confirmed2, actual_fresh2] | max }}"
          offline_zero_attempted1: "{{ is_state('input_boolean.zendure_offline_zero_attempted_u1','on') }}"
          offline_zero_attempted2: "{{ is_state('input_boolean.zendure_offline_zero_attempted_u2','on') }}"
          offline_zero_due1: >
            {{ export_active and not online1 and offline_known_output1 > 0 and not offline_zero_attempted1 }}
          offline_zero_due2: >
            {{ export_active and not online2 and offline_known_output2 > 0 and not offline_zero_attempted2 }}
          reconnect_zero_due1: "{{ online1 and offline_zero_attempted1 }}"
          reconnect_zero_due2: "{{ online2 and offline_zero_attempted2 }}"

          ac_mode_state1: "{{ states('sensor.solarflow_1_ac_mode') | lower }}"
          ac_mode_state2: "{{ states('sensor.solarflow_2_ac_mode') | lower }}"
          ac_mode_mismatch1: "{{ ac_mode_state1 not in ['output mode','unknown','unavailable','none',''] }}"
          ac_mode_mismatch2: "{{ ac_mode_state2 not in ['output mode','unknown','unavailable','none',''] }}"
          last_ac_mode_ts1: "{{ (state_attr('input_datetime.zendure_last_ac_mode_dispatch_ts_u1','timestamp') | float(0)) }}"
          last_ac_mode_ts2: "{{ (state_attr('input_datetime.zendure_last_ac_mode_dispatch_ts_u2','timestamp') | float(0)) }}"
          since_ac_mode1: "{{ now_ts - last_ac_mode_ts1 }}"
          since_ac_mode2: "{{ now_ts - last_ac_mode_ts2 }}"
          ac_mode_first_due1: "{{ pending_ts1 > 1 and pending_age1 >= 20 and last_ac_mode_ts1 < pending_ts1 }}"
          ac_mode_first_due2: "{{ pending_ts2 > 1 and pending_age2 >= 20 and last_ac_mode_ts2 < pending_ts2 }}"
          ac_mode_mismatch_due1: "{{ pending_age1 >= 20 and ac_mode_mismatch1 and since_ac_mode1 >= 20 }}"
          ac_mode_mismatch_due2: "{{ pending_age2 >= 20 and ac_mode_mismatch2 and since_ac_mode2 >= 20 }}"
          ac_mode_keepalive_due1: "{{ pending_age1 >= 20 and since_ac_mode1 >= 300 }}"
          ac_mode_keepalive_due2: "{{ pending_age2 >= 20 and since_ac_mode2 >= 300 }}"
          ac_mode_send_due1: >
            {{ auto_on | bool and online1 and not busy1 and retry_problem1 | bool and not pending_heal1 | bool
               and (ac_mode_first_due1 or ac_mode_mismatch_due1 or ac_mode_keepalive_due1) }}
          ac_mode_send_due2: >
            {{ auto_on | bool and online2 and not busy2 and retry_problem2 | bool and not pending_heal2 | bool
               and (ac_mode_first_due2 or ac_mode_mismatch_due2 or ac_mode_keepalive_due2) }}
          ac_mode_force_reassert1: "{{ ac_mode_first_due1 or ac_mode_keepalive_due1 }}"
          ac_mode_force_reassert2: "{{ ac_mode_first_due2 or ac_mode_keepalive_due2 }}"

          pair_send1: "{{ control_allowed1 | bool and (retry_due1 or export_immediate_due1 or import_immediate_due1 or physical_zero_followup_due1) }}"
          pair_send2: "{{ control_allowed2 | bool and (retry_due2 or export_immediate_due2 or import_immediate_due2 or physical_zero_followup_due2) }}"
          recovery_target1: "{{ 0 if not auto_on | bool else (desired1 if export_immediate_due1 else dispatched1) }}"
          recovery_target2: "{{ 0 if not auto_on | bool else (desired2 if export_immediate_due2 else dispatched2) }}"
          generation_next: "{{ ((as_timestamp(now()) * 1000000) | int) % 1000000000 }}"

      # Self-heal a fast ACK race or a physically completed command before any retry.
      - parallel:
          - if:
              - condition: template
                value_template: "{{ pending_heal1 | bool }}"
            then:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_output_pending_since_u1 }
                data: { datetime: "1970-01-01 00:00:00" }
              - action: timer.cancel
                target: { entity_id: timer.zendure_ack_retry_u1 }
          - if:
              - condition: template
                value_template: "{{ pending_heal2 | bool }}"
            then:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_output_pending_since_u2 }
                data: { datetime: "1970-01-01 00:00:00" }
              - action: timer.cancel
                target: { entity_id: timer.zendure_ack_retry_u2 }

      - parallel:
          - if:
              - condition: template
                value_template: "{{ export_immediate_due1 or (reconnect_zero_due1 and export_active) }}"
            then:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_last_export_retry_ts_u1 }
                data: { timestamp: "{{ now().timestamp() }}" }
          - if:
              - condition: template
                value_template: "{{ export_immediate_due2 or (reconnect_zero_due2 and export_active) }}"
            then:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_last_export_retry_ts_u2 }
                data: { timestamp: "{{ now().timestamp() }}" }
          - if:
              - condition: template
                value_template: "{{ import_immediate_due1 }}"
            then:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_last_import_retry_ts_u1 }
                data: { timestamp: "{{ now().timestamp() }}" }
          - if:
              - condition: template
                value_template: "{{ import_immediate_due2 }}"
            then:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_last_import_retry_ts_u2 }
                data: { timestamp: "{{ now().timestamp() }}" }
          - if:
              - condition: template
                value_template: "{{ offline_zero_due1 }}"
            then:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_offline_zero_attempted_u1 }
          - if:
              - condition: template
                value_template: "{{ offline_zero_due2 }}"
            then:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_offline_zero_attempted_u2 }

      - parallel:
          - if:
              - condition: template
                value_template: "{{ offline_zero_due1 or reconnect_zero_due1 }}"
            then:
              - action: script.zendure_set_u1_outputlimit_zero
                data:
                  source: "offline_or_reconnect_zero"
              - if:
                  - condition: template
                    value_template: "{{ reconnect_zero_due1 }}"
                then:
                  - action: input_boolean.turn_off
                    target: { entity_id: input_boolean.zendure_offline_zero_attempted_u1 }
          - if:
              - condition: template
                value_template: "{{ offline_zero_due2 or reconnect_zero_due2 }}"
            then:
              - action: script.zendure_set_u2_outputlimit_zero
                data:
                  source: "offline_or_reconnect_zero"
              - if:
                  - condition: template
                    value_template: "{{ reconnect_zero_due2 }}"
                then:
                  - action: input_boolean.turn_off
                    target: { entity_id: input_boolean.zendure_offline_zero_attempted_u2 }

      - if:
          - condition: template
            value_template: "{{ pair_send1 or pair_send2 }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_dispatch_generation }
            data: { value: "{{ generation_next }}" }
          - action: script.turn_on
            target: { entity_id: script.zendure_dispatch_output_pair }
            data:
              variables:
                target_1: "{{ recovery_target1 }}"
                target_2: "{{ recovery_target2 }}"
                send_1: "{{ pair_send1 }}"
                send_2: "{{ pair_send2 }}"
                force_1: true
                force_2: true
                ensure_mode_1: "{{ ac_mode_send_due1 }}"
                ensure_mode_2: "{{ ac_mode_send_due2 }}"
                reassert_mode_1: "{{ ac_mode_force_reassert1 }}"
                reassert_mode_2: "{{ ac_mode_force_reassert2 }}"
                update_desired_1: false
                update_desired_2: false
                allow_pending_transfer: false
                cancel_pending_transfer: false
                source: "ack_recovery"
                emergency_zero_1: "{{ pair_send1 and recovery_target1 | int(0) == 0 and zero_problem1 | bool }}"
                emergency_zero_2: "{{ pair_send2 and recovery_target2 | int(0) == 0 and zero_problem2 | bool }}"
                generation: "{{ generation_next }}"

      # A restored or newly observed pending command always retains a future wake-up.
      - parallel:
          - if:
              - condition: template
                value_template: >-
                  {{ control_allowed1 | bool and pending_ts1 > 1
                     and not pending_heal1 | bool and not pair_send1 | bool
                     and (not zero_verification_unavailable1 | bool
                          or not is_state('timer.zendure_ack_retry_u1','active')) }}
            then:
              - action: timer.start
                target: { entity_id: timer.zendure_ack_retry_u1 }
                data:
                  duration: >-
                    {% if zero_verification_unavailable1 | bool
                          and since_dispatch1 | float(0) >= retry_interval1 | float(10) %}
                      {{ retry_interval1 | int(10) }}
                    {% else %}
                      {{ [1, retry_interval1 | int(10) - since_dispatch1 | int(0)] | max }}
                    {% endif %}
          - if:
              - condition: template
                value_template: >-
                  {{ control_allowed2 | bool and pending_ts2 > 1
                     and not pending_heal2 | bool and not pair_send2 | bool
                     and (not zero_verification_unavailable2 | bool
                          or not is_state('timer.zendure_ack_retry_u2','active')) }}
            then:
              - action: timer.start
                target: { entity_id: timer.zendure_ack_retry_u2 }
                data:
                  duration: >-
                    {% if zero_verification_unavailable2 | bool
                          and since_dispatch2 | float(0) >= retry_interval2 | float(10) %}
                      {{ retry_interval2 | int(10) }}
                    {% else %}
                      {{ [1, retry_interval2 | int(10) - since_dispatch2 | int(0)] | max }}
                    {% endif %}

  # --- 6.3 BYPASS LATCH MANAGER ---
  - alias: "Zendure: Bypass Latch Manager"
    id: "zendure_bypass_latch_manager"
    mode: single
    initial_state: true
    triggers:
      - trigger: state
        entity_id:
          - sensor.solarflow_1_battery_level
          - sensor.solarflow_2_battery_level
          - sensor.solarflow_1_cell_min_vol
          - sensor.solarflow_2_cell_min_vol
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_number.zendure_conf_soc_off
          - input_number.zendure_conf_soc_bypass
          - input_boolean.zendure_auto_mode
    actions:
      - variables:
          soc_stop: "{{ states('input_number.zendure_conf_soc_off') | float(20) }}"
          soc_exit: >
            {{ [states('input_number.zendure_conf_soc_bypass') | float(25),
                (states('input_number.zendure_conf_soc_off') | float(20)) + 3] | max }}
          vmin_stop: 3.12
          vmin_release: 3.20
          auto_on: "{{ is_state('input_boolean.zendure_auto_mode','on') }}"

          soc1_ok: "{{ is_number(states('sensor.solarflow_1_battery_level')) }}"
          soc2_ok: "{{ is_number(states('sensor.solarflow_2_battery_level')) }}"
          v1_ok: "{{ is_number(states('sensor.solarflow_1_cell_min_vol')) }}"
          v2_ok: "{{ is_number(states('sensor.solarflow_2_cell_min_vol')) }}"
          soc1: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
          soc2: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
          v1_min: "{{ states('sensor.solarflow_1_cell_min_vol') | float(99) }}"
          v2_min: "{{ states('sensor.solarflow_2_cell_min_vol') | float(99) }}"
          u1_busy: "{{ is_state('input_boolean.zendure_emergency_u1','on') or is_state('input_boolean.zendure_vguard_u1','on') or is_state('input_boolean.zendure_calib_mode_u1','on') or is_state('input_boolean.zendure_calib_discharge_u1','on') }}"
          u2_busy: "{{ is_state('input_boolean.zendure_emergency_u2','on') or is_state('input_boolean.zendure_vguard_u2','on') or is_state('input_boolean.zendure_calib_mode_u2','on') or is_state('input_boolean.zendure_calib_discharge_u2','on') }}"

      # Auto-Mode OFF: Latches sauber zurücksetzen.
      - if:
          - condition: template
            value_template: "{{ not (auto_on | bool) }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_bypass_u1
                - input_boolean.zendure_bypass_u2
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u1 }
            data: { value: "none" }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u2 }
            data: { value: "none" }

      # Unit 1: Stopp wegen SoC-Off.
      - if:
          - condition: template
            value_template: >
              {{ auto_on|bool
                 and soc1_ok|bool
                 and not (u1_busy|bool)
                 and soc1 <= soc_stop
                 and not (is_state('input_boolean.zendure_bypass_u1','on') and states('input_text.zendure_bypass_reason_u1') == 'vmin_early_stop') }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_bypass_u1 }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u1 }
            data: { value: "soc_off_stop" }

      # Unit 1: Früher Stopp wegen Zellspannung im unteren SoC-Fenster.
      - if:
          - condition: template
            value_template: >
              {{ auto_on|bool
                 and soc1_ok|bool
                 and v1_ok|bool
                 and not (u1_busy|bool)
                 and soc1 > soc_stop
                 and soc1 <= (soc_stop + 8)
                 and v1_min > 2.0
                 and v1_min < vmin_stop }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_bypass_u1 }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u1 }
            data: { value: "vmin_early_stop" }

      - if:
          - condition: template
            value_template: >
              {{ auto_on|bool
                 and is_state('input_boolean.zendure_bypass_u1','on')
                 and soc1_ok|bool
                 and soc1 >= (soc_exit | float(25))
                 and (states('input_text.zendure_bypass_reason_u1') != 'vmin_early_stop' or (v1_ok|bool and v1_min >= vmin_release)) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_bypass_u1 }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u1 }
            data: { value: "none" }

      # Unit 2: Stopp wegen SoC-Off.
      - if:
          - condition: template
            value_template: >
              {{ auto_on|bool
                 and soc2_ok|bool
                 and not (u2_busy|bool)
                 and soc2 <= soc_stop
                 and not (is_state('input_boolean.zendure_bypass_u2','on') and states('input_text.zendure_bypass_reason_u2') == 'vmin_early_stop') }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_bypass_u2 }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u2 }
            data: { value: "soc_off_stop" }

      # Unit 2: Früher Stopp wegen Zellspannung im unteren SoC-Fenster.
      - if:
          - condition: template
            value_template: >
              {{ auto_on|bool
                 and soc2_ok|bool
                 and v2_ok|bool
                 and not (u2_busy|bool)
                 and soc2 > soc_stop
                 and soc2 <= (soc_stop + 8)
                 and v2_min > 2.0
                 and v2_min < vmin_stop }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_bypass_u2 }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u2 }
            data: { value: "vmin_early_stop" }

      - if:
          - condition: template
            value_template: >
              {{ auto_on|bool
                 and is_state('input_boolean.zendure_bypass_u2','on')
                 and soc2_ok|bool
                 and soc2 >= (soc_exit | float(25))
                 and (states('input_text.zendure_bypass_reason_u2') != 'vmin_early_stop' or (v2_ok|bool and v2_min >= vmin_release)) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_bypass_u2 }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u2 }
            data: { value: "none" }
  # --- 6.3b TEMPERATURE COOLDOWN LATCH ---
  - alias: "Zendure: Battery and Hub Temperature Cooldown Latch"
    id: "zendure_temp_cooldown_latch"
    mode: queued
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
        id: "startup"
      - trigger: time_pattern
        minutes: "/2"
        id: "periodic"

      - trigger: template
        id: "batt_set_u1"
        value_template: >
          {{ has_value('sensor.solarflow_1_battery_temp_control')
             and states('sensor.solarflow_1_battery_temp_control') | float(0) >= 58
             and is_state('input_boolean.zendure_batt_temp_cooldown_u1','off') }}
        for: "00:00:30"
      - trigger: template
        id: "batt_clear_u1"
        value_template: >
          {{ has_value('sensor.solarflow_1_battery_temp_control')
             and states('sensor.solarflow_1_battery_temp_control') | float(99) <= 55
             and is_state('input_boolean.zendure_batt_temp_cooldown_u1','on') }}
        for: "00:05:00"
      - trigger: template
        id: "batt_set_u2"
        value_template: >
          {{ has_value('sensor.solarflow_2_battery_temp_control')
             and states('sensor.solarflow_2_battery_temp_control') | float(0) >= 58
             and is_state('input_boolean.zendure_batt_temp_cooldown_u2','off') }}
        for: "00:00:30"
      - trigger: template
        id: "batt_clear_u2"
        value_template: >
          {{ has_value('sensor.solarflow_2_battery_temp_control')
             and states('sensor.solarflow_2_battery_temp_control') | float(99) <= 55
             and is_state('input_boolean.zendure_batt_temp_cooldown_u2','on') }}
        for: "00:05:00"

      - trigger: template
        id: "hub_set_u1"
        value_template: >
          {{ has_value('sensor.solarflow_1_hub_temp_control')
             and states('sensor.solarflow_1_hub_temp_control') | float(0) >= 65
             and is_state('input_boolean.zendure_hub_temp_cooldown_u1','off') }}
        for: "00:00:30"
      - trigger: template
        id: "hub_clear_u1"
        value_template: >
          {{ has_value('sensor.solarflow_1_hub_temp_control')
             and states('sensor.solarflow_1_hub_temp_control') | float(99) <= 62
             and is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') }}
        for: "00:05:00"
      - trigger: template
        id: "hub_set_u2"
        value_template: >
          {{ has_value('sensor.solarflow_2_hub_temp_control')
             and states('sensor.solarflow_2_hub_temp_control') | float(0) >= 65
             and is_state('input_boolean.zendure_hub_temp_cooldown_u2','off') }}
        for: "00:00:30"
      - trigger: template
        id: "hub_clear_u2"
        value_template: >
          {{ has_value('sensor.solarflow_2_hub_temp_control')
             and states('sensor.solarflow_2_hub_temp_control') | float(99) <= 62
             and is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') }}
        for: "00:05:00"

    actions:
      - variables:
          batt1_valid: "{{ has_value('sensor.solarflow_1_battery_temp_control') }}"
          batt2_valid: "{{ has_value('sensor.solarflow_2_battery_temp_control') }}"
          hub1_valid: "{{ has_value('sensor.solarflow_1_hub_temp_control') }}"
          hub2_valid: "{{ has_value('sensor.solarflow_2_hub_temp_control') }}"
          batt1: "{{ states('sensor.solarflow_1_battery_temp_control') | float(999) }}"
          batt2: "{{ states('sensor.solarflow_2_battery_temp_control') | float(999) }}"
          hub1: "{{ states('sensor.solarflow_1_hub_temp_control') | float(999) }}"
          hub2: "{{ states('sensor.solarflow_2_hub_temp_control') | float(999) }}"

      # U1 battery cooldown: battery >=58°C means no charging and no output until <=55°C.
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'batt_set_u1'
                 or (trigger.id in ['startup','periodic']
                     and batt1_valid | bool
                     and batt1 | float(999) >= 58
                     and is_state('input_boolean.zendure_batt_temp_cooldown_u1','off')) }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_batt_temp_cooldown_u1 }
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u1_chargelimit
            data:
              power: "0"
              force: true
          - action: script.zendure_dispatch_u1_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u1_outputlimit_zero
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'batt_set_u1' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    🚨 *Battery Temp Cooldown U1*\nBatterie >=58°C – InputLimit, ChargeMaxLimit und Output werden gestoppt bis <=55°C.

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'batt_clear_u1'
                 or (trigger.id == 'startup'
                     and batt1_valid | bool
                     and batt1 | float(999) <= 55
                     and is_state('input_boolean.zendure_batt_temp_cooldown_u1','on')) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_batt_temp_cooldown_u1 }
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'batt_clear_u1' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    ✅ *Battery Temp Cooldown U1 beendet*\nBatterie <=55°C für 5 Minuten.

      # U2 battery cooldown: battery >=58°C means no charging and no output until <=55°C.
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'batt_set_u2'
                 or (trigger.id in ['startup','periodic']
                     and batt2_valid | bool
                     and batt2 | float(999) >= 58
                     and is_state('input_boolean.zendure_batt_temp_cooldown_u2','off')) }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_batt_temp_cooldown_u2 }
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u2_chargelimit
            data:
              power: "0"
              force: true
          - action: script.zendure_dispatch_u2_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u2_outputlimit_zero
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'batt_set_u2' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    🚨 *Battery Temp Cooldown U2*\nBatterie >=58°C – InputLimit, ChargeMaxLimit und Output werden gestoppt bis <=55°C.

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'batt_clear_u2'
                 or (trigger.id == 'startup'
                     and batt2_valid | bool
                     and batt2 | float(999) <= 55
                     and is_state('input_boolean.zendure_batt_temp_cooldown_u2','on')) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_batt_temp_cooldown_u2 }
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'batt_clear_u2' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    ✅ *Battery Temp Cooldown U2 beendet*\nBatterie <=55°C für 5 Minuten.

      # U1 hub/inverter cooldown: hub >=65°C means true cooldown: no output and no charging until <=62°C.
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'hub_set_u1'
                 or (trigger.id in ['startup','periodic']
                     and hub1_valid | bool
                     and hub1 | float(999) >= 65
                     and is_state('input_boolean.zendure_hub_temp_cooldown_u1','off')) }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_hub_temp_cooldown_u1 }
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u1_chargelimit
            data:
              power: "0"
              force: true
          - action: script.zendure_dispatch_u1_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u1_outputlimit_zero
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'hub_set_u1' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    🚨 *Hub/WR Temp Cooldown U1*\nHub/WR >=65°C – InputLimit, ChargeMaxLimit und Output werden gestoppt bis <=62°C.

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'hub_clear_u1'
                 or (trigger.id == 'startup'
                     and hub1_valid | bool
                     and hub1 | float(999) <= 62
                     and is_state('input_boolean.zendure_hub_temp_cooldown_u1','on')) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_hub_temp_cooldown_u1 }
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'hub_clear_u1' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    ✅ *Hub/WR Temp Cooldown U1 beendet*\nHub/WR <=62°C für 5 Minuten.

      # U2 hub/inverter cooldown: hub >=65°C means true cooldown: no output and no charging until <=62°C.
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'hub_set_u2'
                 or (trigger.id in ['startup','periodic']
                     and hub2_valid | bool
                     and hub2 | float(999) >= 65
                     and is_state('input_boolean.zendure_hub_temp_cooldown_u2','off')) }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_hub_temp_cooldown_u2 }
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u2_chargelimit
            data:
              power: "0"
              force: true
          - action: script.zendure_dispatch_u2_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u2_outputlimit_zero
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'hub_set_u2' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    🚨 *Hub/WR Temp Cooldown U2*\nHub/WR >=65°C – InputLimit, ChargeMaxLimit und Output werden gestoppt bis <=62°C.

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'hub_clear_u2'
                 or (trigger.id == 'startup'
                     and hub2_valid | bool
                     and hub2 | float(999) <= 62
                     and is_state('input_boolean.zendure_hub_temp_cooldown_u2','on')) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_hub_temp_cooldown_u2 }
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'hub_clear_u2' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    ✅ *Hub/WR Temp Cooldown U2 beendet*\nHub/WR <=62°C für 5 Minuten.

  # --- 6.4a EVENT-DRIVEN SECOND STAGE FOR A SAFE UNIT TRANSFER ---
  - alias: "Zendure: Pending Transfer Continuation"
    id: "zendure_pending_transfer_continuation"
    mode: restart
    max_exceeded: silent
    initial_state: true
    triggers:
      # Direct MQTT triggers also fire when the physical value is unchanged.
      - trigger: mqtt
        topic: !secret zendure_topic_u1_sensor_outputHomePower
        id: physical_u1
      - trigger: mqtt
        topic: !secret zendure_topic_u2_sensor_outputHomePower
        id: physical_u2
      - trigger: timer.finished
        target:
          entity_id: timer.zendure_transfer_retry
        id: writer_retry
      - trigger: timer.finished
        target:
          entity_id: timer.zendure_transfer_timeout
        id: transfer_timeout
      - trigger: state
        entity_id: input_boolean.zendure_auto_mode
        to: "off"
        id: auto_off
    actions:
      - if:
          - condition: template
            value_template: "{{ not is_state('input_boolean.zendure_transfer_pending','on') }}"
        then:
          - stop: "No pending unit transfer."

      - variables:
          now_ts: "{{ as_timestamp(now()) }}"
          current_generation: "{{ states('input_number.zendure_dispatch_generation') | int(0) }}"
          transfer_generation: "{{ states('input_number.zendure_transfer_generation') | int(0) }}"
          lower_unit: "{{ states('input_text.zendure_transfer_lower_unit') | lower }}"
          started_ts: "{{ (state_attr('input_datetime.zendure_transfer_started','timestamp') | float(0)) }}"
          transfer_age: "{{ now_ts - started_ts if started_ts > 1 else 9999 }}"
          target1: "{{ states('input_number.zendure_transfer_target_u1') | int(0) }}"
          target2: "{{ states('input_number.zendure_transfer_target_u2') | int(0) }}"
          unit_limit: >-
            {{ [[states('input_number.zendure_conf_max_output_per_unit') | int(800), 0] | max, 800] | min }}
          configured_system_limit: >-
            {{ [[states('input_number.zendure_conf_max_output') | int(1000), 0] | max, 1000] | min }}
          system_limit: "{{ [configured_system_limit | int(1000), unit_limit | int(800) * 2] | min }}"
          target_pair_valid: >-
            {{ target1 >= 0 and target2 >= 0 and target1 <= unit_limit and target2 <= unit_limit
               and (target1 + target2) <= system_limit }}
          busy1: >-
            {{ is_state('input_boolean.zendure_emergency_u1','on')
               or is_state('input_boolean.zendure_calib_mode_u1','on')
               or is_state('input_boolean.zendure_vguard_u1','on')
               or is_state('input_boolean.zendure_batt_temp_cooldown_u1','on')
               or is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') }}
          busy2: >-
            {{ is_state('input_boolean.zendure_emergency_u2','on')
               or is_state('input_boolean.zendure_calib_mode_u2','on')
               or is_state('input_boolean.zendure_vguard_u2','on')
               or is_state('input_boolean.zendure_batt_temp_cooldown_u2','on')
               or is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') }}
          output_ts1: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
          output_ts2: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) }}"
          physical_payload_u1_valid: "{{ trigger.id == 'physical_u1' and is_number(trigger.payload) }}"
          physical_payload_u2_valid: "{{ trigger.id == 'physical_u2' and is_number(trigger.payload) }}"
          actual1: >-
            {{ trigger.payload | int(0) if physical_payload_u1_valid | bool
               else states('sensor.solarflow_1_output_power') | int(0)
                    if is_number(states('sensor.solarflow_1_output_power')) else 0 }}
          actual2: >-
            {{ trigger.payload | int(0) if physical_payload_u2_valid | bool
               else states('sensor.solarflow_2_output_power') | int(0)
                    if is_number(states('sensor.solarflow_2_output_power')) else 0 }}
          actual1_after_start: >-
            {{ (physical_payload_u1_valid | bool and now_ts >= started_ts)
               or (output_ts1 >= started_ts and (now_ts - output_ts1) < 8) }}
          actual2_after_start: >-
            {{ (physical_payload_u2_valid | bool and now_ts >= started_ts)
               or (output_ts2 >= started_ts and (now_ts - output_ts2) < 8) }}
          lower_reduced: >-
            {% if lower_unit == 'u1' %}
              {{ actual1_after_start | bool and actual1 <= target1 + 20 }}
            {% elif lower_unit == 'u2' %}
              {{ actual2_after_start | bool and actual2 <= target2 + 20 }}
            {% else %}false{% endif %}
          safe_to_release: >-
            {% if lower_unit == 'u1' %}
              {{ lower_reduced | bool and (target2 + actual1) <= system_limit }}
            {% elif lower_unit == 'u2' %}
              {{ lower_reduced | bool and (target1 + actual2) <= system_limit }}
            {% else %}false{% endif %}
          transfer_invalid: >-
            {{ trigger.id == 'auto_off'
               or not is_state('input_boolean.zendure_auto_mode','on')
               or transfer_generation != current_generation
               or lower_unit not in ['u1','u2']
               or not target_pair_valid | bool
               or trigger.id == 'transfer_timeout'
               or busy1 | bool or busy2 | bool }}

      - if:
          - condition: template
            value_template: "{{ transfer_invalid | bool }}"
        then:
          - action: script.zendure_clear_pending_transfer
          - stop: "Pending transfer invalidated or reached its physical timeout."

      - if:
          - condition: template
            value_template: "{{ safe_to_release | bool }}"
        then:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ lower_unit == 'u1' }}"
                sequence:
                  - action: script.zendure_dispatch_u2_output
                    data:
                      power: "{{ target2 }}"
                      ensure_output_mode: true
                      force: true
                      reassert_output_mode: false
                      generation: "{{ transfer_generation }}"
                      update_desired: false
                      coalesce_latest: false
                      peer_reservation: "{{ actual1 | int(0) }}"
                      peer_reservation_validated: true
                      source: "transfer_release"
              - conditions:
                  - condition: template
                    value_template: "{{ lower_unit == 'u2' }}"
                sequence:
                  - action: script.zendure_dispatch_u1_output
                    data:
                      power: "{{ target1 }}"
                      ensure_output_mode: true
                      force: true
                      reassert_output_mode: false
                      generation: "{{ transfer_generation }}"
                      update_desired: false
                      coalesce_latest: false
                      peer_reservation: "{{ actual2 | int(0) }}"
                      peer_reservation_validated: true
                      source: "transfer_release"
          - variables:
              release_committed: >-
                {% if lower_unit == 'u1' %}{{ states('input_number.zendure_last_dispatched_2') | int(-1) == target2 | int(0) }}
                {% else %}{{ states('input_number.zendure_last_dispatched_1') | int(-1) == target1 | int(0) }}{% endif %}
          - if:
              - condition: template
                value_template: "{{ release_committed | bool }}"
            then:
              - action: script.zendure_clear_pending_transfer
            else:
              - action: timer.start
                target: { entity_id: timer.zendure_transfer_retry }
                data: { duration: 2 }

  # --- 6.4b SLOW SOC/PV/TEMPERATURE BALANCER ---
  - alias: "Zendure: Slow Unit Balancer"
    id: "zendure_slow_unit_balancer"
    mode: single
    max_exceeded: silent
    initial_state: true
    triggers:
      - trigger: time_pattern
        seconds: "/30"
        id: balance_tick
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
      - condition: state
        entity_id: input_boolean.zendure_transfer_pending
        state: "off"
    actions:
      - variables:
          now_ts: "{{ as_timestamp(now()) }}"
          grid: "{{ states('sensor.zendure_grid_power') | float(9999) }}"
          bias: "{{ states('input_number.zendure_conf_grid_bias') | float(10) }}"
          stable_seconds: "{{ states('input_number.zendure_conf_rebalance_stable_seconds') | int(15) }}"
          min_transfer: "{{ states('input_number.zendure_conf_rebalance_min_delta') | int(100) }}"
          last_grid_change_ts: "{{ as_timestamp(states('input_datetime.zendure_last_material_grid_change'), 0) }}"
          last_balance_ts: "{{ as_timestamp(states('input_datetime.zendure_last_balance_dispatch'), 0) }}"
          grid_stable: >-
            {{ is_number(states('sensor.zendure_grid_power'))
               and state_attr('sensor.zendure_grid_power','source_fresh') | default(false) | bool
               and (now_ts - last_grid_change_ts) >= stable_seconds
               and (grid - bias) | abs <= 30 }}
          balance_cooldown_ok: "{{ (now_ts - last_balance_ts) >= 60 }}"
          status_age1: "{{ now_ts - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','status_ts'), 0) }}"
          status_age2: "{{ now_ts - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','status_ts'), 0) }}"
          online1: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and status_age1 < 300 }}"
          online2: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and status_age2 < 300 }}"
          busy1: >-
            {{ is_state('input_boolean.zendure_emergency_u1','on')
               or is_state('input_boolean.zendure_calib_mode_u1','on')
               or is_state('input_boolean.zendure_vguard_u1','on')
               or is_state('input_boolean.zendure_batt_temp_cooldown_u1','on')
               or is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') }}
          busy2: >-
            {{ is_state('input_boolean.zendure_emergency_u2','on')
               or is_state('input_boolean.zendure_calib_mode_u2','on')
               or is_state('input_boolean.zendure_vguard_u2','on')
               or is_state('input_boolean.zendure_batt_temp_cooldown_u2','on')
               or is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') }}
          cap1: "{{ states('input_number.zendure_effective_cap_u1') | int(0) }}"
          cap2: "{{ states('input_number.zendure_effective_cap_u2') | int(0) }}"
          unit_limit: >-
            {{ [[states('input_number.zendure_conf_max_output_per_unit') | int(800), 0] | max, 800] | min }}
          configured_system_limit: >-
            {{ [[states('input_number.zendure_conf_max_output') | int(1000), 0] | max, 1000] | min }}
          system_limit: "{{ [configured_system_limit | int(1000), unit_limit | int(800) * 2] | min }}"
          desired1: "{{ states('input_number.zendure_last_sent_1') | int(0) }}"
          desired2: "{{ states('input_number.zendure_last_sent_2') | int(0) }}"
          total_desired: "{{ desired1 + desired2 }}"
          balance_total: "{{ [total_desired, cap1 + cap2, system_limit] | min }}"
          dispatched1: "{{ states('input_number.zendure_last_dispatched_1') | int(0) }}"
          dispatched2: "{{ states('input_number.zendure_last_dispatched_2') | int(0) }}"
          confirmed1: "{{ states('input_number.zendure_confirmed_output_1') | int(0) }}"
          confirmed2: "{{ states('input_number.zendure_confirmed_output_2') | int(0) }}"
          pending1: >-
            {{ (state_attr('input_datetime.zendure_output_pending_since_u1','timestamp') | float(0)) > 1
               and dispatched1 != confirmed1 }}
          pending2: >-
            {{ (state_attr('input_datetime.zendure_output_pending_since_u2','timestamp') | float(0)) > 1
               and dispatched2 != confirmed2 }}
          last_dispatch_age1: "{{ now_ts - (state_attr('input_datetime.zendure_last_dispatch_ts_u1','timestamp') | float(0)) }}"
          last_dispatch_age2: "{{ now_ts - (state_attr('input_datetime.zendure_last_dispatch_ts_u2','timestamp') | float(0)) }}"
          last_retry_age1: "{{ now_ts - (state_attr('input_datetime.zendure_last_export_retry_ts_u1','timestamp') | float(0)) }}"
          last_retry_age2: "{{ now_ts - (state_attr('input_datetime.zendure_last_export_retry_ts_u2','timestamp') | float(0)) }}"
          output_ts1: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
          output_ts2: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) }}"
          soc_ts1: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','soc_ts'), 0) }}"
          soc_ts2: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','soc_ts'), 0) }}"
          solar_ts1: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','solar_ts'), 0) }}"
          solar_ts2: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','solar_ts'), 0) }}"
          vmin_ts1: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','vmin_valid_ts'), 0) }}"
          vmin_ts2: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','vmin_valid_ts'), 0) }}"
          batt_temp_ts1: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','battery_temp_valid_ts'), 0) }}"
          batt_temp_ts2: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','battery_temp_valid_ts'), 0) }}"
          hub_temp_ts1: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','hub_temp_valid_ts'), 0) }}"
          hub_temp_ts2: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','hub_temp_valid_ts'), 0) }}"
          output_fresh1: "{{ now_ts - output_ts1 < 20 }}"
          output_fresh2: "{{ now_ts - output_ts2 < 20 }}"
          output_interval_count1: "{{ state_attr('sensor.solarflow_1_mqtt_freshness','output_power_interval_count') | int(0) }}"
          output_interval_count2: "{{ state_attr('sensor.solarflow_2_mqtt_freshness','output_power_interval_count') | int(0) }}"
          physical_cadence_ready: "{{ output_interval_count1 >= 3 and output_interval_count2 >= 3 }}"
          balance_data_fresh1: >-
            {{ now_ts - soc_ts1 < 300 and now_ts - solar_ts1 < 60
               and now_ts - vmin_ts1 < 300
               and ((now_ts - batt_temp_ts1 < 300) or (now_ts - hub_temp_ts1 < 300)) }}
          balance_data_fresh2: >-
            {{ now_ts - soc_ts2 < 300 and now_ts - solar_ts2 < 60
               and now_ts - vmin_ts2 < 300
               and ((now_ts - batt_temp_ts2 < 300) or (now_ts - hub_temp_ts2 < 300)) }}
          actual1: >-
            {{ states('sensor.solarflow_1_output_power') | float(0) if output_fresh1 | bool
               else ([confirmed1 | int(0), dispatched1 | int(0)] | max) }}
          actual2: >-
            {{ states('sensor.solarflow_2_output_power') | float(0) if output_fresh2 | bool
               else ([confirmed2 | int(0), dispatched2 | int(0)] | max) }}
          soc1: "{{ states('sensor.solarflow_1_battery_level') | float(-1) }}"
          soc2: "{{ states('sensor.solarflow_2_battery_level') | float(-1) }}"
          batt_temp1: "{{ states('sensor.solarflow_1_battery_temp_control') | float(999) }}"
          batt_temp2: "{{ states('sensor.solarflow_2_battery_temp_control') | float(999) }}"
          hub_temp1: "{{ states('sensor.solarflow_1_hub_temp_control') | float(999) }}"
          hub_temp2: "{{ states('sensor.solarflow_2_hub_temp_control') | float(999) }}"
          solar1: "{{ states('sensor.solarflow_1_solar_input') | float(0) }}"
          solar2: "{{ states('sensor.solarflow_2_solar_input') | float(0) }}"
          vmin1: "{{ states('sensor.solarflow_1_cell_min_vol') | float(0) }}"
          vmin2: "{{ states('sensor.solarflow_2_cell_min_vol') | float(0) }}"
          weight1: >-
            {% set w = (soc1 / (soc1 + soc2)) if soc1 >= 0 and soc2 >= 0 and (soc1 + soc2) > 0 else 0.5 %}
            {# Continuous thermal fairness starts only at the real derating thresholds. #}
            {% set bp1 = [[((batt_temp1 - 50) / 8 * 0.08), 0.0] | max, 0.08] | min if batt_temp1 < 100 else 0.0 %}
            {% set bp2 = [[((batt_temp2 - 50) / 8 * 0.08), 0.0] | max, 0.08] | min if batt_temp2 < 100 else 0.0 %}
            {% set hp1 = [[((hub_temp1 - 55) / 10 * 0.08), 0.0] | max, 0.08] | min if hub_temp1 < 100 else 0.0 %}
            {% set hp2 = [[((hub_temp2 - 55) / 10 * 0.08), 0.0] | max, 0.08] | min if hub_temp2 < 100 else 0.0 %}
            {% set thermal_penalty1 = [[bp1 + hp1, 0.0] | max, 0.12] | min %}
            {% set thermal_penalty2 = [[bp2 + hp2, 0.0] | max, 0.12] | min %}
            {% set w = w - thermal_penalty1 + thermal_penalty2 %}
            {% if soc1 >= 99 and soc2 < 99 %}{% set w = w + 0.25 %}
            {% elif soc2 >= 99 and soc1 < 99 %}{% set w = w - 0.25 %}{% endif %}
            {% if (solar1 - solar2) > 150 %}{% set w = w + 0.10 %}
            {% elif (solar1 - solar2) < -150 %}{% set w = w - 0.10 %}{% endif %}
            {% set actual_sum = actual1 + actual2 %}
            {% set actual_share = (actual1 / actual_sum) if actual_sum > 50 else w %}
            {% set share_dev = actual_share - w %}
            {% set soc_diff = soc1 - soc2 %}
            {% if (soc_diff | abs) >= 4 and (share_dev | abs) >= 0.15 %}
              {% if soc_diff > 0 and share_dev < 0 %}{% set w = w + 0.08 %}
              {% elif soc_diff < 0 and share_dev > 0 %}{% set w = w - 0.08 %}{% endif %}
            {% endif %}
            {% if (vmin1 + 0.05) < vmin2 %}{% set w = w - 0.08 %}
            {% elif (vmin2 + 0.05) < vmin1 %}{% set w = w + 0.08 %}{% endif %}
            {{ [[w, 0.20] | max, 0.80] | min }}
          requested1: "{{ (balance_total * (weight1 | float(0.5))) | int(0) }}"
          requested2: "{{ balance_total - requested1 }}"
          ideal1_pre: "{{ [requested1, cap1] | min }}"
          ideal2_raw: "{{ [[requested2 + (requested1 - ideal1_pre), 0] | max, cap2] | min }}"
          ideal1_raw: "{{ [[balance_total - ideal2_raw, 0] | max, cap1] | min }}"
          minimum: 30
          ideal1: >-
            {% set total = balance_total | int(0) %}
            {% set low = [minimum, total - cap2] | max %}
            {% set high = [cap1, total - minimum] | min %}
            {% if total < 60 %}
              {{ total if cap1 >= total and desired1 >= desired2 else 0 }}
            {% elif low <= high %}
              {{ [[ideal1_raw, low] | max, high] | min }}
            {% elif cap1 >= total %}{{ total }}
            {% else %}0{% endif %}
          ideal2: "{{ [[balance_total - ideal1, 0] | max, cap2] | min }}"
          delta1: "{{ ideal1 - desired1 }}"
          delta2: "{{ ideal2 - desired2 }}"
          opposing: "{{ (delta1 > 0 and delta2 < 0) or (delta2 > 0 and delta1 < 0) }}"
          transfer_size: "{{ [delta1 | abs, delta2 | abs] | min }}"
          write_bucket_capacity: "{{ states('input_number.zendure_conf_write_bucket_capacity') | float(5) }}"
          write_refill_seconds: "{{ [states('input_number.zendure_conf_write_refill_seconds') | float(4), 0.5] | max }}"
          write_budget1: >-
            {{ [write_bucket_capacity | float(5), states('input_number.zendure_write_tokens_u1') | float(0)
                + ([now_ts - (state_attr('input_datetime.zendure_write_budget_ts_u1','timestamp') | float(0)), 0] | max)
                  / write_refill_seconds | float(4)] | min }}
          write_budget2: >-
            {{ [write_bucket_capacity | float(5), states('input_number.zendure_write_tokens_u2') | float(0)
                + ([now_ts - (state_attr('input_datetime.zendure_write_budget_ts_u2','timestamp') | float(0)), 0] | max)
                  / write_refill_seconds | float(4)] | min }}
          balance_allowed: >-
            {{ grid_stable | bool and balance_cooldown_ok | bool
               and online1 | bool and online2 | bool and not busy1 | bool and not busy2 | bool
               and cap1 >= 30 and cap2 >= 30 and balance_total >= 120
               and output_fresh1 | bool and output_fresh2 | bool
               and physical_cadence_ready | bool
               and balance_data_fresh1 | bool and balance_data_fresh2 | bool
               and not pending1 | bool and not pending2 | bool
               and write_budget1 | float(0) >= 2 and write_budget2 | float(0) >= 2
               and last_dispatch_age1 | float(0) >= 10 and last_dispatch_age2 | float(0) >= 10
               and last_retry_age1 | float(0) >= 30 and last_retry_age2 | float(0) >= 30
               and soc1 >= 0 and soc2 >= 0 and vmin1 > 3.10 and vmin2 > 3.10
               and opposing | bool and transfer_size >= min_transfer }}
          next_trim: "{{ 'u1' if (cap1 - ideal1) >= (cap2 - ideal2) else 'u2' }}"
          generation_next: "{{ ((as_timestamp(now()) * 1000000) | int) % 1000000000 }}"

      - if:
          - condition: template
            value_template: "{{ not balance_allowed | bool }}"
        then:
          - stop: "No stable/material unit rebalance required."

      - parallel:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_balance_dispatch }
            data: { timestamp: "{{ now().timestamp() }}" }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_trim_unit }
            data: { value: "{{ next_trim }}" }
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_dispatch_generation }
            data: { value: "{{ generation_next }}" }

      - action: script.turn_on
        target: { entity_id: script.zendure_dispatch_output_pair }
        data:
          variables:
            target_1: "{{ ideal1 }}"
            target_2: "{{ ideal2 }}"
            send_1: true
            send_2: true
            force_1: false
            force_2: false
            ensure_mode_1: true
            ensure_mode_2: true
            reassert_mode_1: false
            reassert_mode_2: false
            update_desired_1: true
            update_desired_2: true
            allow_pending_transfer: true
            cancel_pending_transfer: true
            source: "slow_balance"
            emergency_zero_1: false
            emergency_zero_2: false
            generation: "{{ generation_next }}"

  - alias: "Zendure: Guard Layer (Advanced)"
    id: "zendure_guard_layer"
    mode: restart
    initial_state: true
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: "/2"
        id: periodic
      - trigger: numeric_state
        entity_id: sensor.zendure_grid_power
        above: 150
        for: "00:00:01"
        id: import_spike
      - trigger: numeric_state
        entity_id: sensor.zendure_grid_power
        below: -30
        for: "00:00:01"
        id: export_spike
      - trigger: state
        entity_id: sensor.zendure_grid_power
        id: meter_step
      - trigger: state
        entity_id:
          - input_boolean.zendure_bypass_u1
          - input_boolean.zendure_bypass_u2
        id: mode_change
      - trigger: state
        entity_id:
          - input_boolean.zendure_auto_mode
          - input_boolean.zendure_emergency_u1
          - input_boolean.zendure_emergency_u2
          - input_boolean.zendure_calib_mode_u1
          - input_boolean.zendure_calib_mode_u2
          - input_boolean.zendure_vguard_u1
          - input_boolean.zendure_vguard_u2
          - input_boolean.zendure_calib_discharge_u1
          - input_boolean.zendure_calib_discharge_u2
          - input_boolean.zendure_force_calib_u1
          - input_boolean.zendure_force_calib_u2
          - input_boolean.zendure_batt_temp_cooldown_u1
          - input_boolean.zendure_batt_temp_cooldown_u2
          - input_boolean.zendure_hub_temp_cooldown_u1
          - input_boolean.zendure_hub_temp_cooldown_u2
          - input_number.zendure_conf_max_output_per_unit
          - input_number.zendure_conf_max_output
        id: safety_change
    conditions:
      - condition: template
        value_template: >-
          {% if trigger.id == 'meter_step' and trigger.from_state is not none and trigger.to_state is not none
                and is_number(trigger.from_state.state) and is_number(trigger.to_state.state) %}
            {{ ((trigger.to_state.state | float(0)) - (trigger.from_state.state | float(0))) | abs >= 15 }}
          {% else %}true{% endif %}
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.zendure_auto_mode
            state: "off"
        then:
          - stop: "Auto Mode is OFF - Loop aborted."
      - variables:
          quick_jump: >-
            {% if trigger.id == 'meter_step' and trigger.from_state is not none and trigger.to_state is not none and is_number(trigger.from_state.state) and is_number(trigger.to_state.state) %}
              {{ ((trigger.to_state.state | float(0)) - (trigger.from_state.state | float(0))) | abs }}
            {% else %}
              0
            {% endif %}
      - if:
          - condition: template
            value_template: >-
              {{ trigger.id in ['import_spike','export_spike']
                 or (trigger.id == 'meter_step' and quick_jump | float(0) >= 15) }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_material_grid_change }
            data: { timestamp: "{{ now().timestamp() }}" }

      - variables:
          power_meter_entity: sensor.zendure_grid_power
          shelly_ok: >-
            {% set s = states.sensor.zendure_grid_power %}
            {{ s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','NONE']
               and is_number(s.state)
               and state_attr('sensor.zendure_grid_power','source_fresh') | default(false) | bool }}

          status_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','status_ts'), 0) }}"
          status_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','status_ts'), 0) }}"
          output_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
          output_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) }}"
          output_limit_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) }}"
          output_limit_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) }}"
          solar_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','solar_ts'), 0) }}"
          solar_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','solar_ts'), 0) }}"
          soc_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','soc_ts'), 0) }}"
          soc_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','soc_ts'), 0) }}"
          vmin_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','vmin_valid_ts'), 0) }}"
          vmin_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','vmin_valid_ts'), 0) }}"
          battery_temp_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','battery_temp_valid_ts'), 0) }}"
          battery_temp_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','battery_temp_valid_ts'), 0) }}"
          hub_temp_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','hub_temp_valid_ts'), 0) }}"
          hub_temp_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','hub_temp_valid_ts'), 0) }}"

          s1_fresh: >-
            {{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
               and status_age_1 | float(9999) < 300 }}
          s2_fresh: >-
            {{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
               and status_age_2 | float(9999) < 300 }}

          v1_min_ok: "{{ is_number(states('sensor.solarflow_1_cell_min_vol')) and vmin_age_1 | float(9999) < 300 }}"
          v2_min_ok: "{{ is_number(states('sensor.solarflow_2_cell_min_vol')) and vmin_age_2 | float(9999) < 300 }}"
          v1_min: "{{ states('sensor.solarflow_1_cell_min_vol') | float(0) if v1_min_ok | bool else 0 }}"
          v2_min: "{{ states('sensor.solarflow_2_cell_min_vol') | float(0) if v2_min_ok | bool else 0 }}"
          batt_t1_valid: "{{ is_number(states('sensor.solarflow_1_battery_temp_control')) and battery_temp_age_1 | float(9999) < 300 }}"
          batt_t2_valid: "{{ is_number(states('sensor.solarflow_2_battery_temp_control')) and battery_temp_age_2 | float(9999) < 300 }}"
          hub_t1_valid: "{{ is_number(states('sensor.solarflow_1_hub_temp_control')) and hub_temp_age_1 | float(9999) < 300 }}"
          hub_t2_valid: "{{ is_number(states('sensor.solarflow_2_hub_temp_control')) and hub_temp_age_2 | float(9999) < 300 }}"
          batt_t1_raw: "{{ states('sensor.solarflow_1_battery_temp_control') | float(999) }}"
          batt_t2_raw: "{{ states('sensor.solarflow_2_battery_temp_control') | float(999) }}"
          hub_t1_raw: "{{ states('sensor.solarflow_1_hub_temp_control') | float(999) }}"
          hub_t2_raw: "{{ states('sensor.solarflow_2_hub_temp_control') | float(999) }}"
          t1_raw: >-
            {% if batt_t1_valid | bool and hub_t1_valid | bool %}{{ [batt_t1_raw | float(999), hub_t1_raw | float(999)] | max }}
            {% elif batt_t1_valid | bool %}{{ batt_t1_raw | float(999) }}
            {% elif hub_t1_valid | bool %}{{ hub_t1_raw | float(999) }}
            {% else %}999{% endif %}
          t2_raw: >-
            {% if batt_t2_valid | bool and hub_t2_valid | bool %}{{ [batt_t2_raw | float(999), hub_t2_raw | float(999)] | max }}
            {% elif batt_t2_valid | bool %}{{ batt_t2_raw | float(999) }}
            {% elif hub_t2_valid | bool %}{{ hub_t2_raw | float(999) }}
            {% else %}999{% endif %}
          temp_sources_u1: "{{ (1 if batt_t1_valid | bool else 0) + (1 if hub_t1_valid | bool else 0) }}"
          temp_sources_u2: "{{ (1 if batt_t2_valid | bool else 0) + (1 if hub_t2_valid | bool else 0) }}"
          soc1_raw: "{{ states('sensor.solarflow_1_battery_level') | float(-1) if soc_age_1 | float(9999) < 300 else -1 }}"
          soc2_raw: "{{ states('sensor.solarflow_2_battery_level') | float(-1) if soc_age_2 | float(9999) < 300 else -1 }}"

          s1_plausible: >-
            {{ temp_sources_u1 | int(0) >= 1 and t1_raw < 100
               and v1_min_ok | bool and v1_min > 2.0 and soc1_raw >= 0 }}
          s2_plausible: >-
            {{ temp_sources_u2 | int(0) >= 1 and t2_raw < 100
               and v2_min_ok | bool and v2_min > 2.0 and soc2_raw >= 0 }}

          s1_ok: "{{ s1_fresh | bool and s1_plausible | bool }}"
          s2_ok: "{{ s2_fresh | bool and s2_plausible | bool }}"
          pv_u1_recent: >-
            {% set sol = states.sensor.solarflow_1_solar_input %}
            {{ s1_fresh | bool and solar_age_1 | float(9999) < 60 and sol is not none and is_number(sol.state) and (sol.state | float(-1)) >= 0 }}
          pv_u2_recent: >-
            {% set sol = states.sensor.solarflow_2_solar_input %}
            {{ s2_fresh | bool and solar_age_2 | float(9999) < 60 and sol is not none and is_number(sol.state) and (sol.state | float(-1)) >= 0 }}

          t1: "{{ t1_raw if s1_ok | bool else 99 }}"
          t2: "{{ t2_raw if s2_ok | bool else 99 }}"
          batt_t1: "{{ batt_t1_raw if s1_ok | bool and batt_t1_valid | bool else 999 }}"
          batt_t2: "{{ batt_t2_raw if s2_ok | bool and batt_t2_valid | bool else 999 }}"
          hub_t1: "{{ hub_t1_raw if s1_ok | bool and hub_t1_valid | bool else 999 }}"
          hub_t2: "{{ hub_t2_raw if s2_ok | bool and hub_t2_valid | bool else 999 }}"
          soc1_val: "{{ soc1_raw if s1_ok | bool else 0 }}"
          soc2_val: "{{ soc2_raw if s2_ok | bool else 0 }}"
          soc1_valid: "{{ s1_ok | bool }}"
          soc2_valid: "{{ s2_ok | bool }}"

          s1_desired: "{{ [states('input_number.zendure_last_sent_1')|float(0)|int, 0]|max }}"
          s2_desired: "{{ [states('input_number.zendure_last_sent_2')|float(0)|int, 0]|max }}"
          s1_dispatched: "{{ [states('input_number.zendure_last_dispatched_1')|float(0)|int, 0]|max }}"
          s2_dispatched: "{{ [states('input_number.zendure_last_dispatched_2')|float(0)|int, 0]|max }}"
          s1_confirmed: "{{ [states('input_number.zendure_confirmed_output_1')|float(0)|int, 0]|max }}"
          s2_confirmed: "{{ [states('input_number.zendure_confirmed_output_2')|float(0)|int, 0]|max }}"
          s1_base: "{{ s1_dispatched | int(0) }}"
          s2_base: "{{ s2_dispatched | int(0) }}"
          s1_out_val: "{{ s1_confirmed | int(0) }}"
          s2_out_val: "{{ s2_confirmed | int(0) }}"

          last_dispatch_1_ts: "{{ (state_attr('input_datetime.zendure_last_dispatch_ts_u1','timestamp') | float(0)) }}"
          last_dispatch_2_ts: "{{ (state_attr('input_datetime.zendure_last_dispatch_ts_u2','timestamp') | float(0)) }}"
          pending_since_1_ts: "{{ (state_attr('input_datetime.zendure_output_pending_since_u1','timestamp') | float(0)) }}"
          pending_since_2_ts: "{{ (state_attr('input_datetime.zendure_output_pending_since_u2','timestamp') | float(0)) }}"
          time_since_1: "{{ as_timestamp(now()) - last_dispatch_1_ts }}"
          time_since_2: "{{ as_timestamp(now()) - last_dispatch_2_ts }}"
          pending_age_1: "{{ as_timestamp(now()) - pending_since_1_ts if pending_since_1_ts > 1 else 0 }}"
          pending_age_2: "{{ as_timestamp(now()) - pending_since_2_ts if pending_since_2_ts > 1 else 0 }}"

          ack_transport_pending_1: >-
            {{ pending_since_1_ts > 1 and
               (s1_out_val != s1_dispatched or
                as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) < last_dispatch_1_ts) }}
          ack_transport_pending_2: >-
            {{ pending_since_2_ts > 1 and
               (s2_out_val != s2_dispatched or
                as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) < last_dispatch_2_ts) }}
          ack_physical_effective_1: >-
            {{ output_age_1 | float(9999) < 20
               and as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) >= last_dispatch_1_ts
               and ((states('sensor.solarflow_1_output_power') | float(0)) - (s1_dispatched | float(0))) | abs <= 30 }}
          ack_physical_effective_2: >-
            {{ output_age_2 | float(9999) < 20
               and as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) >= last_dispatch_2_ts
               and ((states('sensor.solarflow_2_output_power') | float(0)) - (s2_dispatched | float(0))) | abs <= 30 }}
          ack_pending_1: "{{ ack_transport_pending_1 | bool and not ack_physical_effective_1 | bool }}"
          ack_pending_2: "{{ ack_transport_pending_2 | bool and not ack_physical_effective_2 | bool }}"
          soc_off: "{{ states('input_number.zendure_conf_soc_off') | int(20) }}"
          hysteresis: "{{ states('input_number.zendure_conf_hysteresis') | int(10) }}"

          bypass1: "{{ is_state('input_boolean.zendure_bypass_u1','on') }}"
          bypass2: "{{ is_state('input_boolean.zendure_bypass_u2','on') }}"
          s1_solar: "{{ states('sensor.solarflow_1_solar_input') | float(0) if pv_u1_recent | bool else 0 }}"
          s2_solar: "{{ states('sensor.solarflow_2_solar_input') | float(0) if pv_u2_recent | bool else 0 }}"
          s1_solar_avg: "{{ states('sensor.zendure_u1_pv_mean_20s') | float(s1_solar|float(0)) }}"
          s2_solar_avg: "{{ states('sensor.zendure_u2_pv_mean_20s') | float(s2_solar|float(0)) }}"
          batt_temp_cooldown_u1: "{{ is_state('input_boolean.zendure_batt_temp_cooldown_u1','on') }}"
          batt_temp_cooldown_u2: "{{ is_state('input_boolean.zendure_batt_temp_cooldown_u2','on') }}"
          hub_temp_cooldown_u1: "{{ is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') }}"
          hub_temp_cooldown_u2: "{{ is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') }}"
          unit_max: >-
            {{ [[states('input_number.zendure_conf_max_output_per_unit') | int(800), 0] | max, 800] | min }}
          configured_global_max: "{{ [[states('input_number.zendure_conf_max_output') | int(1000), 0] | max, 1000] | min }}"
          global_max: >-
            {{ [configured_global_max | int(1000), (unit_max | int(800)) * 2] | min }}
          single_temp_cap: >-
            {{ [[states('input_number.zendure_conf_single_temp_cap') | int(400), 100] | max,
                 unit_max | int(800)] | min }}
          batt_temp_cap_u1: >-
            {% set pv = (s1_solar * 0.9) | int(0) %}
            {% set bt = batt_t1 | float(999) %}
            {% if not batt_t1_valid | bool %}800
            {% elif batt_temp_cooldown_u1 | bool or bt >= 58 %}0
            {% elif bt >= 55 %}{{ pv }}
            {% elif bt >= 53 %}{{ [300, pv + 75] | min }}
            {% elif bt >= 50 %}{{ [500, pv + 150] | min }}
            {% elif bt < 0 %}0
            {% else %}800{% endif %}
          batt_temp_cap_u2: >-
            {% set pv = (s2_solar * 0.9) | int(0) %}
            {% set bt = batt_t2 | float(999) %}
            {% if not batt_t2_valid | bool %}800
            {% elif batt_temp_cooldown_u2 | bool or bt >= 58 %}0
            {% elif bt >= 55 %}{{ pv }}
            {% elif bt >= 53 %}{{ [300, pv + 75] | min }}
            {% elif bt >= 50 %}{{ [500, pv + 150] | min }}
            {% elif bt < 0 %}0
            {% else %}800{% endif %}
          hub_temp_cap_u1: >-
            {% set ht = hub_t1 | float(999) %}
            {% if not hub_t1_valid | bool %}800
            {% elif hub_temp_cooldown_u1 | bool or ht >= 65 %}0
            {% elif ht >= 62 %}100
            {% elif ht >= 60 %}200
            {% elif ht >= 58 %}400
            {% elif ht >= 55 %}600
            {% elif ht < 0 %}0
            {% else %}800{% endif %}
          hub_temp_cap_u2: >-
            {% set ht = hub_t2 | float(999) %}
            {% if not hub_t2_valid | bool %}800
            {% elif hub_temp_cooldown_u2 | bool or ht >= 65 %}0
            {% elif ht >= 62 %}100
            {% elif ht >= 60 %}200
            {% elif ht >= 58 %}400
            {% elif ht >= 55 %}600
            {% elif ht < 0 %}0
            {% else %}800{% endif %}
          temp_cap_u1: >-
            {{ [batt_temp_cap_u1 | int(800), hub_temp_cap_u1 | int(800), unit_max | int(800),
                (single_temp_cap | int(400) if temp_sources_u1 | int(0) == 1 else unit_max | int(800))] | min }}
          temp_cap_u2: >-
            {{ [batt_temp_cap_u2 | int(800), hub_temp_cap_u2 | int(800), unit_max | int(800),
                (single_temp_cap | int(400) if temp_sources_u2 | int(0) == 1 else unit_max | int(800))] | min }}
          actual_1_raw: "{{ states('sensor.solarflow_1_output_power') | float(0) if s1_ok | bool and output_age_1 | float(9999) < 60 and is_number(states('sensor.solarflow_1_output_power')) else 0 }}"
          actual_2_raw: "{{ states('sensor.solarflow_2_output_power') | float(0) if s2_ok | bool and output_age_2 | float(9999) < 60 and is_number(states('sensor.solarflow_2_output_power')) else 0 }}"
          out_pwr_age_1: "{{ output_age_1 | float(9999) }}"
          out_pwr_age_2: "{{ output_age_2 | float(9999) }}"
          out_pwr_fresh_1: "{{ out_pwr_age_1 < 20 }}"
          out_pwr_fresh_2: "{{ out_pwr_age_2 < 20 }}"
          known_output_1: >-
            {% if out_pwr_fresh_1 | bool %}{{ [actual_1_raw | int(0), 0] | max }}
            {% elif output_limit_age_1 | float(9999) < 30 %}{{ [s1_confirmed | int(0), 0] | max }}
            {% else %}{{ [s1_dispatched | int(0), 0] | max }}{% endif %}
          known_output_2: >-
            {% if out_pwr_fresh_2 | bool %}{{ [actual_2_raw | int(0), 0] | max }}
            {% elif output_limit_age_2 | float(9999) < 30 %}{{ [s2_confirmed | int(0), 0] | max }}
            {% else %}{{ [s2_dispatched | int(0), 0] | max }}{% endif %}

          calib1: "{{ is_state('input_boolean.zendure_calib_mode_u1', 'on') }}"
          calib2: "{{ is_state('input_boolean.zendure_calib_mode_u2', 'on') }}"
          calib_any: "{{ calib1 or calib2 }}"
          calib_isolation: "{{ is_state('input_boolean.zendure_conf_calib_isolation', 'on') }}"

          emerg_u1: "{{ is_state('input_boolean.zendure_emergency_u1', 'on') }}"
          emerg_u2: "{{ is_state('input_boolean.zendure_emergency_u2', 'on') }}"
          vguard_u1: "{{ is_state('input_boolean.zendure_vguard_u1', 'on') }}"
          vguard_u2: "{{ is_state('input_boolean.zendure_vguard_u2', 'on') }}"

          busy_u1: "{{ calib1 or emerg_u1 or vguard_u1 or batt_temp_cooldown_u1 or hub_temp_cooldown_u1 }}"
          busy_u2: "{{ calib2 or emerg_u2 or vguard_u2 or batt_temp_cooldown_u2 or hub_temp_cooldown_u2 }}"

          stall_u1: >-
            {{ s1_ok | bool
               and not (busy_u1 | bool)
               and (s1_dispatched | int(0)) >= 120
               and (actual_1_raw | float(0)) < 20
               and (out_pwr_fresh_1 | bool)
               and (time_since_1 | float(0)) > 10
               and (time_since_1 | float(0)) < 120 }}
          stall_u2: >-
            {{ s2_ok | bool
               and not (busy_u2 | bool)
               and (s2_dispatched | int(0)) >= 120
               and (actual_2_raw | float(0)) < 20
               and (out_pwr_fresh_2 | bool)
               and (time_since_2 | float(0)) > 10
               and (time_since_2 | float(0)) < 120 }}

          ghost_load_1: >-
            {{ [s1_dispatched | int(0), s1_confirmed | int(0),
                (states('sensor.solarflow_1_output_power') | int(0)
                 if is_number(states('sensor.solarflow_1_output_power')) else 0), 0] | max
               if not s1_ok | bool else 0 }}
          ghost_load_2: >-
            {{ [s2_dispatched | int(0), s2_confirmed | int(0),
                (states('sensor.solarflow_2_output_power') | int(0)
                 if is_number(states('sensor.solarflow_2_output_power')) else 0), 0] | max
               if not s2_ok | bool else 0 }}
          ghost_total: "{{ (ghost_load_1|int(0)) + (ghost_load_2|int(0)) }}"

          cap_u1: >
            {% set dis1 = is_state('input_boolean.zendure_calib_discharge_u1', 'on') %}
            {% set tc = temp_cap_u1 | int(800) %}
            {% if not s1_ok|bool or busy_u1 or stall_u1 %}0
            {% elif calib_isolation and calib_any and not calib1 and not dis1 %}0
            {% elif is_state('input_boolean.zendure_emergency_u1','on') or is_state('input_boolean.zendure_vguard_u1','on') or calib1 %}0
            {% elif v1_min <= 2.95 %}0
            {% elif tc <= 0 %}0
            {% elif dis1 and v1_min <= 3.00 %}0
            {% elif dis1 and v1_min <= 3.05 and soc1_val <= 10 %}0
            {% elif dis1 and v1_min < 3.08 %}{{ [((s1_solar * 0.9) + 75) | int(0), tc] | min }}
            {% elif dis1 and (v1_min < 3.15 or soc1_val <= 30) %}{{ [((s1_solar * 0.9) + 100) | int(0), tc] | min }}
            {% elif dis1 and v1_min < 3.20 %}{{ [300, tc] | min }}
            {% elif soc1_val <= soc_off %}0
            {% elif bypass1 %}{{ [(s1_solar * 0.9) | int(0), tc] | min }}
            {% elif v1_min < 3.12 %}{{ [(s1_solar * 0.9) | int(0), tc] | min }}
            {% elif v1_min < 3.15 %}{{ [((s1_solar * 0.9) + 100) | int(0), tc] | min }}
            {% elif soc1_val <= (soc_off|float(20) + 8) %}{{ [((s1_solar * 0.9) + 100) | int(0), tc] | min }}
            {% elif soc1_val <= (soc_off|float(20) + 12) %}{{ [300, ((s1_solar * 0.9) + 150) | int(0), tc] | min }}
            {% else %}{{ tc }}{% endif %}

          cap_u2: >
            {% set dis2 = is_state('input_boolean.zendure_calib_discharge_u2', 'on') %}
            {% set tc = temp_cap_u2 | int(800) %}
            {% if not s2_ok|bool or busy_u2 or stall_u2 %}0
            {% elif calib_isolation and calib_any and not calib2 and not dis2 %}0
            {% elif is_state('input_boolean.zendure_emergency_u2','on') or is_state('input_boolean.zendure_vguard_u2','on') or calib2 %}0
            {% elif v2_min <= 2.95 %}0
            {% elif tc <= 0 %}0
            {% elif dis2 and v2_min <= 3.00 %}0
            {% elif dis2 and v2_min <= 3.05 and soc2_val <= 10 %}0
            {% elif dis2 and v2_min < 3.08 %}{{ [((s2_solar * 0.9) + 75) | int(0), tc] | min }}
            {% elif dis2 and (v2_min < 3.15 or soc2_val <= 30) %}{{ [((s2_solar * 0.9) + 100) | int(0), tc] | min }}
            {% elif dis2 and v2_min < 3.20 %}{{ [300, tc] | min }}
            {% elif soc2_val <= soc_off %}0
            {% elif bypass2 %}{{ [(s2_solar * 0.9) | int(0), tc] | min }}
            {% elif v2_min < 3.12 %}{{ [(s2_solar * 0.9) | int(0), tc] | min }}
            {% elif v2_min < 3.15 %}{{ [((s2_solar * 0.9) + 100) | int(0), tc] | min }}
            {% elif soc2_val <= (soc_off|float(20) + 8) %}{{ [((s2_solar * 0.9) + 100) | int(0), tc] | min }}
            {% elif soc2_val <= (soc_off|float(20) + 12) %}{{ [300, ((s2_solar * 0.9) + 150) | int(0), tc] | min }}
            {% else %}{{ tc }}{% endif %}

          available_capacity: "{{ [ (global_max|int(0) - ghost_total|int(0)), 0 ] | max }}"

          failsafe: "{{ states('input_number.zendure_conf_failsafe_watt') | int(130) }}"
          grid_bias: "{{ states('input_number.zendure_conf_grid_bias') | int(10) }}"

          zen_mode: "{{ (bypass1 or bypass2) }}"
          slider_change: "{{ states('input_number.zendure_conf_min_change') | int(8) }}"
          jump_raw: >-
            {% if trigger.id == 'meter_step' and trigger.from_state is not none and trigger.to_state is not none and is_number(trigger.from_state.state) and is_number(trigger.to_state.state) %}
              {{ ((trigger.to_state.state | float(0)) - (trigger.from_state.state | float(0))) | abs }}
            {% else %}
              0
            {% endif %}
          fast_jump_threshold: "{{ [[(hysteresis|int(10) * 2), 30] | max, 120] | min }}"
          fast_event: "{{ trigger.id == 'meter_step' and (jump_raw | float(0)) >= (fast_jump_threshold | int(30)) }}"
          fast_push_1: "{{ fast_event and time_since_1 > 1.2 }}"
          fast_push_2: "{{ fast_event and time_since_2 > 1.2 }}"
          min_change_base: "{{ ([((slider_change | int(8)) * 4), 20] | min) if (zen_mode | bool) else (slider_change | int(8)) }}"
          min_change: "{{ [5, ((min_change_base | int(0)) // 2)] | max if fast_event else min_change_base }}"
          write_bucket_capacity: "{{ states('input_number.zendure_conf_write_bucket_capacity') | float(5) }}"
          write_refill_seconds: "{{ [states('input_number.zendure_conf_write_refill_seconds') | float(4), 0.5] | max }}"
          write_tokens_u1_effective: >-
            {{ [write_bucket_capacity | float(5),
                states('input_number.zendure_write_tokens_u1') | float(write_bucket_capacity | float(5))
                + ([as_timestamp(now()) - (state_attr('input_datetime.zendure_write_budget_ts_u1','timestamp') | float(0)), 0] | max)
                  / (write_refill_seconds | float(4))] | min }}
          write_tokens_u2_effective: >-
            {{ [write_bucket_capacity | float(5),
                states('input_number.zendure_write_tokens_u2') | float(write_bucket_capacity | float(5))
                + ([as_timestamp(now()) - (state_attr('input_datetime.zendure_write_budget_ts_u2','timestamp') | float(0)), 0] | max)
                  / (write_refill_seconds | float(4))] | min }}
          antiflood_u1: "{{ write_tokens_u1_effective | float(0) < 1 }}"
          antiflood_u2: "{{ write_tokens_u2_effective | float(0) < 1 }}"
          min_change_u1: "{{ [min_change | int(8), (20 if antiflood_u1 | bool else 0)] | max }}"
          min_change_u2: "{{ [min_change | int(8), (20 if antiflood_u2 | bool else 0)] | max }}"

          override_margin: "{{ [[min_change_u1 | int(8), min_change_u2 | int(8)] | max, 10] | max }}"

          override_u1: "{{ s1_ok | bool and (known_output_1 | int(0) > (cap_u1 | int(0) + override_margin | int(0))) }}"
          override_u2: "{{ s2_ok | bool and (known_output_2 | int(0) > (cap_u2 | int(0) + override_margin | int(0))) }}"
          force_zero_u1: "{{ s1_ok | bool and (cap_u1 | int(0) == 0) and (known_output_1 | int(0) > 0) }}"
          force_zero_u2: "{{ s2_ok | bool and (cap_u2 | int(0) == 0) and (known_output_2 | int(0) > 0) }}"
          data_invalid_force_zero_u1: >-
            {{ s1_fresh|bool and not s1_plausible|bool and
               [s1_desired|int(0), s1_dispatched|int(0), s1_confirmed|int(0)] | max > 0 }}
          data_invalid_force_zero_u2: >-
            {{ s2_fresh|bool and not s2_plausible|bool and
               [s2_desired|int(0), s2_dispatched|int(0), s2_confirmed|int(0)] | max > 0 }}
          safety_override: "{{ override_u1 or override_u2 }}"


          grid: "{{ (states(power_meter_entity) | float(0)) if shelly_ok | bool else 0 }}"
          stale_force_zero_u1: "{{ (not s1_fresh | bool) and (known_output_1 | int(0) > 0) and ((grid | float(0)) < -80) }}"
          stale_force_zero_u2: "{{ (not s2_fresh | bool) and (known_output_2 | int(0) > 0) and ((grid | float(0)) < -80) }}"
          force_zero_dispatch_u1: "{{ force_zero_u1 | bool and s1_dispatched | int(0) != 0 }}"
          force_zero_dispatch_u2: "{{ force_zero_u2 | bool and s2_dispatched | int(0) != 0 }}"
          stale_zero_dispatch_u1: "{{ stale_force_zero_u1 | bool and s1_dispatched | int(0) != 0 }}"
          stale_zero_dispatch_u2: "{{ stale_force_zero_u2 | bool and s2_dispatched | int(0) != 0 }}"
          invalid_zero_dispatch_u1: "{{ data_invalid_force_zero_u1 | bool and s1_dispatched | int(0) != 0 }}"
          invalid_zero_dispatch_u2: "{{ data_invalid_force_zero_u2 | bool and s2_dispatched | int(0) != 0 }}"

          actual_1: >-
            {% if out_pwr_age_1 | float(9999) < 12 %}{{ actual_1_raw | float(0) }}
            {% elif output_limit_age_1 | float(9999) < 30 %}{{ s1_confirmed | int(0) }}
            {% else %}{{ s1_dispatched | int(0) }}{% endif %}
          actual_2: >-
            {% if out_pwr_age_2 | float(9999) < 12 %}{{ actual_2_raw | float(0) }}
            {% elif output_limit_age_2 | float(9999) < 30 %}{{ s2_confirmed | int(0) }}
            {% else %}{{ s2_dispatched | int(0) }}{% endif %}

          actual_total: "{{ (actual_1 | int(0)) + (actual_2 | int(0)) }}"

          busy_actual_1: "{{ actual_1 | int(0) if busy_u1 | bool else 0 }}"
          busy_actual_2: "{{ actual_2 | int(0) if busy_u2 | bool else 0 }}"
          busy_actual_total: "{{ (busy_actual_1 | int(0)) + (busy_actual_2 | int(0)) }}"
          cmd_total: "{{ (s1_base|int(0)) + (s2_base|int(0)) }}"

          transfer_pending: "{{ is_state('input_boolean.zendure_transfer_pending','on') }}"
          transfer_generation: "{{ states('input_number.zendure_transfer_generation') | int(0) }}"
          transfer_generation_current: "{{ states('input_number.zendure_dispatch_generation') | int(0) }}"
          transfer_active: "{{ transfer_pending | bool and transfer_generation == transfer_generation_current }}"
          transfer_lower_unit: "{{ states('input_text.zendure_transfer_lower_unit') | lower }}"
          transfer_target_1: "{{ states('input_number.zendure_transfer_target_u1') | int(0) }}"
          transfer_target_2: "{{ states('input_number.zendure_transfer_target_u2') | int(0) }}"
          transfer_target_total: "{{ transfer_target_1 + transfer_target_2 }}"
          transfer_start_effective_1: "{{ states('input_number.zendure_transfer_start_effective_u1') | int(0) }}"
          transfer_start_effective_2: "{{ states('input_number.zendure_transfer_start_effective_u2') | int(0) }}"
          transfer_started_ts: "{{ (state_attr('input_datetime.zendure_transfer_started','timestamp') | float(0)) }}"
          transfer_actual_after_start_1: >-
            {{ transfer_started_ts > 1
               and as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) >= transfer_started_ts
               and out_pwr_age_1 | float(9999) < 10 }}
          transfer_actual_after_start_2: >-
            {{ transfer_started_ts > 1
               and as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) >= transfer_started_ts
               and out_pwr_age_2 | float(9999) < 10 }}
          transfer_age: >-
            {{ as_timestamp(now()) - transfer_started_ts if transfer_started_ts > 1 else 9999 }}
          # Only fresh physical power after the lower command counts as progress.
          transfer_progress: >-
            {% if transfer_active | bool and transfer_lower_unit == 'u1' and transfer_actual_after_start_1 | bool %}
              {{ [[transfer_start_effective_1 - (actual_1 | int(0)), 0] | max,
                   transfer_start_effective_1 - transfer_target_1] | min }}
            {% elif transfer_active | bool and transfer_lower_unit == 'u2' and transfer_actual_after_start_2 | bool %}
              {{ [[transfer_start_effective_2 - (actual_2 | int(0)), 0] | max,
                   transfer_start_effective_2 - transfer_target_2] | min }}
            {% else %}0{% endif %}
          pending_transfer_deficit: "{{ [transfer_progress | int(0), 0] | max }}"

          tracking_stale: "{{ (out_pwr_age_1|float(9999) > 25) or (out_pwr_age_2|float(9999) > 25) }}"
          recent_cmd_activity: "{{ (time_since_1|float(0) < 25) or (time_since_2|float(0) < 25) }}"
          cmd_actual_gap: "{{ ((actual_total|int(0)) - (cmd_total|int(0))) | abs }}"
          tracking_unreliable: "{{ tracking_stale|bool or (recent_cmd_activity|bool and (cmd_actual_gap|int(0) > 220)) }}"
          control_total: >-
            {% if transfer_active | bool %}
              {{ transfer_target_total | int(0) }}
            {% elif tracking_unreliable | bool %}
              {{ cmd_total | int(0) }}
            {% else %}
              {{ ((cmd_total|int(0) * 0.50) + (actual_total|int(0) * 0.50)) | int(0) }}
            {% endif %}
          grid_control: >-
            {% if transfer_active | bool and transfer_age | float(9999) < 3
                  and grid | float(0) > grid_bias | float(10) %}
              {{ grid_bias | float(10) }}
            {% elif transfer_active | bool %}
              {{ (grid | float(0)) - (pending_transfer_deficit | int(0)) }}
            {% else %}{{ grid | float(0) }}{% endif %}

          target_raw: >-
            {% if shelly_ok | bool %}
              {{ (control_total | int(0)) + (grid_control | float(0)) - (grid_bias | int(0)) }}
            {% else %}
              {{ [control_total | int(0), failsafe | int(0)] | min }}
            {% endif %}

          target_total: >-
            {% set raw = [[target_raw|int(0), 0]|max, global_max]|min %}
            {% set current = actual_total|int(0) %}
            {% set lowest_soc = [soc1_val|int(100), soc2_val|int(100)]|min %}
            {% set max_step = 100 %}
            {% if lowest_soc < 25 and raw > current and (raw - current) > max_step %}
              {{ current + max_step }}
            {% else %}
              {{ raw }}
            {% endif %}

          delta_effective: "{{ (target_total|int(0)) - (control_total|int(0)) }}"

      # Cache effective caps for the deliberately slower balancing loop.
      - parallel:
          - if:
              - condition: template
                value_template: "{{ states('input_number.zendure_effective_cap_u1') | int(-1) != cap_u1 | int(0) }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_effective_cap_u1 }
                data: { value: "{{ cap_u1 | int(0) }}" }
          - if:
              - condition: template
                value_template: "{{ states('input_number.zendure_effective_cap_u2') | int(-1) != cap_u2 | int(0) }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_effective_cap_u2 }
                data: { value: "{{ cap_u2 | int(0) }}" }

      - if:
          - condition: template
            value_template: "{{ transfer_pending | bool and not transfer_active | bool }}"
        then:
          - action: script.zendure_clear_pending_transfer

      - condition: template
        value_template: >
          {{ safety_override
             or force_zero_u1
             or force_zero_u2
             or stale_force_zero_u1
             or stale_force_zero_u2
             or data_invalid_force_zero_u1
             or data_invalid_force_zero_u2
             or fast_event
             or stall_u1
             or stall_u2
             or states('input_text.zendure_ac_mode_u1') != 'Output mode'
             or states('input_text.zendure_ac_mode_u2') != 'Output mode'
             or ((delta_effective | int(0) | abs) > (hysteresis | int(0)))
             or (actual_total | int(0) > global_max | int(0))
             or ((grid | float(0)) < -40) }}

      - variables:
          cmd_retry_s: >-
            {% if fast_event %}
              1.5
            {% elif (target_total|int(0)) < (actual_total|int(0)) %}
              2.0
            {% else %}
              2.5
            {% endif %}
          cmd_u1_cooldown_ok: "{{ (time_since_1 | float(0)) > cmd_retry_s }}"
          cmd_u2_cooldown_ok: "{{ (time_since_2 | float(0)) > cmd_retry_s }}"

          target_online: "{{ [[(target_total|int(0) - ghost_total|int(0) - busy_actual_total|int(0)), 0]|max, available_capacity|int(0)]|min }}"

          active_1: "{{ s1_ok | bool and not (busy_u1 | bool) }}"
          active_2: "{{ s2_ok | bool and not (busy_u2 | bool) }}"
          trim_pref_raw: "{{ states('input_text.zendure_trim_unit') | lower }}"
          trim_pref: "{{ trim_pref_raw if trim_pref_raw in ['u1','u2'] else 'u1' }}"
          trim_u1: >-
            {% if active_1 | bool and not active_2 | bool %}true
            {% elif active_2 | bool and not active_1 | bool %}false
            {% else %}{{ trim_pref == 'u1' }}{% endif %}
          pending_total_unchanged: >-
            {{ transfer_active | bool and
               ((target_online | int(0)) - (transfer_target_total | int(0))) | abs < 30 }}
          pending_targets_safe: >-
            {{ transfer_target_1 | int(0) <= cap_u1 | int(0)
               and transfer_target_2 | int(0) <= cap_u2 | int(0)
               and transfer_target_total | int(0) <= available_capacity | int(0) }}
          hold_pending_pair: >-
            {{ pending_total_unchanged | bool and pending_targets_safe | bool
               and not safety_override | bool and not force_zero_u1 | bool and not force_zero_u2 | bool
               and not stale_force_zero_u1 | bool and not stale_force_zero_u2 | bool
               and not data_invalid_force_zero_u1 | bool and not data_invalid_force_zero_u2 | bool }}

          model_1: "{{ s1_dispatched | int(0) }}"
          model_2: "{{ s2_dispatched | int(0) }}"
          base_1: "{{ [[model_1 | int(0), 0] | max, cap_u1 | int(0)] | min if active_1 | bool else 0 }}"
          base_2: "{{ [[model_2 | int(0), 0] | max, cap_u2 | int(0)] | min if active_2 | bool else 0 }}"
          fast_total: >-
            {{ [[target_online | int(0), 0] | max,
                 cap_u1 | int(0) + cap_u2 | int(0), available_capacity | int(0)] | min }}
          base_sum: "{{ base_1 | int(0) + base_2 | int(0) }}"
          pair_delta: "{{ fast_total | int(0) - base_sum | int(0) }}"

          provisional_1: >-
            {% set b1 = base_1 | int(0) %}
            {% set b2 = base_2 | int(0) %}
            {% set d = pair_delta | int(0) %}
            {% set c1 = cap_u1 | int(0) %}
            {% set c2 = cap_u2 | int(0) %}
            {% if d >= 0 %}
              {% if trim_u1 | bool %}
                {% set add1 = [d, [c1 - b1, 0] | max] | min %}
                {{ b1 + add1 }}
              {% else %}
                {% set add2 = [d, [c2 - b2, 0] | max] | min %}
                {{ b1 + [d - add2, [c1 - b1, 0] | max] | min }}
              {% endif %}
            {% else %}
              {% set cut = -d %}
              {% if trim_u1 | bool %}
                {{ b1 - [cut, b1] | min }}
              {% else %}
                {% set cut2 = [cut, b2] | min %}
                {{ b1 - [cut - cut2, b1] | min }}
              {% endif %}
            {% endif %}
          provisional_2: >-
            {% set b1 = base_1 | int(0) %}
            {% set b2 = base_2 | int(0) %}
            {% set d = pair_delta | int(0) %}
            {% set c1 = cap_u1 | int(0) %}
            {% set c2 = cap_u2 | int(0) %}
            {% if d >= 0 %}
              {% if trim_u1 | bool %}
                {% set add1 = [d, [c1 - b1, 0] | max] | min %}
                {{ b2 + [d - add1, [c2 - b2, 0] | max] | min }}
              {% else %}
                {{ b2 + [d, [c2 - b2, 0] | max] | min }}
              {% endif %}
            {% else %}
              {% set cut = -d %}
              {% if trim_u1 | bool %}
                {% set cut1 = [cut, b1] | min %}
                {{ b2 - [cut - cut1, b2] | min }}
              {% else %}
                {{ b2 - [cut, b2] | min }}
              {% endif %}
            {% endif %}

          start_min_output: 30
          low_load_single_threshold: 100
          prefer_single_u1: >-
            {% if base_1 | int(0) >= start_min_output and base_2 | int(0) < start_min_output %}true
            {% elif base_2 | int(0) >= start_min_output and base_1 | int(0) < start_min_output %}false
            {% else %}{{ trim_u1 | bool }}{% endif %}
          final_1_trim: >-
            {% set total = fast_total | int(0) %}
            {% set a1 = provisional_1 | int(0) %}
            {% set c1 = cap_u1 | int(0) %}
            {% set c2 = cap_u2 | int(0) %}
            {% set minimum = start_min_output | int(30) %}
            {% set prefer1 = prefer_single_u1 | bool %}
            {% if total < minimum or not active_1 | bool %}
              0
            {% elif not active_2 | bool %}
              {{ [total, c1] | min if [total, c1] | min >= minimum else 0 }}
            {% elif total < (minimum * 2) %}
              {% if prefer1 and c1 >= total %}{{ total }}
              {% elif (not prefer1) and c2 >= total %}0
              {% elif c1 >= total %}{{ total }}
              {% else %}0{% endif %}
            {% elif total <= low_load_single_threshold and prefer1 and c1 >= total %}
              {{ total }}
            {% elif total <= low_load_single_threshold and (not prefer1) and c2 >= total %}
              0
            {% else %}
              {% set low = [minimum, total - c2] | max %}
              {% set high = [c1, total - minimum] | min %}
              {% if low <= high %}{{ [[a1, low] | max, high] | min }}
              {% elif c1 >= total %}{{ total }}
              {% elif c2 >= total %}0
              {% elif c1 >= minimum and c2 < minimum %}{{ [total, c1] | min }}
              {% else %}0{% endif %}
            {% endif %}
          final_2_trim: >-
            {% set total = fast_total | int(0) %}
            {% set a1 = final_1_trim | int(0) %}
            {% set allocated = [[total - a1, 0] | max, cap_u2 | int(0)] | min %}
            {{ allocated if allocated >= start_min_output | int(30) else 0 }}

          final_1_eff: "{{ transfer_target_1 | int(0) if hold_pending_pair | bool else final_1_trim | int(0) }}"
          final_2_eff: "{{ transfer_target_2 | int(0) if hold_pending_pair | bool else final_2_trim | int(0) }}"
          heavy_export: "{{ (grid | float(0)) < -40 }}"
          fast_down_1: >-
            {{ heavy_export and (final_1_eff | int(0) < known_output_1 | int(0))
               and final_1_eff | int(0) != s1_dispatched | int(0) }}
          fast_down_2: >-
            {{ heavy_export and (final_2_eff | int(0) < known_output_2 | int(0))
               and final_2_eff | int(0) != s2_dispatched | int(0) }}
          trim_next: >-
            {% if not active_1 | bool and active_2 | bool %}u2
            {% elif not active_2 | bool and active_1 | bool %}u1
            {% elif final_1_eff | int(0) >= cap_u1 | int(0) - 5 and final_2_eff | int(0) < cap_u2 | int(0) - 5 %}u2
            {% elif final_2_eff | int(0) >= cap_u2 | int(0) - 5 and final_1_eff | int(0) < cap_u1 | int(0) - 5 %}u1
            {% elif final_1_eff | int(0) <= 0 and final_2_eff | int(0) > 0 %}u2
            {% elif final_2_eff | int(0) <= 0 and final_1_eff | int(0) > 0 %}u1
            {% else %}{{ trim_pref }}{% endif %}

      - variables:
          supersede_threshold: "{{ [[min_change_u1 | int(8), min_change_u2 | int(8)] | max, 30] | max }}"
          desired_change_u1: "{{ ((final_1_eff | int(0)) - (s1_desired | int(0))) | abs }}"
          desired_change_u2: "{{ ((final_2_eff | int(0)) - (s2_desired | int(0))) | abs }}"
          dispatch_gap_u1: "{{ ((final_1_eff | int(0)) - (s1_dispatched | int(0))) | abs }}"
          dispatch_gap_u2: "{{ ((final_2_eff | int(0)) - (s2_dispatched | int(0))) | abs }}"
          material_new_target_u1: "{{ desired_change_u1 | int(0) >= supersede_threshold | int(30) }}"
          material_new_target_u2: "{{ desired_change_u2 | int(0) >= supersede_threshold | int(30) }}"
          pending_total_change: >-
            {{ transfer_active | bool and
               ((target_online | int(0)) - (transfer_target_total | int(0))) | abs >= supersede_threshold | int(30) }}
          pending_pair_change: >-
            {{ transfer_active | bool and
               (desired_change_u1 | int(0) >= supersede_threshold | int(30)
                or desired_change_u2 | int(0) >= supersede_threshold | int(30)) }}
          cancel_pending_due_new_target: >-
            {{ transfer_active | bool and (pending_total_change | bool or pending_pair_change | bool
               or safety_override | bool or force_zero_u1 | bool or force_zero_u2 | bool
               or stale_force_zero_u1 | bool or stale_force_zero_u2 | bool
               or data_invalid_force_zero_u1 | bool or data_invalid_force_zero_u2 | bool) }}
          pending_hold_u1: >-
            {{ hold_pending_pair | bool and transfer_target_1 | int(0) > s1_dispatched | int(0)
               and not cancel_pending_due_new_target | bool }}
          pending_hold_u2: >-
            {{ hold_pending_pair | bool and transfer_target_2 | int(0) > s2_dispatched | int(0)
               and not cancel_pending_due_new_target | bool }}
          fast_push_effective_1: >-
            {{ fast_push_1 | bool and not hold_pending_pair | bool
               and not antiflood_u1 | bool
               and final_1_eff | int(0) != s1_dispatched | int(0) }}
          fast_push_effective_2: >-
            {{ fast_push_2 | bool and not hold_pending_pair | bool
               and not antiflood_u2 | bool
               and final_2_eff | int(0) != s2_dispatched | int(0) }}
          override_dispatch_u1: "{{ override_u1 | bool and final_1_eff | int(0) != s1_dispatched | int(0) }}"
          override_dispatch_u2: "{{ override_u2 | bool and final_2_eff | int(0) != s2_dispatched | int(0) }}"
          send_u1: >-
            {{ (s1_ok | bool and not busy_u1 and cmd_u1_cooldown_ok and not pending_hold_u1 | bool and
                (not ack_pending_1 | bool or material_new_target_u1 | bool
                 or fast_down_1 | bool or force_zero_dispatch_u1 | bool or fast_push_effective_1 | bool) and
                (fast_down_1 | bool or force_zero_dispatch_u1 | bool or fast_push_effective_1 | bool
                 or desired_change_u1 | int(0) >= min_change_u1 | int(0)
                 or dispatch_gap_u1 | int(0) >= min_change_u1 | int(0)
                 or override_dispatch_u1 | bool
                 or states('input_text.zendure_ac_mode_u1') != 'Output mode'
                 or ((actual_total | int(0) > global_max | int(0))
                     and (known_output_1 | int(0) > final_1_eff | int(0)))))
               or stale_zero_dispatch_u1 | bool or invalid_zero_dispatch_u1 | bool }}
          send_u2: >-
            {{ (s2_ok | bool and not busy_u2 and cmd_u2_cooldown_ok and not pending_hold_u2 | bool and
                (not ack_pending_2 | bool or material_new_target_u2 | bool
                 or fast_down_2 | bool or force_zero_dispatch_u2 | bool or fast_push_effective_2 | bool) and
                (fast_down_2 | bool or force_zero_dispatch_u2 | bool or fast_push_effective_2 | bool
                 or desired_change_u2 | int(0) >= min_change_u2 | int(0)
                 or dispatch_gap_u2 | int(0) >= min_change_u2 | int(0)
                 or override_dispatch_u2 | bool
                 or states('input_text.zendure_ac_mode_u2') != 'Output mode'
                 or ((actual_total | int(0) > global_max | int(0))
                     and (known_output_2 | int(0) > final_2_eff | int(0)))))
               or stale_zero_dispatch_u2 | bool or invalid_zero_dispatch_u2 | bool }}
          pair_target_1: >-
            {{ 0 if (force_zero_u1 | bool or stale_force_zero_u1 | bool
                     or data_invalid_force_zero_u1 | bool) else final_1_eff | int(0) }}
          pair_target_2: >-
            {{ 0 if (force_zero_u2 | bool or stale_force_zero_u2 | bool
                     or data_invalid_force_zero_u2 | bool) else final_2_eff | int(0) }}
          generation_next: "{{ ((as_timestamp(now()) * 1000000) | int) % 1000000000 }}"

      - if:
          - condition: template
            value_template: "{{ cancel_pending_due_new_target | bool or send_u1 | bool or send_u2 | bool }}"
        then:
          - if:
              - condition: template
                value_template: "{{ cancel_pending_due_new_target | bool }}"
            then:
              - action: script.zendure_clear_pending_transfer
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_dispatch_generation }
            data: { value: "{{ generation_next }}" }
          - if:
              - condition: template
                value_template: "{{ send_u1 | bool or send_u2 | bool }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ not hold_pending_pair | bool and trim_next != trim_pref }}"
                then:
                  - action: input_text.set_value
                    target: { entity_id: input_text.zendure_trim_unit }
                    data: { value: "{{ trim_next }}" }
              - action: script.turn_on
                target: { entity_id: script.zendure_dispatch_output_pair }
                data:
                  variables:
                    target_1: "{{ pair_target_1 }}"
                    target_2: "{{ pair_target_2 }}"
                    send_1: "{{ send_u1 }}"
                    send_2: "{{ send_u2 }}"
                    force_1: >-
                      {{ fast_down_1 | bool or force_zero_dispatch_u1 | bool or override_dispatch_u1 | bool
                         or stale_zero_dispatch_u1 | bool or invalid_zero_dispatch_u1 | bool }}
                    force_2: >-
                      {{ fast_down_2 | bool or force_zero_dispatch_u2 | bool or override_dispatch_u2 | bool
                         or stale_zero_dispatch_u2 | bool or invalid_zero_dispatch_u2 | bool }}
                    ensure_mode_1: "{{ not stale_force_zero_u1 | bool and not busy_u1 | bool }}"
                    ensure_mode_2: "{{ not stale_force_zero_u2 | bool and not busy_u2 | bool }}"
                    reassert_mode_1: false
                    reassert_mode_2: false
                    update_desired_1: true
                    update_desired_2: true
                    allow_pending_transfer: true
                    cancel_pending_transfer: "{{ cancel_pending_due_new_target | bool or transfer_pending | bool }}"
                    source: "fast_total"
                    emergency_zero_1: >-
                      {{ force_zero_dispatch_u1 | bool or stale_zero_dispatch_u1 | bool or invalid_zero_dispatch_u1 | bool }}
                    emergency_zero_2: >-
                      {{ force_zero_dispatch_u2 | bool or stale_zero_dispatch_u2 | bool or invalid_zero_dispatch_u2 | bool }}
                    generation: "{{ generation_next }}"



  # --- 6.5 STATE MACHINE (SAFE RETURN & SYNC) ---
  - alias: "Zendure: State Machine (Smart Single-Channel)"
    id: "zendure_state_machine_dual"
    mode: queued
    initial_state: true
    triggers:
      - trigger: state
        entity_id: input_boolean.zendure_auto_mode
        to: "on"
      - trigger: state
        entity_id: input_boolean.zendure_auto_mode
        to: "off"
        id: "auto_off"

      - trigger: time_pattern
        minutes: "/5"
        id: "periodic_reconcile"

      - trigger: state
        id: "temperature_reconcile"
        entity_id:
          - sensor.solarflow_1_battery_temp_control
          - sensor.solarflow_2_battery_temp_control
          - sensor.solarflow_1_hub_temp_control
          - sensor.solarflow_2_hub_temp_control
          - input_boolean.zendure_batt_temp_cooldown_u1
          - input_boolean.zendure_batt_temp_cooldown_u2
          - input_boolean.zendure_hub_temp_cooldown_u1
          - input_boolean.zendure_hub_temp_cooldown_u2

      - trigger: template
        id: "device_online_u1"
        value_template: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
        for: "00:00:01"
      - trigger: template
        id: "device_online_u2"
        value_template: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
        for: "00:00:01"

      - trigger: homeassistant
        event: start
        id: "boot_check"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger.id == 'auto_off' and is_state('input_boolean.zendure_auto_mode','on') }}
            sequence:
              - stop: "Stale auto_off trigger ignored (Auto-Mode already ON)."

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'auto_off' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.zendure_emergency_u1
                    - input_boolean.zendure_emergency_u2
                    - input_boolean.zendure_calib_mode_u1
                    - input_boolean.zendure_calib_mode_u2
                    - input_boolean.zendure_vguard_u1
                    - input_boolean.zendure_vguard_u2
                    - input_boolean.zendure_calib_discharge_u1
                    - input_boolean.zendure_calib_discharge_u2
                    - input_boolean.zendure_force_calib_u1
                    - input_boolean.zendure_force_calib_u2

              - parallel:
                - action: script.zendure_reset_u1_output_safe
                - action: script.zendure_reset_u2_output_safe
              - stop: "Automatik beendet - Full Hard Reset."

          - conditions:
              - condition: template
                value_template: "{{ trigger.id in ['device_online_u1', 'device_online_u2', 'boot_check'] }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ is_state('input_boolean.zendure_auto_mode','off') }}"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id:
                        - input_boolean.zendure_emergency_u1
                        - input_boolean.zendure_emergency_u2
                        - input_boolean.zendure_calib_mode_u1
                        - input_boolean.zendure_calib_mode_u2
                        - input_boolean.zendure_vguard_u1
                        - input_boolean.zendure_vguard_u2
                        - input_boolean.zendure_calib_discharge_u1
                        - input_boolean.zendure_calib_discharge_u2
                        - input_boolean.zendure_force_calib_u1
                        - input_boolean.zendure_force_calib_u2

              - if:
                  - condition: template
                    value_template: >
                      {{ is_state('input_boolean.zendure_emergency_u1','on')
                         or is_state('input_boolean.zendure_emergency_u2','on')
                         or is_state('input_boolean.zendure_auto_mode','off') }}
                then:
                  - parallel:
                      - action: script.zendure_reset_u1_output_safe
                      - action: script.zendure_reset_u2_output_safe

              - wait_template: "{{ is_state('input_boolean.zendure_auto_mode','off') }}"
                timeout: "00:00:05"
                continue_on_timeout: true

              - if:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                then:
                  - parallel:
                      - action: script.zendure_reset_u1_output_safe
                      - action: script.zendure_reset_u2_output_safe
                  - stop: "Auto-Mode switched OFF during Boot/Online Sequence. Full Safety Reconnect applied."

              - parallel:
                - if:
                    - condition: template
                      value_template: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
                  then:
                    - action: script.zendure_dispatch_u1_smartmode
                      data:
                        force: "{{ trigger.id == 'device_online_u1' }}"
                - if:
                    - condition: template
                      value_template: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
                  then:
                    - action: script.zendure_dispatch_u2_smartmode
                      data:
                        force: "{{ trigger.id == 'device_online_u2' }}"
              - delay: "00:00:02"
              - parallel:
                - if:
                    - condition: template
                      value_template: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
                  then:
                    - action: script.zendure_dispatch_u1_smartmode
                - if:
                    - condition: template
                      value_template: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
                  then:
                    - action: script.zendure_dispatch_u2_smartmode

              - wait_template: "{{ is_state('input_boolean.zendure_auto_mode','off') }}"
                timeout: "00:00:02"
                continue_on_timeout: true

              - if:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                then:
                  - parallel:
                      - action: script.zendure_reset_u1_output_safe
                      - action: script.zendure_reset_u2_output_safe
                  - stop: "Auto-Mode switched OFF during Boot/Online Sequence. Full Safety Reconnect applied."

              - parallel:
                - if:
                    - condition: template
                      value_template: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
                  then:
                    - action: script.zendure_dispatch_u1_smartmode
                - if:
                    - condition: template
                      value_template: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
                  then:
                    - action: script.zendure_dispatch_u2_smartmode

              - if:
                  - condition: template
                    value_template: "{{ is_state('input_boolean.zendure_auto_mode','off') }}"
                then:
                  - parallel:
                      - action: script.zendure_reset_u1_output_safe
                      - action: script.zendure_reset_u2_output_safe
                  - stop: "Auto-Mode OFF: Safety Reconnect Hard-Stop applied."

      - if:
          - condition: template
            value_template: >
              {% set tid = trigger.id | default('') %}
              {{ is_state('input_boolean.zendure_auto_mode','off')
                 and tid not in ['auto_off','device_online_u1','device_online_u2','boot_check'] }}
        then:
          - stop: "Auto-Mode OFF: Trigger ignoriert (Strict Hands-Off)."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'periodic_reconcile'
                 and states('sensor.solarflow_1_status_raw')|upper in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                 and states('sensor.solarflow_2_status_raw')|upper in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}
        then:
          - stop: "Periodic reconcile skipped (both units offline)."

      - variables:
          online1: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
          online2: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
          min_soc: 5
          soc1: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
          soc2: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
          soc1_valid: "{{ is_number(states('sensor.solarflow_1_battery_level')) }}"
          soc2_valid: "{{ is_number(states('sensor.solarflow_2_battery_level')) }}"

          sl1: >
            {% if soc1 >= 99 %} 100
            {% elif soc1 >= 97 %} 150
            {% elif soc1 >= 95 %} 200
            {% elif soc1 >= 90 %} 400
            {% else %} 800
            {% endif %}
          sl2: >
            {% if soc2 >= 99 %} 100
            {% elif soc2 >= 97 %} 150
            {% elif soc2 >= 95 %} 200
            {% elif soc2 >= 90 %} 400
            {% else %} 800
            {% endif %}
          ss1: "{% if soc1 < 12 %} 300 {% else %} 800 {% endif %}"
          ss2: "{% if soc2 < 12 %} 300 {% else %} 800 {% endif %}"

          charge_limit_u1: >
            {% set temp_cap = states('sensor.solarflow_1_charge_temperature_cap') | int(0) %}
            {% set soc = states('sensor.solarflow_1_battery_level') | float(-1) %}
            {% set landing_cap = 100 if soc > 97 else (200 if soc >= 90 else 800) %}
            {% set low_soc_cap = 300 if soc < 12 else 800 %}
            {% if is_state('input_boolean.zendure_calib_discharge_u1', 'on') %}0
            {% else %}{{ [temp_cap | int(0), landing_cap | int, low_soc_cap | int] | min }}{% endif %}

          charge_limit_u2: >
            {% set temp_cap = states('sensor.solarflow_2_charge_temperature_cap') | int(0) %}
            {% set soc = states('sensor.solarflow_2_battery_level') | float(-1) %}
            {% set landing_cap = 100 if soc > 97 else (200 if soc >= 90 else 800) %}
            {% set low_soc_cap = 300 if soc < 12 else 800 %}
            {% if is_state('input_boolean.zendure_calib_discharge_u2', 'on') %}0
            {% else %}{{ [temp_cap | int(0), landing_cap | int, low_soc_cap | int] | min }}{% endif %}

          curr_min_soc_1: "{{ states('sensor.solarflow_1_setting_minsoc') | int(-1) }}"
          curr_charge_1: >
            {% set real = states('sensor.solarflow_1_setting_chargelimit') %}
            {{ real | int(states('input_number.zendure_last_chargelimit_u1') | int(-1)) if is_number(real) else states('input_number.zendure_last_chargelimit_u1') | int(-1) }}
          curr_min_soc_2: "{{ states('sensor.solarflow_2_setting_minsoc') | int(-1) }}"
          curr_charge_2: >
            {% set real = states('sensor.solarflow_2_setting_chargelimit') %}
            {{ real | int(states('input_number.zendure_last_chargelimit_u2') | int(-1)) if is_number(real) else states('input_number.zendure_last_chargelimit_u2') | int(-1) }}

      - if:
          - condition: state
            entity_id: input_boolean.zendure_auto_mode
            state: "on"
        then:
          - parallel:
            - if:
                - condition: template
                  value_template: "{{ online1 and curr_min_soc_1|int(-1) != min_soc|int }}"
              then:
                - action: script.zendure_dispatch_u1_minsoc
                  data:
                    value: "{{ min_soc }}"
                    force: false
            - if:
                - condition: template
                  value_template: "{{ online1 and curr_charge_1|int(-1) != charge_limit_u1|int }}"
              then:
                - action: script.zendure_dispatch_u1_chargelimit
                  data:
                    power: "{{ charge_limit_u1 }}"
                    force: false
            - if:
                - condition: template
                  value_template: "{{ online2 and curr_min_soc_2|int(-1) != min_soc|int }}"
              then:
                - action: script.zendure_dispatch_u2_minsoc
                  data:
                    value: "{{ min_soc }}"
                    force: false
            - if:
                - condition: template
                  value_template: "{{ online2 and curr_charge_2|int(-1) != charge_limit_u2|int }}"
              then:
                - action: script.zendure_dispatch_u2_chargelimit
                  data:
                    power: "{{ charge_limit_u2 }}"
                    force: false


  # --- 6.6a SAG CONFIRM U1 ---
  - alias: "Zendure: Sag Confirm U1"
    id: "zendure_sag_confirm_u1"
    mode: single
    initial_state: true
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.solarflow_1_cell_min_vol
        to: null
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      - variables:
          v_first: "{{ trigger.to_state.state | float(99) }}"
          soc_first: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
          online1: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
      - if:
          - condition: template
            value_template: >
              {{ online1
                 and is_state('input_boolean.zendure_calib_mode_u1', 'off')
                 and is_state('input_boolean.zendure_calib_discharge_u1','off')
                 and is_state('input_boolean.zendure_emergency_u1','off')
                 and is_state('input_boolean.zendure_vguard_u1','off')
                 and soc_first > 5
                 and v_first > 2.5
                 and v_first < 3.10 }}
        then:
          - wait_for_trigger:
              - trigger: state
                entity_id: sensor.solarflow_1_cell_min_vol
                to: null
            timeout: "00:02:00"
            continue_on_timeout: false
          - variables:
              v_confirm: "{{ wait.trigger.to_state.state | float(99) if wait.trigger is not none else 99 }}"
              imb_confirm: "{{ states('sensor.solarflow_1_cell_imbalance') | float(0) }}"
              soc_confirm: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
              solar_total: "{{ states('sensor.solarflow_total_solar_input') | float(0) }}"
              s1_solar: "{{ states('sensor.solarflow_1_solar_input') | float(0) if online1 else 0 }}"
              relieved_u1: >
                {{ states('input_number.zendure_last_sent_1')|int(999) == 0
                   or states('sensor.solarflow_1_output_limit')|int(999) == 0 }}
              limit_calib_u1: >
                {% set temp_cap = states('sensor.solarflow_1_charge_temperature_cap') | int(0) %}
                {% set soc1 = states('sensor.solarflow_1_battery_level') | float(0) %}
                {% set sl1 = 100 if soc1 > 97 else (200 if soc1 >= 90 else 800) %}
                {% set soc_soft_u1 = 100 if soc1 < 8 else (300 if soc1 < 12 else 800) %}
                {{ [temp_cap | int(0), sl1 | int, soc_soft_u1 | int] | min }}
              limit_emerg_u1: >
                {% set temp_cap = states('sensor.solarflow_1_charge_temperature_cap') | int(0) %}
                {% set soc1 = states('sensor.solarflow_1_battery_level') | float(0) %}
                {% set ss1 = 300 if soc1 < 12 else 800 %}
                {{ [300, temp_cap | int(0), ss1 | int] | min }}
              confirmed: >
                {% set soc_ceiling = (states('input_number.zendure_conf_soc_emerg_stop')|float(25)) + 2 %}
                {{ is_state('input_boolean.zendure_auto_mode','on')
                   and states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                   and is_state('input_boolean.zendure_calib_mode_u1','off')
                   and is_state('input_boolean.zendure_calib_discharge_u1','off')
                   and is_state('input_boolean.zendure_emergency_u1','off')
                   and is_state('input_boolean.zendure_vguard_u1','off')
                   and (soc_confirm <= soc_ceiling or v_confirm <= 2.95)
                   and v_confirm > 2.5
                   and states('sensor.solarflow_1_output_power')|float(0) > 120
                   and relieved_u1
                   and (
                     v_confirm <= 3.08
                     or (v_confirm <= 3.10 and imb_confirm >= 0.06)
                   ) }}
          - choose:
              # TAG-MODUS: Sofortige Deep-Kalibrierung starten + Harte Notbremse
              - conditions:
                  - condition: template
                    value_template: "{{ confirmed and solar_total >= 150 }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.zendure_force_calib_u1
                  - if:
                      - condition: template
                        value_template: "{{ s1_solar >= 50 }}"
                    then:
                      - action: input_text.set_value
                        target: { entity_id: input_text.zendure_ac_mode_u1 }
                        data: { value: "Output mode" }
                      - action: script.zendure_dispatch_u1_ac_mode
                        data:
                          mode: "Output mode"
                          force: true
                      - action: script.zendure_set_u1_outputlimit_zero
                    else:
                      - action: input_text.set_value
                        target: { entity_id: input_text.zendure_ac_mode_u1 }
                        data: { value: "Input mode" }
                      - action: script.zendure_dispatch_u1_ac_mode
                        data:
                          mode: "Input mode"
                          force: true
                      - action: script.zendure_set_u1_outputlimit_zero
                      - action: script.zendure_dispatch_u1_inputlimit
                        data:
                          power: "{{ limit_calib_u1 }}"
                          force: true
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_last_sent_1 }
                    data: { value: 0 }
                  - action: notify.send_message
                    target:
                      entity_id: !secret telegram_id1
                    data:
                      message: >
                        📉 *Sicherheits-Kalibrierung U1 (Tag)*
                        Unterspannung bestätigt ({{ v_confirm | round(3) }} V, Δ {{ imb_confirm | round(3) }} V). Notbremse aktiv. Deep-Kalibrierung gestartet.

              # NACHT-MODUS: Notstrom-Automatik (AC Ladung) greift als Lebensversicherung ein!
              - conditions:
                  - condition: template
                    value_template: >
                      {{ confirmed
                         and solar_total < 150
                         and ((as_timestamp(now()) - as_timestamp(states('input_datetime.zendure_last_full_charge_1'), default=0)) | int(0)) > 86400 }}
                sequence:
                  - action: input_boolean.turn_on
                    target: { entity_id: input_boolean.zendure_force_calib_u1 }
                  - action: input_boolean.turn_on
                    target: { entity_id: input_boolean.zendure_emergency_u1 }
                  - action: input_text.set_value
                    target: { entity_id: input_text.zendure_ac_mode_u1 }
                    data: { value: "Input mode" }
                  - action: script.zendure_dispatch_u1_ac_mode
                    data:
                      mode: "Input mode"
                      force: true
                  - action: script.zendure_set_u1_outputlimit_zero
                  - action: script.zendure_dispatch_u1_inputlimit
                    data:
                      power: "{{ limit_emerg_u1 }}"
                      force: true
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_last_sent_1 }
                    data: { value: 0 }
                  - action: notify.send_message
                    target:
                      entity_id: !secret telegram_id1
                    data:
                      message: >
                        📉 *Spannungseinbruch U1 (Nacht)*
                        Unterspannung bestätigt ({{ v_confirm | round(3) }} V, Δ {{ imb_confirm | round(3) }} V).
                        Notstrom Automatik übernimmt zur Sicherheit. Deep-Kalibrierung wurde für den Tag vorgemerkt.

  # --- 6.6b SAG CONFIRM U2 ---
  - alias: "Zendure: Sag Confirm U2"
    id: "zendure_sag_confirm_u2"
    mode: single
    initial_state: true
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.solarflow_2_cell_min_vol
        to: null
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      - variables:
          v_first: "{{ trigger.to_state.state | float(99) }}"
          soc_first: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
          online2: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
      - if:
          - condition: template
            value_template: >
              {{ online2
                 and is_state('input_boolean.zendure_calib_mode_u2', 'off')
                 and is_state('input_boolean.zendure_calib_discharge_u2','off')
                 and is_state('input_boolean.zendure_emergency_u2','off')
                 and is_state('input_boolean.zendure_vguard_u2','off')
                 and soc_first > 5
                 and v_first > 2.5
                 and v_first < 3.10 }}
        then:
          - wait_for_trigger:
              - trigger: state
                entity_id: sensor.solarflow_2_cell_min_vol
                to: null
            timeout: "00:02:00"
            continue_on_timeout: false
          - variables:
              v_confirm: "{{ wait.trigger.to_state.state | float(99) if wait.trigger is not none else 99 }}"
              imb_confirm: "{{ states('sensor.solarflow_2_cell_imbalance') | float(0) }}"
              soc_confirm: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
              solar_total: "{{ states('sensor.solarflow_total_solar_input') | float(0) }}"
              s2_solar: "{{ states('sensor.solarflow_2_solar_input') | float(0) if online2 else 0 }}"
              relieved_u2: >
                {{ states('input_number.zendure_last_sent_2')|int(999) == 0
                   or states('sensor.solarflow_2_output_limit')|int(999) == 0 }}
              limit_calib_u2: >
                {% set temp_cap = states('sensor.solarflow_2_charge_temperature_cap') | int(0) %}
                {% set soc2 = states('sensor.solarflow_2_battery_level') | float(0) %}
                {% set sl2 = 100 if soc2 > 97 else (200 if soc2 >= 90 else 800) %}
                {% set soc_soft_u2 = 100 if soc2 < 8 else (300 if soc2 < 12 else 800) %}
                {{ [temp_cap | int(0), sl2 | int, soc_soft_u2 | int] | min }}
              limit_emerg_u2: >
                {% set temp_cap = states('sensor.solarflow_2_charge_temperature_cap') | int(0) %}
                {% set soc2 = states('sensor.solarflow_2_battery_level') | float(0) %}
                {% set ss2 = 300 if soc2 < 12 else 800 %}
                {{ [300, temp_cap | int(0), ss2 | int] | min }}
              confirmed: >
                {% set soc_ceiling = (states('input_number.zendure_conf_soc_emerg_stop')|float(25)) + 2 %}
                {{ is_state('input_boolean.zendure_auto_mode','on')
                   and states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                   and is_state('input_boolean.zendure_calib_mode_u2','off')
                   and is_state('input_boolean.zendure_calib_discharge_u2','off')
                   and is_state('input_boolean.zendure_emergency_u2','off')
                   and is_state('input_boolean.zendure_vguard_u2','off')
                   and (soc_confirm <= soc_ceiling or v_confirm <= 2.95)
                   and v_confirm > 2.5
                   and states('sensor.solarflow_2_output_power')|float(0) > 120
                   and relieved_u2
                   and (
                     v_confirm <= 3.08
                     or (v_confirm <= 3.10 and imb_confirm >= 0.06)
                   ) }}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ confirmed and solar_total >= 150 }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.zendure_force_calib_u2
                  - if:
                      - condition: template
                        value_template: "{{ s2_solar >= 50 }}"
                    then:
                      - action: input_text.set_value
                        target: { entity_id: input_text.zendure_ac_mode_u2 }
                        data: { value: "Output mode" }
                      - action: script.zendure_dispatch_u2_ac_mode
                        data:
                          mode: "Output mode"
                          force: true
                      - action: script.zendure_set_u2_outputlimit_zero
                    else:
                      - action: input_text.set_value
                        target: { entity_id: input_text.zendure_ac_mode_u2 }
                        data: { value: "Input mode" }
                      - action: script.zendure_dispatch_u2_ac_mode
                        data:
                          mode: "Input mode"
                          force: true
                      - action: script.zendure_set_u2_outputlimit_zero
                      - action: script.zendure_dispatch_u2_inputlimit
                        data:
                          power: "{{ limit_calib_u2 }}"
                          force: true
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_last_sent_2 }
                    data: { value: 0 }
                  - action: notify.send_message
                    target:
                      entity_id: !secret telegram_id1
                    data:
                      message: >
                        📉 *Sicherheits-Kalibrierung U2 (Tag)*
                        Unterspannung bestätigt ({{ v_confirm | round(3) }} V, Δ {{ imb_confirm | round(3) }} V). Notbremse aktiv. Deep-Kalibrierung gestartet.

              - conditions:
                  - condition: template
                    value_template: >
                      {{ confirmed
                         and solar_total < 150
                         and ((as_timestamp(now()) - as_timestamp(states('input_datetime.zendure_last_full_charge_2'), default=0)) | int(0)) > 86400 }}
                sequence:
                  - action: input_boolean.turn_on
                    target: { entity_id: input_boolean.zendure_force_calib_u2 }
                  - action: input_boolean.turn_on
                    target: { entity_id: input_boolean.zendure_emergency_u2 }
                  - action: input_text.set_value
                    target: { entity_id: input_text.zendure_ac_mode_u2 }
                    data: { value: "Input mode" }
                  - action: script.zendure_dispatch_u2_ac_mode
                    data:
                      mode: "Input mode"
                      force: true
                  - action: script.zendure_set_u2_outputlimit_zero
                  - action: script.zendure_dispatch_u2_inputlimit
                    data:
                      power: "{{ limit_emerg_u2 }}"
                      force: true
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_last_sent_2 }
                    data: { value: 0 }
                  - action: notify.send_message
                    target:
                      entity_id: !secret telegram_id1
                    data:
                      message: >
                        📉 *Spannungseinbruch U2 (Nacht)*
                        Unterspannung bestätigt ({{ v_confirm | round(3) }} V, Δ {{ imb_confirm | round(3) }} V).
                        Notstrom Automatik übernimmt zur Sicherheit. Deep-Kalibrierung wurde für den Tag vorgemerkt.

  # --- 6.6c VOLTAGE GUARD LATCH MANAGER ---
  - alias: "Zendure: Voltage Guard Latch Manager"
    id: "zendure_voltage_guard_latch_manager"
    mode: queued
    initial_state: true
    triggers:
      - trigger: template
        id: "set_u1"
        value_template: >
          {% set vmin_s = states.sensor.solarflow_1_cell_min_vol %}
          {% set stat = states.sensor.solarflow_1_status_raw %}
          {% set hb_ok = stat is not none and stat.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set vmin_fresh = hb_ok and vmin_s is not none and is_number(vmin_s.state) and (vmin_s.state|float(0)) > 2.0 %}
          {% set out_pwr = states('sensor.solarflow_1_output_power')|float(0) %}
          {% set min_out = states('input_number.zendure_conf_vguard_set_min_output')|float(30) %}
          {% set soc = states('sensor.solarflow_1_battery_level')|float(100) %}
          {% set soc_guard = (states('input_number.zendure_conf_soc_off')|float(20)) + 8 %}
          {{ is_state('input_boolean.zendure_auto_mode','on')
             and is_state('input_boolean.zendure_vguard_u1','off')
             and is_state('input_boolean.zendure_emergency_u1','off')
             and is_state('input_boolean.zendure_calib_mode_u1','off')
             and is_state('input_boolean.zendure_calib_discharge_u1','off')
             and states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
             and soc <= soc_guard
             and vmin_fresh
             and vmin_s.state|float(99) <= 3.02
             and out_pwr > min_out }}
        for: "00:01:00"
      - trigger: template
        id: "set_u1_hard"
        value_template: >
          {% set vmin = states('sensor.solarflow_1_cell_min_vol')|float(99) %}
          {% set soc = states('sensor.solarflow_1_battery_level')|float(100) %}
          {% set soc_guard_hard = (states('input_number.zendure_conf_soc_off')|float(20)) + 4 %}
          {{ is_state('input_boolean.zendure_auto_mode','on')
             and is_state('input_boolean.zendure_vguard_u1','off')
             and is_state('input_boolean.zendure_emergency_u1','off')
             and is_state('input_boolean.zendure_calib_mode_u1','off')
             and is_state('input_boolean.zendure_calib_discharge_u1','off')
             and states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
             and soc <= soc_guard_hard
             and vmin > 2.0
             and vmin <= 2.95 }}
        for: "00:01:00"
      - trigger: template
        id: "clear_u1"
        value_template: >
          {% set soc_bypass = states('input_number.zendure_conf_soc_bypass') | float(25) %}
          {% set soc_off = states('input_number.zendure_conf_soc_off') | float(20) %}
          {% set soc_exit = [soc_bypass, soc_off + 3] | max %}
          {% set soc = states('sensor.solarflow_1_battery_level')|float(0) %}
          {% set vmin = states('sensor.solarflow_1_cell_min_vol')|float(0) %}
          {% set pv = states('sensor.solarflow_1_solar_input')|float(0) %}
          {{ is_state('input_boolean.zendure_vguard_u1','on')
             and soc >= soc_exit
             and (vmin > 3.20 or (pv > 20 and soc >= soc_exit)) }}
        for: "00:10:00"
      - trigger: template
        id: "set_u2"
        value_template: >
          {% set vmin_s = states.sensor.solarflow_2_cell_min_vol %}
          {% set stat = states.sensor.solarflow_2_status_raw %}
          {% set hb_ok = stat is not none and stat.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set vmin_fresh = hb_ok and vmin_s is not none and is_number(vmin_s.state) and (vmin_s.state|float(0)) > 2.0 %}
          {% set out_pwr = states('sensor.solarflow_2_output_power')|float(0) %}
          {% set min_out = states('input_number.zendure_conf_vguard_set_min_output')|float(30) %}
          {% set soc = states('sensor.solarflow_2_battery_level')|float(100) %}
          {% set soc_guard = (states('input_number.zendure_conf_soc_off')|float(20)) + 8 %}
          {{ is_state('input_boolean.zendure_auto_mode','on')
             and is_state('input_boolean.zendure_vguard_u2','off')
             and is_state('input_boolean.zendure_emergency_u2','off')
             and is_state('input_boolean.zendure_calib_mode_u2','off')
             and is_state('input_boolean.zendure_calib_discharge_u2','off')
             and states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
             and soc <= soc_guard
             and vmin_fresh
             and vmin_s.state|float(99) <= 3.02
             and out_pwr > min_out }}
        for: "00:01:00"
      - trigger: template
        id: "set_u2_hard"
        value_template: >
          {% set vmin = states('sensor.solarflow_2_cell_min_vol')|float(99) %}
          {% set soc = states('sensor.solarflow_2_battery_level')|float(100) %}
          {% set soc_guard_hard = (states('input_number.zendure_conf_soc_off')|float(20)) + 4 %}
          {{ is_state('input_boolean.zendure_auto_mode','on')
             and is_state('input_boolean.zendure_vguard_u2','off')
             and is_state('input_boolean.zendure_emergency_u2','off')
             and is_state('input_boolean.zendure_calib_mode_u2','off')
             and is_state('input_boolean.zendure_calib_discharge_u2','off')
             and states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
             and soc <= soc_guard_hard
             and vmin > 2.0
             and vmin <= 2.95 }}
        for: "00:01:00"
      - trigger: template
        id: "clear_u2"
        value_template: >
          {% set soc_bypass = states('input_number.zendure_conf_soc_bypass') | float(25) %}
          {% set soc_off = states('input_number.zendure_conf_soc_off') | float(20) %}
          {% set soc_exit = [soc_bypass, soc_off + 3] | max %}
          {% set soc = states('sensor.solarflow_2_battery_level')|float(0) %}
          {% set vmin = states('sensor.solarflow_2_cell_min_vol')|float(0) %}
          {% set pv = states('sensor.solarflow_2_solar_input')|float(0) %}
          {{ is_state('input_boolean.zendure_vguard_u2','on')
             and soc >= soc_exit
             and (vmin > 3.20 or (pv > 20 and soc >= soc_exit)) }}
        for: "00:10:00"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id in ['set_u1','set_u1_hard'] }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_vguard_u1 }
              - action: script.zendure_set_u1_outputlimit_zero
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_1 }
                data: { value: 0 }
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'clear_u1' }}"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_vguard_u1 }
          - conditions:
              - condition: template
                value_template: "{{ trigger.id in ['set_u2','set_u2_hard'] }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_vguard_u2 }
              - action: script.zendure_set_u2_outputlimit_zero
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_2 }
                data: { value: 0 }
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'clear_u2' }}"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_vguard_u2 }

  # --- 6.6d CALIBRATION MANAGER (Top-Balancing) ---
  - alias: "Zendure: Force Calibration on Suspicious SoC Drift"
    id: "zendure_force_calib_on_soc_drift"
    mode: single
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
        id: boot
      - trigger: time_pattern
        minutes: "/10"
        id: check

    actions:
      - variables:
          ts_now: "{{ as_timestamp(now()) | int(0) }}"

      # --- Initialisierung nach HA-Start ---
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'boot' }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_soc_drift_ref_u1 }
            data:
              value: "{{ states('sensor.solarflow_1_battery_level') | int(0) }}"
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_soc_drift_ref_ts_u1 }
            data:
              timestamp: "{{ ts_now }}"

          - action: input_number.set_value
            target: { entity_id: input_number.zendure_soc_drift_ref_u2 }
            data:
              value: "{{ states('sensor.solarflow_2_battery_level') | int(0) }}"
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_soc_drift_ref_ts_u2 }
            data:
              timestamp: "{{ ts_now }}"

      # --- Prüfen alle 10 Minuten ---
        else:
          - variables:
              soc1: "{{ states('sensor.solarflow_1_battery_level') | int(-1) }}"
              soc2: "{{ states('sensor.solarflow_2_battery_level') | int(-1) }}"

              ref_soc1: "{{ states('input_number.zendure_soc_drift_ref_u1') | int(-1) }}"
              ref_soc2: "{{ states('input_number.zendure_soc_drift_ref_u2') | int(-1) }}"

              age_min1: "{{ ((ts_now - (as_timestamp(states('input_datetime.zendure_soc_drift_ref_ts_u1'), default=0) | int(0))) / 60) | float(0) }}"
              age_min2: "{{ ((ts_now - (as_timestamp(states('input_datetime.zendure_soc_drift_ref_ts_u2'), default=0) | int(0))) / 60) | float(0) }}"

              drop1: >-
                {% set cur = states('sensor.solarflow_1_battery_level') | int(-1) %}
                {% set ref = states('input_number.zendure_soc_drift_ref_u1') | int(-1) %}
                {{ (ref - cur) if cur >= 0 and ref >= 0 else 0 }}

              drop2: >-
                {% set cur = states('sensor.solarflow_2_battery_level') | int(-1) %}
                {% set ref = states('input_number.zendure_soc_drift_ref_u2') | int(-1) %}
                {{ (ref - cur) if cur >= 0 and ref >= 0 else 0 }}

              suspicious_u1: >-
                {% set soc = states('sensor.solarflow_1_battery_level') | int(-1) %}
                {% set ref = states('input_number.zendure_soc_drift_ref_u1') | int(-1) %}
                {% set drop = (ref - soc) if soc >= 0 and ref >= 0 else 0 %}
                {% set ref_ts = as_timestamp(states('input_datetime.zendure_soc_drift_ref_ts_u1'), default=0) | int(0) %}
                {% set age_min = ((as_timestamp(now()) - ref_ts) / 60) | float(0) %}
                {% set vmin = states('sensor.solarflow_1_cell_min_vol') | float(99) %}
                {% set s = states.sensor.solarflow_1_status_raw %}
                {% set last_full = as_timestamp(states('input_datetime.zendure_last_full_charge_1'), default=0) %}
                {% set full_age_h = ((as_timestamp(now()) - last_full) / 3600) if last_full > 0 else 999 %}
                {% set fresh = s is not none and s.state | upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
                {% set quiet = states('sensor.solarflow_1_output_power') | float(0) < 50
                               and states('sensor.solarflow_1_output_limit') | float(0) < 50
                               and states('input_number.zendure_last_sent_1') | float(0) < 50
                               and states('sensor.solarflow_1_grid_input_power') | float(0) < 50
                               and not is_state('input_boolean.zendure_calib_mode_u1', 'on')
                               and not is_state('input_boolean.zendure_emergency_u1', 'on') %}
                {{ fresh
                   and age_min >= 10
                   and soc >= 0 and soc <= 35
                   and ref >= 0 and ref <= 35
                   and drop >= 8
                   and quiet
                   and (is_state('input_boolean.zendure_vguard_u1','on') or vmin < 3.15)
                   and full_age_h >= 48
                   and not is_state('input_boolean.zendure_force_calib_u1', 'on') }}

              suspicious_u2: >-
                {% set soc = states('sensor.solarflow_2_battery_level') | int(-1) %}
                {% set ref = states('input_number.zendure_soc_drift_ref_u2') | int(-1) %}
                {% set drop = (ref - soc) if soc >= 0 and ref >= 0 else 0 %}
                {% set ref_ts = as_timestamp(states('input_datetime.zendure_soc_drift_ref_ts_u2'), default=0) | int(0) %}
                {% set age_min = ((as_timestamp(now()) - ref_ts) / 60) | float(0) %}
                {% set vmin = states('sensor.solarflow_2_cell_min_vol') | float(99) %}
                {% set s = states.sensor.solarflow_2_status_raw %}
                {% set last_full = as_timestamp(states('input_datetime.zendure_last_full_charge_2'), default=0) %}
                {% set full_age_h = ((as_timestamp(now()) - last_full) / 3600) if last_full > 0 else 999 %}
                {% set fresh = s is not none and s.state | upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
                {% set quiet = states('sensor.solarflow_2_output_power') | float(0) < 50
                               and states('sensor.solarflow_2_output_limit') | float(0) < 50
                               and states('input_number.zendure_last_sent_2') | float(0) < 50
                               and states('sensor.solarflow_2_grid_input_power') | float(0) < 50
                               and not is_state('input_boolean.zendure_calib_mode_u2', 'on')
                               and not is_state('input_boolean.zendure_emergency_u2', 'on') %}
                {{ fresh
                   and age_min >= 10
                   and soc >= 0 and soc <= 35
                   and ref >= 0 and ref <= 35
                   and drop >= 8
                   and quiet
                   and (is_state('input_boolean.zendure_vguard_u2','on') or vmin < 3.15)
                   and full_age_h >= 48
                   and not is_state('input_boolean.zendure_force_calib_u2', 'on') }}

          # --- Unit 1 markieren ---
          - if:
              - condition: template
                value_template: "{{ suspicious_u1 }}"
            then:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_force_calib_u1 }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: >
                    🧭 *Calibration U1 queued (next low-PV window)*
                    Suspicious SoC drop detected without matching energy output
                    (ΔSoC {{ drop1 }}% in {{ age_min1 | round(0) }} min, vmin {{ states('sensor.solarflow_1_cell_min_vol') | float(0) | round(3) }} V).

          # --- Unit 2 markieren ---
          - if:
              - condition: template
                value_template: "{{ suspicious_u2 }}"
            then:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_force_calib_u2 }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: >
                    🧭 *Calibration U2 queued (next low-PV window)*
                    Suspicious SoC drop detected without matching energy output
                    (ΔSoC {{ drop2 }}% in {{ age_min2 | round(0) }} min, vmin {{ states('sensor.solarflow_2_cell_min_vol') | float(0) | round(3) }} V).

          # --- Referenzfenster immer neu setzen ---
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_soc_drift_ref_u1 }
            data:
              value: "{{ states('sensor.solarflow_1_battery_level') | int(0) }}"
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_soc_drift_ref_ts_u1 }
            data:
              timestamp: "{{ ts_now }}"

          - action: input_number.set_value
            target: { entity_id: input_number.zendure_soc_drift_ref_u2 }
            data:
              value: "{{ states('sensor.solarflow_2_battery_level') | int(0) }}"
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_soc_drift_ref_ts_u2 }
            data:
              timestamp: "{{ ts_now }}"

  - alias: "Zendure: Natural Full-Charge Tracker"
    id: "zendure_natural_full_charge_tracker"
    mode: queued
    initial_state: true
    triggers:
      - trigger: time_pattern
        minutes: "/1"
        id: "check"

      # --- U1: echte 100%-Full-Hold-Phase startet ---
      # Zweck: Der 14-Tage-Timer soll schon dann zurückgesetzt werden,
      # wenn die Unit im normalen Betrieb wirklich 100% fuer 30 min erreicht.
      # Die Zellspreizung wird hier bewusst NICHT mehr als Voraussetzung genutzt;
      # Top-Balancing mit Imbalance-Check passiert nur in der eigentlichen
      # Kalibrierung (calib_mode).
      - trigger: template
        id: "u1_full_hold_start"
        value_template: >
          {% set full_start = as_timestamp(states('input_datetime.zendure_natural_full_hold_start_u1'), default=0) %}
          {{ states('sensor.solarflow_1_battery_level')|float(0) > 99.5
             and is_state('input_boolean.zendure_emergency_u1','off')
             and is_state('input_boolean.zendure_calib_discharge_u1','off')
             and is_state('input_boolean.zendure_calib_mode_u1','off')
             and full_start < 946684800 }}

      # --- U2: echte 100%-Full-Hold-Phase startet ---
      - trigger: template
        id: "u2_full_hold_start"
        value_template: >
          {% set full_start = as_timestamp(states('input_datetime.zendure_natural_full_hold_start_u2'), default=0) %}
          {{ states('sensor.solarflow_2_battery_level')|float(0) > 99.5
             and is_state('input_boolean.zendure_emergency_u2','off')
             and is_state('input_boolean.zendure_calib_discharge_u2','off')
             and is_state('input_boolean.zendure_calib_mode_u2','off')
             and full_start < 946684800 }}

      # --- U1: Full-Hold zuruecksetzen, wenn 100% nicht mehr anliegt oder Spezialmodus aktiv wird ---
      - trigger: template
        id: "u1_reset"
        value_template: >
          {% set full_start = as_timestamp(states('input_datetime.zendure_natural_full_hold_start_u1'), default=0) %}
          {{ (
               states('sensor.solarflow_1_battery_level')|float(0) < 99.3
               or is_state('input_boolean.zendure_emergency_u1','on')
               or is_state('input_boolean.zendure_calib_discharge_u1','on')
               or is_state('input_boolean.zendure_calib_mode_u1','on')
             )
             and full_start > 946684800 }}

      # --- U2: Full-Hold zuruecksetzen, wenn 100% nicht mehr anliegt oder Spezialmodus aktiv wird ---
      - trigger: template
        id: "u2_reset"
        value_template: >
          {% set full_start = as_timestamp(states('input_datetime.zendure_natural_full_hold_start_u2'), default=0) %}
          {{ (
               states('sensor.solarflow_2_battery_level')|float(0) < 99.3
               or is_state('input_boolean.zendure_emergency_u2','on')
               or is_state('input_boolean.zendure_calib_discharge_u2','on')
               or is_state('input_boolean.zendure_calib_mode_u2','on')
             )
             and full_start > 946684800 }}

    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"

    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u1_full_hold_start' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_full_hold_start_u1 }
                data: { timestamp: "{{ as_timestamp(now()) | int }}" }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_balance_start_u1 }
                data: { timestamp: 0 }

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u2_full_hold_start' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_full_hold_start_u2 }
                data: { timestamp: "{{ as_timestamp(now()) | int }}" }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_balance_start_u2 }
                data: { timestamp: 0 }

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u1_reset' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_full_hold_start_u1 }
                data: { timestamp: 0 }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_balance_start_u1 }
                data: { timestamp: 0 }

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u2_reset' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_full_hold_start_u2 }
                data: { timestamp: 0 }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_balance_start_u2 }
                data: { timestamp: 0 }

      # --- U1: 100% mindestens 30 Minuten gehalten -> 14-Tage-Timer zuruecksetzen ---
      - if:
          - condition: template
            value_template: >
              {% set now_ts = as_timestamp(now()) %}
              {% set full_start = as_timestamp(states('input_datetime.zendure_natural_full_hold_start_u1'), default=0) %}
              {% set last_full = as_timestamp(states('input_datetime.zendure_last_full_charge_1'), default=0) %}
              {{ full_start > 946684800
                 and last_full < full_start
                 and (now_ts - full_start) >= 1800
                 and states('sensor.solarflow_1_battery_level')|float(0) > 99.5
                 and is_state('input_boolean.zendure_emergency_u1','off')
                 and is_state('input_boolean.zendure_calib_discharge_u1','off')
                 and is_state('input_boolean.zendure_calib_mode_u1','off') }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_1 }
            data: { timestamp: "{{ as_timestamp(now()) | int }}" }

      # --- U2: 100% mindestens 30 Minuten gehalten -> 14-Tage-Timer zuruecksetzen ---
      - if:
          - condition: template
            value_template: >
              {% set now_ts = as_timestamp(now()) %}
              {% set full_start = as_timestamp(states('input_datetime.zendure_natural_full_hold_start_u2'), default=0) %}
              {% set last_full = as_timestamp(states('input_datetime.zendure_last_full_charge_2'), default=0) %}
              {{ full_start > 946684800
                 and last_full < full_start
                 and (now_ts - full_start) >= 1800
                 and states('sensor.solarflow_2_battery_level')|float(0) > 99.5
                 and is_state('input_boolean.zendure_emergency_u2','off')
                 and is_state('input_boolean.zendure_calib_discharge_u2','off')
                 and is_state('input_boolean.zendure_calib_mode_u2','off') }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_2 }
            data: { timestamp: "{{ as_timestamp(now()) | int }}" }

  - alias: "Zendure: Top Hold Start Tracker"
    id: "zendure_top_hold_tracker"
    mode: queued
    initial_state: true
    triggers:
      - trigger: template
        id: u1
        value_template: "{{ is_state('input_boolean.zendure_calib_mode_u1','on') and states('sensor.solarflow_1_battery_level')|float(0) > 99.5 }}"
      - trigger: template
        id: u2
        value_template: "{{ is_state('input_boolean.zendure_calib_mode_u2','on') and states('sensor.solarflow_2_battery_level')|float(0) > 99.5 }}"
      - trigger: template
        id: u1_reset
        value_template: "{{ is_state('input_boolean.zendure_calib_mode_u1','off') or (is_state('input_boolean.zendure_calib_mode_u1','on') and states('sensor.solarflow_1_battery_level')|float(0) <= 98) }}"
      - trigger: template
        id: u2_reset
        value_template: "{{ is_state('input_boolean.zendure_calib_mode_u2','off') or (is_state('input_boolean.zendure_calib_mode_u2','on') and states('sensor.solarflow_2_battery_level')|float(0) <= 98) }}"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger.id == 'u1'
                     and as_timestamp(states('input_datetime.zendure_top_hold_start_u1'), default=0) < 946684800 }}
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
                data: { timestamp: "{{ as_timestamp(now()) | int }}" }
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger.id == 'u2'
                     and as_timestamp(states('input_datetime.zendure_top_hold_start_u2'), default=0) < 946684800 }}
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
                data: { timestamp: "{{ as_timestamp(now()) | int }}" }
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u1_reset' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
                data: { timestamp: 0 }
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u2_reset' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
                data: { timestamp: 0 }

  - alias: "Zendure: Smart Calibration Manager (Top + Deep)"
    id: "zendure_calibration_manager"
    mode: queued
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
        id: "startup"
      - trigger: time
        at: "12:30:00"
        id: "check_time"
      - trigger: time_pattern
        minutes: "/10"
        id: "phase1_retry"

      # Sofortiger Start bei Force Calib (z.B. durch Sag Confirm nachts oder tagsüber)
      - trigger: state
        entity_id: input_boolean.zendure_force_calib_u1
        to: "on"
        id: "force_start_1"
      - trigger: state
        entity_id: input_boolean.zendure_force_calib_u2
        to: "on"
        id: "force_start_2"
      - trigger: state
        entity_id: input_boolean.zendure_force_calib_u1
        to: "off"
        id: "force_stop_1"
      - trigger: state
        entity_id: input_boolean.zendure_force_calib_u2
        to: "off"
        id: "force_stop_2"
      - trigger: template
        id: "pv_ready_u1"
        value_template: >
          {{ is_state('input_boolean.zendure_force_calib_u1', 'on')
             and is_state('input_boolean.zendure_calib_mode_u1', 'off')
             and is_state('input_boolean.zendure_calib_discharge_u1', 'off')
             and states('sensor.solarflow_1_solar_input') | float(999) <= 10 }}
        for: "00:15:00"
      - trigger: template
        id: "pv_ready_u2"
        value_template: >
          {{ is_state('input_boolean.zendure_force_calib_u2', 'on')
             and is_state('input_boolean.zendure_calib_mode_u2', 'off')
             and is_state('input_boolean.zendure_calib_discharge_u2', 'off')
             and states('sensor.solarflow_2_solar_input') | float(999) <= 10 }}
        for: "00:15:00"

      - trigger: template
        id: "pv_resume_u1"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u1', 'on')
             and states('sensor.solarflow_1_solar_input') | float(0) >= (states('input_number.zendure_conf_calib_pv_high') | float(70)) }}
        for: "00:05:00"
      - trigger: template
        id: "pv_resume_u2"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u2', 'on')
             and states('sensor.solarflow_2_solar_input') | float(0) >= (states('input_number.zendure_conf_calib_pv_high') | float(70)) }}
        for: "00:05:00"

      # Template-Trigger: Greift auch, wenn die Batterie schon VOR dem Start leer war!
      - trigger: template
        id: "bottom_u1"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u1', 'on')
             and states('sensor.solarflow_1_cell_min_vol')|float(99) <= 3.05
             and states('sensor.solarflow_1_battery_level')|float(100) <= 10 }}
        for: "00:01:00"
      - trigger: template
        id: "empty_soc_u1"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u1', 'on')
             and states('sensor.solarflow_1_battery_level')|float(100) <= 5.0 }}
        for: "00:02:00"
      - trigger: template
        id: "bottom_u2"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u2', 'on')
             and states('sensor.solarflow_2_cell_min_vol')|float(99) <= 3.05
             and states('sensor.solarflow_2_battery_level')|float(100) <= 10 }}
        for: "00:01:00"
      - trigger: template
        id: "hard_bottom_u1"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u1', 'on')
             and states('sensor.solarflow_1_cell_min_vol')|float(99) <= 3.00 }}
        for: "00:00:30"
      - trigger: template
        id: "hard_bottom_u2"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u2', 'on')
             and states('sensor.solarflow_2_cell_min_vol')|float(99) <= 3.00 }}
        for: "00:00:30"
      - trigger: template
        id: "empty_soc_u2"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u2', 'on')
             and states('sensor.solarflow_2_battery_level')|float(100) <= 5.0 }}
        for: "00:02:00"

      # Abschluss Phase 2 (Top-Balancing erreicht)
      - trigger: template
        id: "top_balance_ok_u1"
        value_template: >
          {% set hold = states('sensor.solarflow_1_battery_level')|float(0) >= 99 %}
          {% set hold_start = as_timestamp(states('input_datetime.zendure_top_hold_start_u1'), default=0) %}
          {{ is_state('input_boolean.zendure_calib_mode_u1','on')
             and hold
             and hold_start > 946684800
             and (as_timestamp(now()) - hold_start) >= 1800
             and ((states('sensor.solarflow_1_cell_max_vol')|float(99)-states('sensor.solarflow_1_cell_min_vol')|float(0)) | round(3)) <= 0.050 }}
        for: "00:10:00"
      - trigger: template
        id: "top_balance_ok_u2"
        value_template: >
          {% set hold = states('sensor.solarflow_2_battery_level')|float(0) >= 99 %}
          {% set hold_start = as_timestamp(states('input_datetime.zendure_top_hold_start_u2'), default=0) %}
          {{ is_state('input_boolean.zendure_calib_mode_u2','on')
             and hold
             and hold_start > 946684800
             and (as_timestamp(now()) - hold_start) >= 1800
             and ((states('sensor.solarflow_2_cell_max_vol')|float(99)-states('sensor.solarflow_2_cell_min_vol')|float(0)) | round(3)) <= 0.050 }}
        for: "00:10:00"
      - trigger: template
        id: "top_balance_timeout_u1"
        value_template: >
          {% set hold_start = as_timestamp(states('input_datetime.zendure_top_hold_start_u1'), default=0) %}
          {{ is_state('input_boolean.zendure_calib_mode_u1','on')
             and hold_start > 946684800
             and states('sensor.solarflow_1_battery_level')|float(0) >= 99
             and (as_timestamp(now()) - hold_start) >= 7200 }}
      - trigger: template
        id: "top_balance_timeout_u2"
        value_template: >
          {% set hold_start = as_timestamp(states('input_datetime.zendure_top_hold_start_u2'), default=0) %}
          {{ is_state('input_boolean.zendure_calib_mode_u2','on')
             and hold_start > 946684800
             and states('sensor.solarflow_2_battery_level')|float(0) >= 99
             and (as_timestamp(now()) - hold_start) >= 7200 }}
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      - variables:
          days_cfg: "{{ states('input_number.zendure_conf_calib_days') | int(14) }}"
          days_u1: >
            {% set ts = as_timestamp(states('input_datetime.zendure_last_full_charge_1'), 0) %}
            {{ 0 if ts == 0 else ((as_timestamp(now()) - ts) / 86400) | round(1) }}
          days_u2: >
            {% set ts = as_timestamp(states('input_datetime.zendure_last_full_charge_2'), 0) %}
            {{ 0 if ts == 0 else ((as_timestamp(now()) - ts) / 86400) | round(1) }}
          force_u1: "{{ is_state('input_boolean.zendure_force_calib_u1', 'on') }}"
          force_u2: "{{ is_state('input_boolean.zendure_force_calib_u2', 'on') }}"
          s1_pv: "{{ states('sensor.solarflow_1_solar_input') | float(0) }}"
          s2_pv: "{{ states('sensor.solarflow_2_solar_input') | float(0) }}"
          pv_discharge_max: 20
          vmin1: "{{ states('sensor.solarflow_1_cell_min_vol') | float(99) }}"
          vmin2: "{{ states('sensor.solarflow_2_cell_min_vol') | float(99) }}"
          phase1_window: "{{ now().hour >= 20 or now().hour < 10 }}"

      # --- STARTUP PANIC: Falls HA waehrend Deep-Calib mit vmin <=2.95V startet, sofort Notladung ---
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'startup'
                 and is_state('input_boolean.zendure_calib_discharge_u1', 'on')
                 and vmin1|float(99) <= 2.95 }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_discharge_u1
                - input_boolean.zendure_calib_mode_u1
                - input_boolean.zendure_vguard_u1
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_emergency_u1 }
          - variables:
              charge_temp_cap_u1: "{{ states('sensor.solarflow_1_charge_temperature_cap') | int(0) }}"
              soc1_panic: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
              ss1_panic: "{{ 300 if soc1_panic < 12 else 800 }}"
              limit_panic_u1: "{{ [300, charge_temp_cap_u1 | int(0), ss1_panic | int] | min }}"
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_ac_mode_u1 }
            data: { value: "Input mode" }
          - action: script.zendure_dispatch_u1_ac_mode
            data:
              mode: "Input mode"
              force: true
          - action: script.zendure_set_u1_outputlimit_zero
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: "{{ limit_panic_u1 }}"
              force: true
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_1 }
            data: { value: 0 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🚨 *Startup-Panic U1*\nvmin <=2.95V waehrend Deep-Calib erkannt. Deep-Calib abgebrochen, Notladung gestartet."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'startup'
                 and is_state('input_boolean.zendure_calib_discharge_u2', 'on')
                 and vmin2|float(99) <= 2.95 }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_discharge_u2
                - input_boolean.zendure_calib_mode_u2
                - input_boolean.zendure_vguard_u2
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_emergency_u2 }
          - variables:
              charge_temp_cap_u2: "{{ states('sensor.solarflow_2_charge_temperature_cap') | int(0) }}"
              soc2_panic: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
              ss2_panic: "{{ 300 if soc2_panic < 12 else 800 }}"
              limit_panic_u2: "{{ [300, charge_temp_cap_u2 | int(0), ss2_panic | int] | min }}"
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_ac_mode_u2 }
            data: { value: "Input mode" }
          - action: script.zendure_dispatch_u2_ac_mode
            data:
              mode: "Input mode"
              force: true
          - action: script.zendure_set_u2_outputlimit_zero
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: "{{ limit_panic_u2 }}"
              force: true
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_2 }
            data: { value: 0 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🚨 *Startup-Panic U2*\nvmin <=2.95V waehrend Deep-Calib erkannt. Deep-Calib abgebrochen, Notladung gestartet."

      # --- STARTUP BOTTOM RECOVERY: Falls HA am Bottom neu startet, direkt in Phase 2 wechseln ---
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'startup'
                 and is_state('input_boolean.zendure_calib_discharge_u1', 'on')
                 and vmin1|float(99) > 2.95
                 and ((vmin1|float(99) <= 3.05 and states('sensor.solarflow_1_battery_level')|float(100) <= 10)
                      or vmin1|float(99) <= 3.00
                      or states('sensor.solarflow_1_battery_level')|float(100) <= 5) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u1 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u1 }
          - action: script.zendure_set_u1_outputlimit_zero
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🔄 *Deep-Kalibrierung U1 (Phase 2)*\nHA-Neustart am Bottom erkannt. Ladephase wurde sicher gestartet."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'startup'
                 and is_state('input_boolean.zendure_calib_discharge_u2', 'on')
                 and vmin2|float(99) > 2.95
                 and ((vmin2|float(99) <= 3.05 and states('sensor.solarflow_2_battery_level')|float(100) <= 10)
                      or vmin2|float(99) <= 3.00
                      or states('sensor.solarflow_2_battery_level')|float(100) <= 5) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u2 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u2 }
          - action: script.zendure_set_u2_outputlimit_zero
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🔄 *Deep-Kalibrierung U2 (Phase 2)*\nHA-Neustart am Bottom erkannt. Ladephase wurde sicher gestartet."

      - if:
          - condition: template
            value_template: "{{ trigger.id == 'check_time' and days_u1 >= days_cfg and is_state('input_boolean.zendure_calib_mode_u1', 'off') and is_state('input_boolean.zendure_emergency_u1','off') and is_state('input_boolean.zendure_vguard_u1','off') and is_state('input_boolean.zendure_force_calib_u1','off') and is_state('input_boolean.zendure_calib_discharge_u1','off') }}"
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u1 }
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u1 }
          - action: script.zendure_set_u1_outputlimit_zero

      - if:
          - condition: template
            value_template: "{{ trigger.id == 'check_time' and days_u2 >= days_cfg and is_state('input_boolean.zendure_calib_mode_u2', 'off') and is_state('input_boolean.zendure_emergency_u2','off') and is_state('input_boolean.zendure_vguard_u2','off') and is_state('input_boolean.zendure_force_calib_u2','off') and is_state('input_boolean.zendure_calib_discharge_u2','off') }}"
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u2 }
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u2 }
          - action: script.zendure_set_u2_outputlimit_zero

      # --- STARTUP-DAY GUARD: Bei HA-Neustart tagsüber keine Entladephase laufen lassen ---
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'startup'
                 and not (phase1_window | bool)
                 and (is_state('input_boolean.zendure_calib_discharge_u1', 'on')
                      or is_state('input_boolean.zendure_calib_discharge_u2', 'on')) }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_discharge_u1
                - input_boolean.zendure_calib_discharge_u2
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🌙 *Deep-Kalibrierung Phase 1 verschoben*\nHome Assistant wurde tagsüber neu gestartet. Eine laufende Entladephase wurde sicher beendet und wird im nächsten Nacht-/Low-PV-Fenster automatisch fortgesetzt."

      # --- START PHASE 1: ENTLADEN ---
      - if:
          - condition: template
            value_template: >
              {{ (trigger.id in ['force_start_1','pv_ready_u1','phase1_retry'] and force_u1)
                 or (trigger.id == 'startup' and force_u1) }}
          - condition: template
            value_template: "{{ phase1_window | bool }}"
          - condition: template
            value_template: "{{ s1_pv <= pv_discharge_max }}"
          - condition: state
            entity_id: input_boolean.zendure_calib_mode_u1
            state: "off"
          - condition: state
            entity_id: input_boolean.zendure_calib_discharge_u1
            state: "off"
          - condition: state
            entity_id: input_boolean.zendure_emergency_u1
            state: "off"
          - condition: state
            entity_id: input_boolean.zendure_vguard_u1
            state: "off"
          - condition: template
            value_template: >
              {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control')|float(999)) %}
              {{ t > 10 and not is_state('sensor.solarflow_1_heizung','Aktiv') }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_discharge_u1 }
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_mode_u1 }
          - action: script.zendure_dispatch_u1_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_dispatch_u1_chargelimit
            data:
              power: "0"
              force: true
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: 0
              force: true
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "📅 *Deep-Kalibrierung U1 (Phase 1)*\nEntlade-Phase gestartet. Akku wird bis Bottom-Kriterium (vmin<=3.05V & SoC<=10%) entladen."

      - if:
          - condition: template
            value_template: >
              {{ (trigger.id in ['force_start_2','pv_ready_u2','phase1_retry'] and force_u2)
                 or (trigger.id == 'startup' and force_u2) }}
          - condition: template
            value_template: "{{ phase1_window | bool }}"
          - condition: template
            value_template: "{{ s2_pv <= pv_discharge_max }}"
          - condition: state
            entity_id: input_boolean.zendure_calib_mode_u2
            state: "off"
          - condition: state
            entity_id: input_boolean.zendure_calib_discharge_u2
            state: "off"
          - condition: state
            entity_id: input_boolean.zendure_emergency_u2
            state: "off"
          - condition: state
            entity_id: input_boolean.zendure_vguard_u2
            state: "off"
          - condition: template
            value_template: >
              {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control')|float(999)) %}
              {{ t > 10 and not is_state('sensor.solarflow_2_heizung','Aktiv') }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_discharge_u2 }
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_mode_u2 }
          - action: script.zendure_dispatch_u2_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_dispatch_u2_chargelimit
            data:
              power: "0"
              force: true
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: 0
              force: true
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "📅 *Deep-Kalibrierung U2 (Phase 1)*\nEntlade-Phase gestartet. Akku wird bis Bottom-Kriterium (vmin<=3.05V & SoC<=10%) entladen."

      # --- ÜBERGANG ZU PHASE 2: LADEN ---
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'pv_resume_u1'
                 and is_state('input_boolean.zendure_calib_discharge_u1', 'on')
                 and vmin1 > 2.86 }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u1 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🌤️ *Deep-Kalibrierung U1 pausiert (PV erkannt)*\nEntladung nicht vollständig (vmin {{ vmin1|round(3) }}V). Unit läuft normal und versucht die Entladung im nächsten Low-PV-Fenster erneut."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'pv_resume_u2'
                 and is_state('input_boolean.zendure_calib_discharge_u2', 'on')
                 and vmin2 > 2.86 }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u2 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🌤️ *Deep-Kalibrierung U2 pausiert (PV erkannt)*\nEntladung nicht vollständig (vmin {{ vmin2|round(3) }}V). Unit läuft normal und versucht die Entladung im nächsten Low-PV-Fenster erneut."

      - if:
          - condition: template
            value_template: "{{ trigger.id == 'empty_soc_u1' and is_state('input_boolean.zendure_calib_discharge_u1','on') }}"
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u1 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u1 }
          - action: script.zendure_set_u1_outputlimit_zero
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "⚠️ *Deep-Calib U1 Schutzabbruch*\nSoC <=5% erreicht, Ladephase gestartet (Bottom-Spannung nicht sauber bestätigt)."

      - if:
          - condition: template
            value_template: "{{ trigger.id == 'empty_soc_u2' and is_state('input_boolean.zendure_calib_discharge_u2','on') }}"
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u2 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u2 }
          - action: script.zendure_set_u2_outputlimit_zero
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "⚠️ *Deep-Calib U2 Schutzabbruch*\nSoC <=5% erreicht, Ladephase gestartet (Bottom-Spannung nicht sauber bestätigt)."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id in ['bottom_u1','hard_bottom_u1'] and is_state('input_boolean.zendure_calib_discharge_u1', 'on') }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u1 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u1 }
          - action: script.zendure_set_u1_outputlimit_zero
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🔄 *Deep-Kalibrierung U1 (Phase 2)*\nNullpunkt erreicht! Wartet auf Sonne für Voll-Ladung."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id in ['bottom_u2','hard_bottom_u2'] and is_state('input_boolean.zendure_calib_discharge_u2', 'on') }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u2 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u2 }
          - action: script.zendure_set_u2_outputlimit_zero
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🔄 *Deep-Kalibrierung U2 (Phase 2)*\nNullpunkt erreicht! Wartet auf Sonne für Voll-Ladung."

      # --- ABSCHLUSS (100% ERREICHT) ---
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'force_start_1' and s1_pv > pv_discharge_max }}"
        then:
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "⏳ *Deep-Kalibrierung U1 wartet auf niedrige PV-Leistung*\nPV aktuell: {{ s1_pv|round(0) }}W. Entladephase startet automatisch bei <= {{ pv_discharge_max }}W."

      - if:
          - condition: template
            value_template: "{{ trigger.id == 'force_start_2' and s2_pv > pv_discharge_max }}"
        then:
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "⏳ *Deep-Kalibrierung U2 wartet auf niedrige PV-Leistung*\nPV aktuell: {{ s2_pv|round(0) }}W. Entladephase startet automatisch bei <= {{ pv_discharge_max }}W."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'force_start_1'
                 and is_state('input_boolean.zendure_calib_discharge_u1', 'off') }}
          - condition: template
            value_template: >
              {{ (not (phase1_window | bool))
                 or s1_pv > pv_discharge_max
                 or is_state('input_boolean.zendure_emergency_u1','on')
                 or is_state('input_boolean.zendure_calib_mode_u1','on') }}
        then:
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: >
                ⚠️ *Deep-Kalibrierung U1 nicht gestartet*
                Grund: {% if not (phase1_window | bool) %}außerhalb Phase-1-Zeitfenster (20:00–09:59){% elif s1_pv > pv_discharge_max %}PV zu hoch ({{ s1_pv|round(0) }}W > {{ pv_discharge_max }}W){% elif is_state('input_boolean.zendure_emergency_u1','on') %}Notladung aktiv{% elif is_state('input_boolean.zendure_calib_mode_u1','on') %}bereits in Phase 2 (Calib-Mode){% else %}unbekannt{% endif %}.
                Entladephase startet automatisch, sobald die Bedingungen erfüllt sind.

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'force_start_2'
                 and is_state('input_boolean.zendure_calib_discharge_u2', 'off') }}
          - condition: template
            value_template: >
              {{ (not (phase1_window | bool))
                 or s2_pv > pv_discharge_max
                 or is_state('input_boolean.zendure_emergency_u2','on')
                 or is_state('input_boolean.zendure_calib_mode_u2','on') }}
        then:
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: >
                ⚠️ *Deep-Kalibrierung U2 nicht gestartet*
                Grund: {% if not (phase1_window | bool) %}außerhalb Phase-1-Zeitfenster (20:00–09:59){% elif s2_pv > pv_discharge_max %}PV zu hoch ({{ s2_pv|round(0) }}W > {{ pv_discharge_max }}W){% elif is_state('input_boolean.zendure_emergency_u2','on') %}Notladung aktiv{% elif is_state('input_boolean.zendure_calib_mode_u2','on') %}bereits in Phase 2 (Calib-Mode){% else %}unbekannt{% endif %}.
                Entladephase startet automatisch, sobald die Bedingungen erfüllt sind.

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'force_stop_1'
                 and (is_state('input_boolean.zendure_calib_discharge_u1','on')
                      or is_state('input_boolean.zendure_calib_mode_u1','on')) }}
        then:
          # Erst Ladepfad sauber schließen, solange Calib-Flags noch aktiv sind.
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u1_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u1_outputlimit_zero

          # Danach internen Kalibrierzustand beenden.
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_discharge_u1
                - input_boolean.zendure_calib_mode_u1
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🛑 *Kalibrierung U1 abgebrochen* (Force-Calib wurde manuell deaktiviert)."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'force_stop_2'
                 and (is_state('input_boolean.zendure_calib_discharge_u2','on')
                      or is_state('input_boolean.zendure_calib_mode_u2','on')) }}
        then:
          # Erst Ladepfad sauber schließen, solange Calib-Flags noch aktiv sind.
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u2_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u2_outputlimit_zero

          # Danach internen Kalibrierzustand beenden.
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_discharge_u2
                - input_boolean.zendure_calib_mode_u2
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🛑 *Kalibrierung U2 abgebrochen* (Force-Calib wurde manuell deaktiviert)."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id in ['top_balance_ok_u1','top_balance_timeout_u1']
                 and is_state('input_boolean.zendure_calib_mode_u1','on') }}
        then:
          # Full-Charge-Zeitpunkt setzen.
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_1 }
            data: { timestamp: "{{ as_timestamp(now()) | int }}" }

          # Ladepfad sauber schließen, bevor Calib-Flags fallen.
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u1_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u1_outputlimit_zero

          # Kalibrierzustand beenden.
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_mode_u1
                - input_boolean.zendure_calib_discharge_u1
                - input_boolean.zendure_force_calib_u1
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: >
                {% if trigger.id == 'top_balance_timeout_u1' %}
                  ⚠️ *Top-Balance U1 beendet*\nMaximale Haltezeit (120 min ab erstem echten 100%-Punkt) erreicht – Top-Balance nicht perfekt.
                {% else %}
                  ✅ *Top-Balance U1 abgeschlossen*\nMindesthaltezeit erfüllt und Zellspreizung im Zielbereich.
                {% endif %}

      - if:
          - condition: template
            value_template: >
              {{ trigger.id in ['top_balance_ok_u2','top_balance_timeout_u2']
                 and is_state('input_boolean.zendure_calib_mode_u2','on') }}
        then:
          # Full-Charge-Zeitpunkt setzen.
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_2 }
            data: { timestamp: "{{ as_timestamp(now()) | int }}" }

          # Ladepfad sauber schließen, bevor Calib-Flags fallen.
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u2_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u2_outputlimit_zero

          # Kalibrierzustand beenden.
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_mode_u2
                - input_boolean.zendure_calib_discharge_u2
                - input_boolean.zendure_force_calib_u2
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: >
                {% if trigger.id == 'top_balance_timeout_u2' %}
                  ⚠️ *Top-Balance U2 beendet*\nMaximale Haltezeit (120 min ab erstem echten 100%-Punkt) erreicht – Top-Balance nicht perfekt.
                {% else %}
                  ✅ *Top-Balance U2 abgeschlossen*\nMindesthaltezeit erfüllt und Zellspreizung im Zielbereich.
                {% endif %}


  - alias: "Zendure: Overheat Degrading Notify"
    id: "zendure_overheat_degrading_notify"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.solarflow_1_battery_temp_control
        above: 48
        for: "00:02:00"
        id: u1
      - trigger: numeric_state
        entity_id: sensor.solarflow_2_battery_temp_control
        above: 48
        for: "00:02:00"
        id: u2
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'u1' }}"
            sequence:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: "⚠️ *Zendure U1 Degrading aktiv*\nTemperatur >48°C: Leistungs-Degrading hat begonnen."
          - conditions: "{{ trigger.id == 'u2' }}"
            sequence:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: "⚠️ *Zendure U2 Degrading aktiv*\nTemperatur >48°C: Leistungs-Degrading hat begonnen."

  # --- 6.7 HEALTH REPORTER ---
  - alias: "Zendure: Weekly Health Report"
    id: "zendure_weekly_report"
    triggers:
      - trigger: time
        at: "18:00:00"
    conditions:
      - condition: time
        weekday: [fri]
      - condition: template
        value_template: "{{ is_state('input_boolean.zendure_emergency_u1','off') and is_state('input_boolean.zendure_emergency_u2','off') and is_state('input_boolean.zendure_vguard_u1','off') and is_state('input_boolean.zendure_vguard_u2','off') and is_state('input_boolean.zendure_force_calib_u1','off') and is_state('input_boolean.zendure_force_calib_u2','off') and is_state('input_boolean.zendure_calib_discharge_u1','off') and is_state('input_boolean.zendure_calib_discharge_u2','off') and is_state('input_boolean.zendure_calib_mode_u1','off') and is_state('input_boolean.zendure_calib_mode_u2','off') }}"
    actions:
      - variables:
          last_u1: "{{ as_timestamp(states('input_datetime.zendure_last_full_charge_1'), default=0) }}"
          last_u2: "{{ as_timestamp(states('input_datetime.zendure_last_full_charge_2'), default=0) }}"
          days_u1: >
            {% set ts = as_timestamp(states('input_datetime.zendure_last_full_charge_1'), 0) %}
            {{ 0 if ts == 0 else ((as_timestamp(now()) - ts) / 86400) | int(0) }}
          days_u2: >
            {% set ts = as_timestamp(states('input_datetime.zendure_last_full_charge_2'), 0) %}
            {{ 0 if ts == 0 else ((as_timestamp(now()) - ts) / 86400) | int(0) }}
          imb1_raw: "{{ states('sensor.solarflow_1_cell_imbalance') }}"
          imb2_raw: "{{ states('sensor.solarflow_2_cell_imbalance') }}"
      - action: notify.send_message
        target:
          entity_id: !secret telegram_id1
        data:
          message: |
            ℹ️ *Zendure Wochenbericht*
            Unit 1: {{ days_u1 }} Tage ({{ imb1_raw }} V)
            Unit 2: {{ days_u2 }} Tage ({{ imb2_raw }} V)

  # --- 6.8a CALIBRATION AC FALLBACK MANAGER ---
  - alias: "Zendure: Calibration AC Fallback Manager"
    id: "zendure_calibration_ac_fallback_manager"
    mode: queued
    initial_state: true
    max: 2
    max_exceeded: warning
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - input_boolean.zendure_calib_mode_u1
          - input_boolean.zendure_calib_mode_u2
          - input_boolean.zendure_calib_discharge_u1
          - input_boolean.zendure_calib_discharge_u2
          - sensor.solarflow_1_solar_input
          - sensor.solarflow_2_solar_input
          - sensor.zendure_u1_pv_mean_20s
          - sensor.zendure_u2_pv_mean_20s
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      - variables:
          pv_low: "{{ states('input_number.zendure_conf_calib_pv_low') | float(40) }}"
          pv_high_raw: "{{ states('input_number.zendure_conf_calib_pv_high') | float(70) }}"
          pv_high: "{{ [pv_high_raw, (pv_low | float(40)) + 10] | max }}"

          # AC-Netzladung ist NUR zwischen 12:00 und 19:59 Uhr erlaubt.
          # Den ganzen Morgen über muss das System geduldig auf die Sonne warten.
          allow_ac: "{{ now().hour >= 12 and now().hour < 20 }}"

          online1: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
          online2: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
          calib1: "{{ is_state('input_boolean.zendure_calib_mode_u1', 'on') }}"
          calib2: "{{ is_state('input_boolean.zendure_calib_mode_u2', 'on') }}"
          dis1: "{{ is_state('input_boolean.zendure_calib_discharge_u1', 'on') }}"
          dis2: "{{ is_state('input_boolean.zendure_calib_discharge_u2', 'on') }}"

          soc1: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
          soc2: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
          s1_solar: "{{ states('sensor.solarflow_1_solar_input') | float(0) if online1 else 0 }}"
          s2_solar: "{{ states('sensor.solarflow_2_solar_input') | float(0) if online2 else 0 }}"
          s1_solar_mean: "{{ states('sensor.zendure_u1_pv_mean_20s') | float(s1_solar | float(0)) if online1 else 0 }}"
          s2_solar_mean: "{{ states('sensor.zendure_u2_pv_mean_20s') | float(s2_solar | float(0)) if online2 else 0 }}"
          s1_pv_low_stable: >
            {{ (s1_solar | float(0)) <= (pv_low | float(40))
               and (s1_solar_mean | float(0)) <= (pv_low | float(40)) }}
          s2_pv_low_stable: >
            {{ (s2_solar | float(0)) <= (pv_low | float(40))
               and (s2_solar_mean | float(0)) <= (pv_low | float(40)) }}
          s1_pv_high_stable: >
            {{ (s1_solar | float(0)) >= (pv_high | float(70))
               and (s1_solar_mean | float(0)) >= (pv_high | float(70)) }}
          s2_pv_high_stable: >
            {{ (s2_solar | float(0)) >= (pv_high | float(70))
               and (s2_solar_mean | float(0)) >= (pv_high | float(70)) }}

          temp_charge_cap_calib_u1: "{{ states('sensor.solarflow_1_charge_temperature_cap') | int(0) }}"
          temp_charge_cap_calib_u2: "{{ states('sensor.solarflow_2_charge_temperature_cap') | int(0) }}"
          sl1: "{{ 100 if soc1 > 97 else (200 if soc1 >= 90 else 800) }}"
          sl2: "{{ 100 if soc2 > 97 else (200 if soc2 >= 90 else 800) }}"
          soc_soft_u1: "{{ 100 if soc1 < 8 else (300 if soc1 < 12 else 800) }}"
          soc_soft_u2: "{{ 100 if soc2 < 8 else (300 if soc2 < 12 else 800) }}"
          temp_charge_block_u1: "{{ (temp_charge_cap_calib_u1 | int(0)) <= 0 }}"
          temp_charge_block_u2: "{{ (temp_charge_cap_calib_u2 | int(0)) <= 0 }}"
          limit_calib_u1: "{{ [sl1 | int, soc_soft_u1 | int, temp_charge_cap_calib_u1 | int(0)] | min }}"
          limit_calib_u2: "{{ [sl2 | int, soc_soft_u2 | int, temp_charge_cap_calib_u2 | int(0)] | min }}"
          curr_limit_u1: >
            {% set real = states('sensor.solarflow_1_input_limit') %}
            {% if is_number(real) %}
              {{ real | int(0) }}
            {% else %}
              {{ states('input_number.zendure_last_inputlimit_u1') | int(-1) }}
            {% endif %}
          curr_limit_u2: >
            {% set real = states('sensor.solarflow_2_input_limit') %}
            {% if is_number(real) %}
              {{ real | int(0) }}
            {% else %}
              {{ states('input_number.zendure_last_inputlimit_u2') | int(-1) }}
            {% endif %}
          curr_charge_u1: >
            {% set real = states('sensor.solarflow_1_setting_chargelimit') %}
            {{ real | int(states('input_number.zendure_last_chargelimit_u1') | int(-1)) if is_number(real) else states('input_number.zendure_last_chargelimit_u1') | int(-1) }}
          curr_charge_u2: >
            {% set real = states('sensor.solarflow_2_setting_chargelimit') %}
            {{ real | int(states('input_number.zendure_last_chargelimit_u2') | int(-1)) if is_number(real) else states('input_number.zendure_last_chargelimit_u2') | int(-1) }}

      - condition: template
        value_template: "{{ calib1 or calib2 or dis1 or dis2 }}"
      - parallel:
          # --- UNIT 1 STEUERUNG ---
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ (calib1 or dis1) and online1
                         and (temp_charge_block_u1 | bool)
                         and (
                           states('input_text.zendure_ac_mode_u1') != 'Output mode'
                           or curr_limit_u1|int(-1) != 0
                           or states('sensor.solarflow_1_output_limit')|int(-1) != 0
                           or states('input_number.zendure_last_sent_1')|int(-1) != 0
                         ) }}
                sequence:
                  - action: script.zendure_dispatch_u1_inputlimit
                    data:
                      power: 0
                      force: true
                  - action: script.zendure_dispatch_u1_chargelimit
                    data:
                      power: "0"
                      force: true
                  - action: script.zendure_dispatch_u1_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_set_u1_outputlimit_zero
              - conditions:
                  - condition: template
                    value_template: >
                      {{ dis1 and online1 and is_state('input_boolean.zendure_emergency_u1','off') and is_state('input_boolean.zendure_vguard_u1','off') and (
                           states('input_text.zendure_ac_mode_u1') != 'Output mode'
                           or curr_limit_u1|int(-1) != 0
                      ) }}
                sequence:
                  - action: script.zendure_dispatch_u1_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_dispatch_u1_chargelimit
                    data:
                      power: "0"
                      force: true
                  - action: script.zendure_dispatch_u1_inputlimit
                    data:
                      power: 0
                      force: true
              - conditions:
                  - condition: template
                    value_template: >
                      {{ calib1 and not dis1 and online1
                         and is_state('input_boolean.zendure_emergency_u1','off')
                         and is_state('input_boolean.zendure_vguard_u1','off')
                         and not (allow_ac | bool)
                         and (states('input_text.zendure_ac_mode_u1') == 'Input mode'
                              or curr_limit_u1|int(-1) != 0) }}
                sequence:
                  - action: script.zendure_dispatch_u1_inputlimit
                    data:
                      power: 0
                      force: true
                  - action: script.zendure_dispatch_u1_chargelimit
                    data:
                      power: "{{ limit_calib_u1|int }}"
                      force: true
                  - action: script.zendure_dispatch_u1_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_set_u1_outputlimit_zero
              - conditions:
                  - condition: template
                    value_template: >
                      {{ calib1 and not dis1 and online1 and is_state('input_boolean.zendure_emergency_u1','off') and is_state('input_boolean.zendure_vguard_u1','off') and (s1_pv_low_stable | bool)
                         and not (temp_charge_block_u1 | bool)
                         and (limit_calib_u1 | int(0)) > 0
                         and (allow_ac | bool)
                         and (states('input_text.zendure_ac_mode_u1') != 'Input mode'
                              or curr_limit_u1|int(-1) != (limit_calib_u1|int)
                              or curr_charge_u1|int(-1) != (limit_calib_u1|int)) }}
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ states('input_text.zendure_ac_mode_u1') != 'Input mode' }}"
                    then:
                      - action: script.zendure_dispatch_u1_ac_mode
                        data:
                          mode: "Input mode"
                          force: true
                      - action: script.zendure_set_u1_outputlimit_zero
                  - action: script.zendure_dispatch_u1_chargelimit
                    data:
                      power: "{{ limit_calib_u1|int }}"
                      force: true
                  - action: script.zendure_dispatch_u1_inputlimit
                    data:
                      power: "{{ limit_calib_u1|int }}"
                      force: true
              - conditions:
                  - condition: template
                    value_template: >
                      {{ calib1 and not dis1 and online1 and is_state('input_boolean.zendure_emergency_u1','off') and is_state('input_boolean.zendure_vguard_u1','off') and (s1_pv_high_stable | bool)
                      and (
                          states('input_text.zendure_ac_mode_u1') != 'Output mode'
                          or curr_limit_u1|int(-1) != 0
                          or states('sensor.solarflow_1_output_limit')|int(-1) != 0
                          or states('input_number.zendure_last_sent_1')|int(-1) != 0
                          or curr_charge_u1|int(-1) != (limit_calib_u1|int)
                      ) }}
                sequence:
                  - action: script.zendure_dispatch_u1_inputlimit
                    data:
                      power: 0
                      force: true
                  - action: script.zendure_dispatch_u1_chargelimit
                    data:
                      power: "{{ limit_calib_u1|int }}"
                      force: true
                  - action: script.zendure_dispatch_u1_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_set_u1_outputlimit_zero

          # --- UNIT 2 STEUERUNG ---
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ (calib2 or dis2) and online2
                         and (temp_charge_block_u2 | bool)
                         and (
                           states('input_text.zendure_ac_mode_u2') != 'Output mode'
                           or curr_limit_u2|int(-1) != 0
                           or states('sensor.solarflow_2_output_limit')|int(-1) != 0
                           or states('input_number.zendure_last_sent_2')|int(-1) != 0
                         ) }}
                sequence:
                  - action: script.zendure_dispatch_u2_inputlimit
                    data:
                      power: 0
                      force: true
                  - action: script.zendure_dispatch_u2_chargelimit
                    data:
                      power: "0"
                      force: true
                  - action: script.zendure_dispatch_u2_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_set_u2_outputlimit_zero
              - conditions:
                  - condition: template
                    value_template: >
                      {{ dis2 and online2 and is_state('input_boolean.zendure_emergency_u2','off') and is_state('input_boolean.zendure_vguard_u2','off') and (
                           states('input_text.zendure_ac_mode_u2') != 'Output mode'
                           or curr_limit_u2|int(-1) != 0
                      ) }}
                sequence:
                  - action: script.zendure_dispatch_u2_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_dispatch_u2_chargelimit
                    data:
                      power: "0"
                      force: true
                  - action: script.zendure_dispatch_u2_inputlimit
                    data:
                      power: 0
                      force: true
              - conditions:
                  - condition: template
                    value_template: >
                      {{ calib2 and not dis2 and online2
                         and is_state('input_boolean.zendure_emergency_u2','off')
                         and is_state('input_boolean.zendure_vguard_u2','off')
                         and not (allow_ac | bool)
                         and (states('input_text.zendure_ac_mode_u2') == 'Input mode'
                              or curr_limit_u2|int(-1) != 0) }}
                sequence:
                  - action: script.zendure_dispatch_u2_inputlimit
                    data:
                      power: 0
                      force: true
                  - action: script.zendure_dispatch_u2_chargelimit
                    data:
                      power: "{{ limit_calib_u2|int }}"
                      force: true
                  - action: script.zendure_dispatch_u2_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_set_u2_outputlimit_zero
              - conditions:
                  - condition: template
                    value_template: >
                      {{ calib2 and not dis2 and online2 and is_state('input_boolean.zendure_emergency_u2','off') and is_state('input_boolean.zendure_vguard_u2','off') and (s2_pv_low_stable | bool)
                         and not (temp_charge_block_u2 | bool)
                         and (limit_calib_u2 | int(0)) > 0
                         and (allow_ac | bool)
                         and (states('input_text.zendure_ac_mode_u2') != 'Input mode'
                              or curr_limit_u2|int(-1) != (limit_calib_u2|int)
                              or curr_charge_u2|int(-1) != (limit_calib_u2|int)) }}
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ states('input_text.zendure_ac_mode_u2') != 'Input mode' }}"
                    then:
                      - action: script.zendure_dispatch_u2_ac_mode
                        data:
                          mode: "Input mode"
                          force: true
                      - action: script.zendure_set_u2_outputlimit_zero
                  - action: script.zendure_dispatch_u2_chargelimit
                    data:
                      power: "{{ limit_calib_u2|int }}"
                      force: true
                  - action: script.zendure_dispatch_u2_inputlimit
                    data:
                      power: "{{ limit_calib_u2|int }}"
                      force: true
              - conditions:
                  - condition: template
                    value_template: >
                      {{ calib2 and not dis2 and online2 and is_state('input_boolean.zendure_emergency_u2','off') and is_state('input_boolean.zendure_vguard_u2','off') and (s2_pv_high_stable | bool)
                      and (
                          states('input_text.zendure_ac_mode_u2') != 'Output mode'
                          or curr_limit_u2|int(-1) != 0
                          or states('sensor.solarflow_2_output_limit')|int(-1) != 0
                          or states('input_number.zendure_last_sent_2')|int(-1) != 0
                          or curr_charge_u2|int(-1) != (limit_calib_u2|int)
                      ) }}
                sequence:
                  - action: script.zendure_dispatch_u2_inputlimit
                    data:
                      power: 0
                      force: true
                  - action: script.zendure_dispatch_u2_chargelimit
                    data:
                      power: "{{ limit_calib_u2|int }}"
                      force: true
                  - action: script.zendure_dispatch_u2_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_set_u2_outputlimit_zero

  # --- 6.8a.1 INPUTLIMIT CLEANUP AFTER OUTPUT MODE ---
  - alias: "Zendure: InputLimit Cleanup After Output Mode"
    id: "zendure_inputlimit_cleanup_after_output_mode"
    mode: restart
    initial_state: true
    max_exceeded: silent
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id: input_boolean.zendure_auto_mode
        to: "on"
      - trigger: state
        entity_id:
          - sensor.solarflow_1_ac_mode
          - input_text.zendure_ac_mode_u1
        to: "Output mode"
      - trigger: state
        entity_id:
          - sensor.solarflow_2_ac_mode
          - input_text.zendure_ac_mode_u2
        to: "Output mode"
      - trigger: state
        entity_id:
          - input_boolean.zendure_calib_mode_u1
          - input_boolean.zendure_calib_discharge_u1
          - input_boolean.zendure_emergency_u1
          - input_boolean.zendure_vguard_u1
          - input_boolean.zendure_calib_mode_u2
          - input_boolean.zendure_calib_discharge_u2
          - input_boolean.zendure_emergency_u2
          - input_boolean.zendure_vguard_u2
        to: "off"
      - trigger: state
        entity_id:
          - sensor.solarflow_1_input_limit
          - sensor.solarflow_2_input_limit
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      # Gives the hub and MQTT readback a short window to settle after AC-mode changes.
      - delay:
          seconds: 15
      - variables:
          u1_online: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
          u2_online: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
          u1_input_raw: "{{ states('sensor.solarflow_1_input_limit') }}"
          u2_input_raw: "{{ states('sensor.solarflow_2_input_limit') }}"
          u1_input_now: >
            {{ u1_input_raw | int(states('input_number.zendure_last_inputlimit_u1') | int(0))
               if is_number(u1_input_raw) else states('input_number.zendure_last_inputlimit_u1') | int(0) }}
          u2_input_now: >
            {{ u2_input_raw | int(states('input_number.zendure_last_inputlimit_u2') | int(0))
               if is_number(u2_input_raw) else states('input_number.zendure_last_inputlimit_u2') | int(0) }}
          u1_normal_output_safe: >
            {{ (u1_online | bool)
               and states('sensor.solarflow_1_ac_mode') == 'Output mode'
               and states('input_text.zendure_ac_mode_u1') == 'Output mode'
               and is_state('input_boolean.zendure_calib_mode_u1','off')
               and is_state('input_boolean.zendure_calib_discharge_u1','off')
               and is_state('input_boolean.zendure_emergency_u1','off')
               and is_state('input_boolean.zendure_vguard_u1','off') }}
          u2_normal_output_safe: >
            {{ (u2_online | bool)
               and states('sensor.solarflow_2_ac_mode') == 'Output mode'
               and states('input_text.zendure_ac_mode_u2') == 'Output mode'
               and is_state('input_boolean.zendure_calib_mode_u2','off')
               and is_state('input_boolean.zendure_calib_discharge_u2','off')
               and is_state('input_boolean.zendure_emergency_u2','off')
               and is_state('input_boolean.zendure_vguard_u2','off') }}
      - parallel:
          - if:
              - condition: template
                value_template: "{{ (u1_normal_output_safe | bool) and (u1_input_now | int(0)) != 0 }}"
            then:
              - action: script.zendure_dispatch_u1_inputlimit
                data:
                  power: 0
                  force: true
          - if:
              - condition: template
                value_template: "{{ (u2_normal_output_safe | bool) and (u2_input_now | int(0)) != 0 }}"
            then:
              - action: script.zendure_dispatch_u2_inputlimit
                data:
                  power: 0
                  force: true

  # --- 6.8b AUTO-EMERGENCY MANAGER (PER-UNIT) ---
  - alias: "Zendure: VGuard -> Emergency Bridge (Low-SoC)"
    id: "zendure_vguard_emergency_bridge"
    mode: queued
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - input_boolean.zendure_vguard_u1
          - input_boolean.zendure_vguard_u2
          - sensor.solarflow_1_battery_level
          - sensor.solarflow_2_battery_level
          - sensor.solarflow_total_solar_input
          - input_boolean.zendure_calib_mode_u1
          - input_boolean.zendure_calib_mode_u2
          - input_boolean.zendure_emergency_u1
          - input_boolean.zendure_emergency_u2
          - sensor.solarflow_1_status_raw
          - sensor.solarflow_2_status_raw
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      - if:
          - condition: template
            value_template: >
                  {% set s = states.sensor.solarflow_1_status_raw %}
                  {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
                  {% set bt = states.sensor.solarflow_1_battery_temp_control %}
                  {% set ht = states.sensor.solarflow_1_hub_temp_control %}
                  {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
                  {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control') | float(999)) %}
                  {% set temp_mode_ok_u1 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_1_heizung', 'Aktiv') %}
                  {{ is_state('input_boolean.zendure_vguard_u1','on')
                     and is_state('input_boolean.zendure_emergency_u1','off')
                     and is_state('input_boolean.zendure_calib_mode_u1','off')
                     and fresh
                     and temp_mode_ok_u1
                     and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
                     and (
                       states('sensor.solarflow_1_battery_level')|float(100) <= states('input_number.zendure_conf_soc_emerg_start')|float(15)
                       or states('sensor.solarflow_1_cell_min_vol')|float(99) <= 3.00
                     ) }}
        then:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_vguard_u1 }
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.zendure_calib_discharge_u1
                    - input_boolean.zendure_calib_mode_u1
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_emergency_u1 }
              - variables:
                  charge_temp_cap_u1: "{{ states('sensor.solarflow_1_charge_temperature_cap') | int(0) }}"
                  soc1: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
                  ss1: "{{ 300 if soc1 < 12 else 800 }}"
                  limit_emerg_u1: "{{ [300, charge_temp_cap_u1 | int(0), ss1 | int] | min }}"
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_ac_mode_u1 }
                data: { value: "Input mode" }
              - action: script.zendure_dispatch_u1_ac_mode
                data:
                  mode: "Input mode"
                  force: true
              - action: script.zendure_set_u1_outputlimit_zero
              - action: script.zendure_dispatch_u1_inputlimit
                data:
                  power: "{{ limit_emerg_u1 }}"
                  force: true
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_1 }
                data: { value: 0 }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: "🔋 *VGuard→Emergency U1*\nKritischer Low-SoC erkannt, VGuard freigegeben und Notladung mit {{ limit_emerg_u1|int }}W gestartet."
      - if:
          - condition: template
            value_template: >
                  {% set s = states.sensor.solarflow_2_status_raw %}
                  {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
                  {% set bt = states.sensor.solarflow_2_battery_temp_control %}
                  {% set ht = states.sensor.solarflow_2_hub_temp_control %}
                  {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
                  {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control') | float(999)) %}
                  {% set temp_mode_ok_u2 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_2_heizung', 'Aktiv') %}
                  {{ is_state('input_boolean.zendure_vguard_u2','on')
                     and is_state('input_boolean.zendure_emergency_u2','off')
                     and is_state('input_boolean.zendure_calib_mode_u2','off')
                     and fresh
                     and temp_mode_ok_u2
                     and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
                     and (
                       states('sensor.solarflow_2_battery_level')|float(100) <= states('input_number.zendure_conf_soc_emerg_start')|float(15)
                       or states('sensor.solarflow_2_cell_min_vol')|float(99) <= 3.00
                     ) }}
        then:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_vguard_u2 }
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.zendure_calib_discharge_u2
                    - input_boolean.zendure_calib_mode_u2
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_emergency_u2 }
              - variables:
                  charge_temp_cap_u2: "{{ states('sensor.solarflow_2_charge_temperature_cap') | int(0) }}"
                  soc2: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
                  ss2: "{{ 300 if soc2 < 12 else 800 }}"
                  limit_emerg_u2: "{{ [300, charge_temp_cap_u2 | int(0), ss2 | int] | min }}"
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_ac_mode_u2 }
                data: { value: "Input mode" }
              - action: script.zendure_dispatch_u2_ac_mode
                data:
                  mode: "Input mode"
                  force: true
              - action: script.zendure_set_u2_outputlimit_zero
              - action: script.zendure_dispatch_u2_inputlimit
                data:
                  power: "{{ limit_emerg_u2 }}"
                  force: true
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_2 }
                data: { value: 0 }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: "🔋 *VGuard→Emergency U2*\nKritischer Low-SoC erkannt, VGuard freigegeben und Notladung mit {{ limit_emerg_u2|int }}W gestartet."

  # --- 6.8b AUTO-EMERGENCY MANAGER (PER-UNIT) ---
  - alias: "Zendure: Auto-Emergency Manager (Per-Unit)"
    id: "zendure_auto_emergency_manager_dual"
    mode: parallel
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
        id: "boot_check"

      # U1 START (SoC-basiert, konservativ)
      - trigger: template
        id: "start_u1_soc"
        value_template: >
          {% set s = states.sensor.solarflow_1_status_raw %}
          {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
          {% set vmin_ok = has_value('sensor.solarflow_1_cell_min_vol') %}
          {% set vol = states('sensor.solarflow_1_cell_min_vol')|float(0) if vmin_ok else 0 %}
          {% set soc = states('sensor.solarflow_1_battery_level')|float(100) %}
          {% set bt = states.sensor.solarflow_1_battery_temp_control %}
          {% set ht = states.sensor.solarflow_1_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u1 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_1_heizung', 'Aktiv') %}
          {% set plausible = vmin_ok and vol > 2.0 and temp_mode_ok_u1 %}
          {{ fresh and plausible
             and is_state('input_boolean.zendure_emergency_u1', 'off')
             and is_state('input_boolean.zendure_vguard_u1', 'off')
             and is_state('input_boolean.zendure_calib_mode_u1', 'off')
             and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
             and is_state('input_boolean.zendure_calib_discharge_u1','off')
             and soc <= states('input_number.zendure_conf_soc_emerg_start')|float(15)
             and temp_mode_ok_u1 }}
        for: "00:05:00"

      - trigger: template
        id: "start_u1_vol_soft"
        value_template: >
          {% set s = states.sensor.solarflow_1_status_raw %}
          {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
          {% set vmin_ok = has_value('sensor.solarflow_1_cell_min_vol') %}
          {% set vol = states('sensor.solarflow_1_cell_min_vol')|float(0) if vmin_ok else 0 %}
          {% set soc = states('sensor.solarflow_1_battery_level')|float(100) %}
          {% set out = states('sensor.solarflow_1_output_power')|float(0) %}
          {% set lim = states('sensor.solarflow_1_output_limit')|float(0) %}
          {% set bt = states.sensor.solarflow_1_battery_temp_control %}
          {% set ht = states.sensor.solarflow_1_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u1 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_1_heizung', 'Aktiv') %}
          {{ fresh
             and vmin_ok
             and is_state('input_boolean.zendure_emergency_u1', 'off')
             and is_state('input_boolean.zendure_vguard_u1', 'off')
             and is_state('input_boolean.zendure_calib_mode_u1', 'off')
             and is_state('input_boolean.zendure_calib_discharge_u1', 'off')
             and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
             and vol <= 3.05
             and soc < (states('input_number.zendure_conf_soc_emerg_stop')|float(25) + 2)
             and (out > 80 or lim > 100)
             and temp_mode_ok_u1 }}
        for: "00:02:00"

      - trigger: template
        id: "start_u1_vol_hard"
        value_template: >
          {% set s = states.sensor.solarflow_1_status_raw %}
          {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
          {% set vmin_ok = has_value('sensor.solarflow_1_cell_min_vol') %}
          {% set vol = states('sensor.solarflow_1_cell_min_vol')|float(0) if vmin_ok else 0 %}
          {% set out = states('sensor.solarflow_1_output_power')|float(0) %}
          {% set lim = states('sensor.solarflow_1_output_limit')|float(0) %}
          {% set bt = states.sensor.solarflow_1_battery_temp_control %}
          {% set ht = states.sensor.solarflow_1_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u1 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_1_heizung', 'Aktiv') %}
          {{ fresh
             and vmin_ok
             and is_state('input_boolean.zendure_emergency_u1', 'off')
             and is_state('input_boolean.zendure_vguard_u1', 'off')
             and is_state('input_boolean.zendure_calib_mode_u1', 'off')
             and is_state('input_boolean.zendure_calib_discharge_u1', 'off')
             and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
             and vol <= 3.00
             and (out > 80 or lim > 100)
             and temp_mode_ok_u1 }}
        for: "00:00:30"

      - trigger: template
        id: "start_u1_vol_panic"
        value_template: >
          {{ has_value('sensor.solarflow_1_cell_min_vol')
             and states('sensor.solarflow_1_cell_min_vol')|float(99) <= 2.95
             and is_state('input_boolean.zendure_emergency_u1','off') }}
        for: "00:00:10"

      - trigger: template
        id: "start_u2_vol_panic"
        value_template: >
          {{ has_value('sensor.solarflow_2_cell_min_vol')
             and states('sensor.solarflow_2_cell_min_vol')|float(99) <= 2.95
             and is_state('input_boolean.zendure_emergency_u2','off') }}
        for: "00:00:10"

      # U1 STOP
      - trigger: template
        id: "stop_u1"
        value_template: >
          {% set bt = states.sensor.solarflow_1_battery_temp_control %}
          {% set ht = states.sensor.solarflow_1_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u1 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_1_heizung', 'Aktiv') %}
          {{ is_state('input_boolean.zendure_emergency_u1', 'on')
             and (
               (states('sensor.solarflow_1_battery_level')|float(0) >= states('input_number.zendure_conf_soc_emerg_stop')|float(25)
                and states('sensor.solarflow_1_cell_min_vol')|float(0) >= 3.25)
               or states('sensor.solarflow_total_solar_input')|float(0) > 200
               or states('sensor.solarflow_1_status_raw')|upper in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
               or not temp_mode_ok_u1
             ) }}
        for: "00:05:00"

      # U2 START (SoC-basiert, konservativ)
      - trigger: template
        id: "start_u2_soc"
        value_template: >
          {% set s = states.sensor.solarflow_2_status_raw %}
          {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
          {% set vmin_ok = has_value('sensor.solarflow_2_cell_min_vol') %}
          {% set vol = states('sensor.solarflow_2_cell_min_vol')|float(0) if vmin_ok else 0 %}
          {% set soc = states('sensor.solarflow_2_battery_level')|float(100) %}
          {% set bt = states.sensor.solarflow_2_battery_temp_control %}
          {% set ht = states.sensor.solarflow_2_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u2 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_2_heizung', 'Aktiv') %}
          {% set plausible = vmin_ok and vol > 2.0 and temp_mode_ok_u2 %}
          {{ fresh and plausible
             and is_state('input_boolean.zendure_emergency_u2', 'off')
             and is_state('input_boolean.zendure_vguard_u2', 'off')
             and is_state('input_boolean.zendure_calib_mode_u2', 'off')
             and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
             and is_state('input_boolean.zendure_calib_discharge_u2','off')
             and soc <= states('input_number.zendure_conf_soc_emerg_start')|float(15)
             and temp_mode_ok_u2 }}
        for: "00:05:00"

      - trigger: template
        id: "start_u2_vol_soft"
        value_template: >
          {% set s = states.sensor.solarflow_2_status_raw %}
          {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
          {% set vmin_ok = has_value('sensor.solarflow_2_cell_min_vol') %}
          {% set vol = states('sensor.solarflow_2_cell_min_vol')|float(0) if vmin_ok else 0 %}
          {% set soc = states('sensor.solarflow_2_battery_level')|float(100) %}
          {% set out = states('sensor.solarflow_2_output_power')|float(0) %}
          {% set lim = states('sensor.solarflow_2_output_limit')|float(0) %}
          {% set bt = states.sensor.solarflow_2_battery_temp_control %}
          {% set ht = states.sensor.solarflow_2_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u2 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_2_heizung', 'Aktiv') %}
          {{ fresh
             and vmin_ok
             and is_state('input_boolean.zendure_emergency_u2', 'off')
             and is_state('input_boolean.zendure_vguard_u2', 'off')
             and is_state('input_boolean.zendure_calib_mode_u2', 'off')
             and is_state('input_boolean.zendure_calib_discharge_u2', 'off')
             and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
             and vol <= 3.05
             and soc < (states('input_number.zendure_conf_soc_emerg_stop')|float(25) + 2)
             and (out > 80 or lim > 100)
             and temp_mode_ok_u2 }}
        for: "00:02:00"

      - trigger: template
        id: "start_u2_vol_hard"
        value_template: >
          {% set s = states.sensor.solarflow_2_status_raw %}
          {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
          {% set vmin_ok = has_value('sensor.solarflow_2_cell_min_vol') %}
          {% set vol = states('sensor.solarflow_2_cell_min_vol')|float(0) if vmin_ok else 0 %}
          {% set out = states('sensor.solarflow_2_output_power')|float(0) %}
          {% set lim = states('sensor.solarflow_2_output_limit')|float(0) %}
          {% set bt = states.sensor.solarflow_2_battery_temp_control %}
          {% set ht = states.sensor.solarflow_2_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u2 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_2_heizung', 'Aktiv') %}
          {{ fresh
             and vmin_ok
             and is_state('input_boolean.zendure_emergency_u2', 'off')
             and is_state('input_boolean.zendure_vguard_u2', 'off')
             and is_state('input_boolean.zendure_calib_mode_u2', 'off')
             and is_state('input_boolean.zendure_calib_discharge_u2', 'off')
             and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
             and vol <= 3.00
             and (out > 80 or lim > 100)
             and temp_mode_ok_u2 }}
        for: "00:00:30"

      # U2 STOP
      - trigger: template
        id: "stop_u2"
        value_template: >
          {% set bt = states.sensor.solarflow_2_battery_temp_control %}
          {% set ht = states.sensor.solarflow_2_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u2 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_2_heizung', 'Aktiv') %}
