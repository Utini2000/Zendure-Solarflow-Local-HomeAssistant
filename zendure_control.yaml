          {% set batt_temp = batt_temp_state | float(999) %}
          {% set hub_temp = hub_temp_state | float(999) %}
          {% set batt_temp_valid = batt_temp_valid_age < 300 and is_number(batt_temp_state) %}
          {% set hub_temp_valid = hub_temp_valid_age < 300 and is_number(hub_temp_state) %}
          {% if status in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %} status_offline
          {% elif not hb_fresh %} heartbeat_stale
          {% elif is_state('input_boolean.zendure_vguard_u2','on') %} vguard_latch
          {% elif is_state('input_boolean.zendure_emergency_u2','on') %} emergency_charge
          {% elif is_state('input_boolean.zendure_calib_mode_u2','on') %} calibration_mode
          {% elif is_state('input_boolean.zendure_calib_discharge_u2','on') %} discharging_calib
          {% elif soc < 0 %} soc_invalid
          {% elif is_state('input_boolean.zendure_bypass_u2','on') and reason == 'vmin_early_stop' %} vmin_early_stop
          {% elif is_state('input_boolean.zendure_bypass_u2','on') and reason == 'soc_off_stop' %} soc_off_guard
          {% elif soc <= soc_off %} soc_off_guard
          {% elif is_state('input_boolean.zendure_bypass_u2','on') %} bypass_wait_restart
          {% elif not telemetry_seen %} telemetry_initializing
          {% elif vmin_age >= 300 %} vmin_stale
          {% elif vmin_valid_age >= 300 or not is_number(vmin_state) or vmin <= 0 %} vmin_invalid
          {% elif vmin < 3.00 %} vmin_hard_guard
          {% elif vmin < 3.05 %} vmin_softcap_deep
