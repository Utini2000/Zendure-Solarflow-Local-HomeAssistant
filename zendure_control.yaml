          since_last: "{{ as_timestamp(now()) - last_ts }}"
          actual_mode: "{{ states('sensor.solarflow_1_ac_mode') }}"
          target_changed: "{{ target_mode != last_target }}"
          repeat_due: "{{ since_last >= 20 }}"
          mismatch: "{{ actual_mode != target_mode or states('input_text.zendure_ac_mode_u1') != target_mode }}"
          publish_needed: "{{ mismatch and (target_changed or repeat_due) and (force_mode or repeat_due or target_changed) }}"
      - if:
          - condition: template
            value_template: "{{ publish_needed | bool }}"
        then:
          - action: script.zendure_config_publish_u1
            data:
