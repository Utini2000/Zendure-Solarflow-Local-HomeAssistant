      - wait_template: "{{ is_state('input_boolean.zendure_runtime_writers_ready','on') }}"
        timeout: "00:00:10"
        continue_on_timeout: false
      - variables:
          coalesce_mode: "{{ coalesce_latest | default(false) | bool }}"
          requested_power_input: >-
            {{ states('input_number.zendure_last_sent_1') | int(0)
               if coalesce_mode | bool else power | int(0) }}
          requested_power: "{{ [requested_power_input | int(0), 0] | max }}"
          safety_zero_input: "{{ safety_zero | default(false) | bool }}"
          ensure_mode: "{{ false if safety_zero_input | bool else ensure_output_mode | default(true) | bool }}"
          force_mode: "{{ force | default(false) | bool or safety_zero_input | bool }}"
          reassert_mode: "{{ false if safety_zero_input | bool else reassert_output_mode | default(false) | bool }}"
          write_desired: "{{ update_desired | default(true) | bool }}"
          peer_reserved_input: "{{ [peer_reservation | default(0) | int(0), 0] | max }}"
          peer_reserved_validated: "{{ peer_reservation_validated | default(false) | bool }}"
          safety_zero_mode: "{{ safety_zero_input | bool }}"
          generation_value: "{{ generation | default(-1) | int(-1) }}"
          generation_current: "{{ states('input_number.zendure_dispatch_generation') | int(0) }}"
          command_source: "{{ source | default('unspecified') }}"
      - if:
          - condition: template
            value_template: "{{ generation_value >= 0 and generation_value != generation_current }}"
        then:
          - stop: "Stale U1 dispatch generation dropped before mode/write transaction."

