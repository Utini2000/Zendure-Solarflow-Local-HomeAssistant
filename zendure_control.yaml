            target: { entity_id: input_boolean.zendure_deferred_coalesce_latest_u2 }
      - choose:
          - conditions: "{{ peer_valid_value | bool }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_deferred_peer_validated_u2 }
        default:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_deferred_peer_validated_u2 }
      - action: timer.start
        target: { entity_id: timer.zendure_writer_deferred_u2 }
        data: { duration: "{{ duration_value }}" }

  zendure_wire_publish_u1:
    alias: "Zendure: Final Wire Governor U1"
    mode: queued
    max: 20
    max_exceeded: warning
    fields:
      topic: { description: "Resolved MQTT set topic" }
      payload: { description: "MQTT payload" }
      source: { description: "Audit source" }
      command_class: { description: "output or config" }
      generation: { description: "Optional output generation" }
      desired_entity: { description: "Optional current desired helper" }
      desired_type: { description: "number, text, or text_ci" }
      expected_value: { description: "Value that must still be desired" }
      output_tokens_after: { description: "Compatibility field; tokens are recalculated at publish" }
      output_budget_before: { description: "Compatibility audit field" }
      output_force: { description: "Whether this is a forced/recovery output write" }
      output_safety_zero: { description: "Preserved safety-zero context" }
      output_ensure_mode: { description: "Preserved output-mode context" }
      output_reassert_mode: { description: "Preserved mode-reassert context" }
      output_peer_reservation: { description: "Peer reservation used by the coordinator" }
      output_peer_reservation_validated: { description: "Reservation backed by post-transfer physical data" }
      output_coalesce_latest: { description: "Whether the newest Desired target owns this write" }
      config_tokens_after: { description: "Compatibility field; tokens are recalculated at publish" }
      config_budget_before: { description: "Compatibility audit field" }
      last_number_entity: { description: "Optional last-published input_number" }
      last_text_entity: { description: "Optional last-published input_text" }
      last_time_entity: { description: "Optional last-published input_datetime" }
      state_text_entity: { description: "Optional internal text state helper" }
    sequence:
      - wait_template: "{{ is_state('input_boolean.zendure_runtime_writers_ready','on') }}"
        timeout: "00:00:10"
        continue_on_timeout: false
      - variables:
          topic_value: "{{ topic }}"
          payload_value: "{{ payload }}"
          source_value: "{{ source | default('wire') }}"
          class_value: "{{ command_class | default('config') }}"
          generation_value: "{{ generation | default(-1) | int(-1) }}"
          desired_entity_value: "{{ desired_entity | default('') }}"
          desired_type_value: "{{ desired_type | default('none') }}"
          expected_value_value: "{{ expected_value | default(payload) }}"
          output_force_value: "{{ output_force | default(false) | bool }}"
          output_safety_zero_value: "{{ output_safety_zero | default(false) | bool }}"
          output_ensure_mode_value: "{{ output_ensure_mode | default(true) | bool }}"
          output_reassert_mode_value: "{{ output_reassert_mode | default(false) | bool }}"
          output_peer_reservation_value: "{{ [output_peer_reservation | default(0) | int(0), 0] | max }}"
          output_peer_validated_value: "{{ output_peer_reservation_validated | default(false) | bool }}"
          output_coalesce_latest_value: "{{ output_coalesce_latest | default(false) | bool }}"
          last_number: "{{ last_number_entity | default('') }}"
          last_text: "{{ last_text_entity | default('') }}"
          last_time: "{{ last_time_entity | default('') }}"
          state_text: "{{ state_text_entity | default('') }}"
          minimum_wire_gap: 1.2
      # Priority zero owns the lock; normal traffic waits and then revalidates.
      - wait_template: "{{ is_state('input_boolean.zendure_wire_emergency_lock_u1','off') }}"
        timeout: "00:00:10"
        continue_on_timeout: false
      - repeat:
          sequence:
            - variables:
                last_any_loop: "{{ state_attr('input_datetime.zendure_last_any_publish_ts_u1','timestamp') | float(0) }}"
                elapsed_any_loop: "{{ as_timestamp(now()) - last_any_loop | float(0) }}"
                lock_active_loop: "{{ is_state('input_boolean.zendure_wire_emergency_lock_u1','on') }}"
                wait_ms_gap_loop: >-
                  {{ [((((minimum_wire_gap | float(1.2)) - elapsed_any_loop | float(0)) * 1000) + 0.999) | int(0), 0] | max }}
                wait_ms_loop: >-
                  {{ [wait_ms_gap_loop | int(0), (100 if lock_active_loop | bool else 0)] | max }}
            - if:
                - condition: template
                  value_template: "{{ wait_ms_loop | int(0) > 0 }}"
              then:
                - delay:
                    milliseconds: "{{ wait_ms_loop | int(0) }}"
          until:
            - condition: template
              value_template: >-
                {{ is_state('input_boolean.zendure_wire_emergency_lock_u1','off')
                    and (as_timestamp(now()) - (state_attr('input_datetime.zendure_last_any_publish_ts_u1','timestamp') | float(0)))
                        >= minimum_wire_gap | float(1.2) }}
      - variables:
          generation_current: "{{ states('input_number.zendure_dispatch_generation') | int(0) }}"
          generation_ok: "{{ generation_value < 0 or generation_value == generation_current }}"
          desired_matches: >-
            {% if desired_entity_value | length == 0 %}
              true
            {% elif desired_type_value == 'number' %}
              {{ is_number(states(desired_entity_value))
                   and states(desired_entity_value) | int(-99999) == expected_value_value | int(-99998) }}
            {% elif desired_type_value == 'text_ci' %}
              {{ states(desired_entity_value) | lower == expected_value_value | string | lower }}
            {% else %}
              {{ states(desired_entity_value) == expected_value_value | string }}
            {% endif %}
          lock_clear: "{{ is_state('input_boolean.zendure_wire_emergency_lock_u1','off') }}"
          valid_at_boundary: "{{ generation_ok | bool and desired_matches | bool and lock_clear | bool }}"
      - if:
          - condition: template
            value_template: "{{ not valid_at_boundary | bool }}"
        then:
          - stop: "Stale or emergency-locked MQTT write discarded."

      # Recalculate physical limits, effect direction and token state at the real publish boundary.
      - variables:
          now_boundary: "{{ now().timestamp() }}"
          previous_any_ts: "{{ state_attr('input_datetime.zendure_last_any_publish_ts_u1','timestamp') | float(0) }}"
          requested_output_target: "{{ payload_value | int(0) }}"
          dispatched_before_wire: "{{ states('input_number.zendure_last_dispatched_1') | int(0) }}"
          pending_before_wire: "{{ state_attr('input_datetime.zendure_output_pending_since_u1','timestamp') | float(0) }}"
          unit_output_limit_boundary: >-
            {{ [[states('input_number.zendure_conf_max_output_per_unit') | int(800), 0] | max, 800] | min }}
          configured_system_limit_boundary: >-
            {{ [[states('input_number.zendure_conf_max_output') | int(1000), 0] | max, 1000] | min }}
          system_output_limit_boundary: >-
            {{ [configured_system_limit_boundary | int(1000), (unit_output_limit_boundary | int(800)) * 2] | min }}
          peer_output_ts_boundary: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) }}"
          peer_output_fresh_boundary: >-
            {{ peer_output_ts_boundary > 1 and (now_boundary - peer_output_ts_boundary) < 12
                and is_number(states('sensor.solarflow_2_output_power')) }}
          peer_limit_ts_boundary: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) }}"
          peer_limit_fresh_boundary: "{{ peer_limit_ts_boundary > 1 and (now_boundary - peer_limit_ts_boundary) < 30 }}"
          peer_dispatched_boundary: "{{ states('input_number.zendure_last_dispatched_2') | int(0) }}"
          peer_confirmed_boundary: "{{ states('input_number.zendure_confirmed_output_2') | int(0) }}"
          peer_actual_boundary: >-
            {{ states('sensor.solarflow_2_output_power') | int(0) if peer_output_fresh_boundary | bool else 0 }}
          peer_conservative_boundary: >-
            {{ [peer_dispatched_boundary | int(0),
                (peer_confirmed_boundary | int(0) if peer_limit_fresh_boundary | bool else 0),
                peer_actual_boundary | int(0), 0] | max }}
          transfer_peer_validation_boundary: >-
            {{ output_peer_validated_value | bool
               and is_state('input_boolean.zendure_transfer_pending','on')
               and states('input_text.zendure_transfer_lower_unit') | lower == 'u2'
               and generation_value >= 0
               and generation_value == states('input_number.zendure_transfer_generation') | int(0)
               and generation_value == states('input_number.zendure_dispatch_generation') | int(0) }}
          reserved_peer_boundary: >-
            {% if transfer_peer_validation_boundary | bool %}
              {{ [output_peer_reservation_value | int(0), 0] | max }}
            {% else %}
              {{ [output_peer_reservation_value | int(0), peer_conservative_boundary | int(0), 0] | max }}
            {% endif %}
          remaining_system_capacity_boundary: >-
            {{ [system_output_limit_boundary | int(0) - reserved_peer_boundary | int(0), 0] | max }}
          output_target: >-
            {{ [0, [requested_output_target | int(0), unit_output_limit_boundary | int(800),
                      remaining_system_capacity_boundary | int(0)] | min] | max }}
          actual_ts_boundary: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
          actual_valid_boundary: >-
            {{ actual_ts_boundary > 1 and (now_boundary - actual_ts_boundary) < 20
                and is_number(states('sensor.solarflow_1_output_power')) }}
          actual_boundary: "{{ states('sensor.solarflow_1_output_power') | float(0) if actual_valid_boundary | bool else 0 }}"
          confirmed_boundary: "{{ states('input_number.zendure_confirmed_output_1') | int(0) }}"
          confirmed_ts_boundary: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) }}"
          confirmed_fresh_boundary: "{{ confirmed_ts_boundary > 1 and (now_boundary - confirmed_ts_boundary) < 30 }}"
          grid_valid_boundary: "{{ is_number(states('sensor.zendure_grid_power')) }}"
          grid_boundary: >-
            {{ states('sensor.zendure_grid_power') | float(0) if grid_valid_boundary | bool else 0 }}
          bias_boundary: "{{ states('input_number.zendure_conf_grid_bias') | float(10) }}"
          export_unresolved_boundary: >-
            {{ grid_valid_boundary | bool
               and (is_state('binary_sensor.solarflow_persistent_export_guard','on')
                    or grid_boundary | float(0) < bias_boundary | float(10) - 50) }}
          zero_effect_missing_boundary: >-
            {{ output_target | int(0) == 0 and (
                 (actual_valid_boundary | bool and actual_boundary | float(0) > 30)
                 or (not actual_valid_boundary | bool and (
                       (confirmed_fresh_boundary | bool and confirmed_boundary | int(0) > 0)
                       or export_unresolved_boundary | bool
                    ))
               ) }}
          downward_effect_boundary: >-
            {{ zero_effect_missing_boundary | bool
               or output_target | int(0) < dispatched_before_wire | int(0)
               or (output_force_value | bool and actual_valid_boundary | bool
                   and actual_boundary | float(0) > output_target | float(0) + 30)
               or (output_force_value | bool and not actual_valid_boundary | bool
                   and confirmed_fresh_boundary | bool
                   and confirmed_boundary | int(0) > output_target | int(0) + 30)
               or (output_force_value | bool and not actual_valid_boundary | bool
                   and not confirmed_fresh_boundary | bool
                   and grid_boundary | float(0) < bias_boundary | float(10) - 50) }}
          upward_effect_boundary: >-
            {{ output_target | int(0) > dispatched_before_wire | int(0)
               or (output_force_value | bool and not downward_effect_boundary | bool
                   and actual_valid_boundary | bool
                   and actual_boundary | float(0) < output_target | float(0) - 50
                   and grid_boundary | float(0) > bias_boundary | float(10) + 100)
               or (output_force_value | bool and not downward_effect_boundary | bool
                   and not actual_valid_boundary | bool and confirmed_fresh_boundary | bool
                   and confirmed_boundary | int(0) < output_target | int(0) - 50
                   and grid_boundary | float(0) > bias_boundary | float(10) + 100) }}
          output_new_command_boundary: "{{ output_target | int(0) != dispatched_before_wire | int(0) }}"
          output_effect_needed_boundary: "{{ downward_effect_boundary | bool or upward_effect_boundary | bool }}"
          output_publish_needed_boundary: >-
            {{ class_value != 'output' or output_new_command_boundary | bool
                or (output_force_value | bool and output_effect_needed_boundary | bool) }}
          output_capacity_boundary: "{{ states('input_number.zendure_conf_write_bucket_capacity') | float(5) }}"
          output_refill_boundary: "{{ [states('input_number.zendure_conf_write_refill_seconds') | float(4), 0.5] | max }}"
          output_stored_boundary: "{{ states('input_number.zendure_write_tokens_u1') | float(0) }}"
          output_budget_ts_boundary: "{{ state_attr('input_datetime.zendure_write_budget_ts_u1','timestamp') | float(0) }}"
          output_refilled_boundary: >-
            {{ [output_capacity_boundary | float(5), output_stored_boundary | float(0)
                 + ([now_boundary - output_budget_ts_boundary | float(0), 0] | max)
                   / output_refill_boundary | float(4)] | min }}
          reserved_reduction_boundary: >-
            {{ [[states('input_number.zendure_conf_write_reserved_reduction_tokens') | float(1), 0] | max,
                 [output_capacity_boundary | float(5) - 1, 0] | max] | min }}
          output_required_tokens_boundary: >-
            {{ 1 + reserved_reduction_boundary | float(1)
                if upward_effect_boundary | bool and not downward_effect_boundary | bool else 1 }}
          output_budget_allowed_boundary: >-
            {{ output_refilled_boundary | float(0) >= output_required_tokens_boundary | float(1) }}
          output_tokens_after_value: "{{ [output_refilled_boundary | float(0) - 1, 0] | max | round(2) }}"
          output_budget_before_value: "{{ output_refilled_boundary | float(0) }}"
          output_defer_seconds_boundary: >-
            {{ [((((output_required_tokens_boundary | float(1)) - output_refilled_boundary | float(0))
                      * output_refill_boundary | float(4)) + 0.999) | int(1), 1] | max }}
          config_capacity_boundary: "{{ states('input_number.zendure_conf_config_bucket_capacity') | float(3) }}"
          config_refill_boundary: "{{ [states('input_number.zendure_conf_config_refill_seconds') | float(10), 1] | max }}"
          config_stored_boundary: "{{ states('input_number.zendure_config_write_tokens_u1') | float(0) }}"
          config_budget_ts_boundary: "{{ state_attr('input_datetime.zendure_config_write_budget_ts_u1','timestamp') | float(0) }}"
          config_refilled_boundary: >-
            {{ [config_capacity_boundary | float(3), config_stored_boundary | float(0)
                 + ([now_boundary - config_budget_ts_boundary | float(0), 0] | max)
                   / config_refill_boundary | float(10)] | min }}
          config_budget_allowed_boundary: "{{ config_refilled_boundary | float(0) >= 1 }}"
          config_tokens_after_value: "{{ [config_refilled_boundary | float(0) - 1, 0] | max | round(2) }}"
          config_budget_before_value: "{{ config_refilled_boundary | float(0) }}"
          wire_payload: "{{ output_target | int(0) if class_value == 'output' else payload_value }}"
      - if:
          - condition: template
            value_template: "{{ class_value == 'output' and not output_publish_needed_boundary | bool }}"
        then:
          - stop: "Output command already physically/effectively satisfied."
      - if:
          - condition: template
            value_template: "{{ class_value == 'output' and not output_budget_allowed_boundary | bool }}"
        then:
          - action: script.zendure_store_deferred_u1
            data:
              target: "{{ output_target }}"
              force: "{{ output_force_value }}"
              safety_zero: "{{ output_safety_zero_value }}"
              ensure_output_mode: "{{ output_ensure_mode_value }}"
              reassert_output_mode: "{{ output_reassert_mode_value }}"
              generation: "{{ generation_value }}"
              source: "{{ source_value }}"
              peer_reservation: "{{ output_peer_reservation_value }}"
              peer_reservation_validated: "{{ output_peer_validated_value }}"
              coalesce_latest: "{{ output_coalesce_latest_value }}"
              duration: "{{ output_defer_seconds_boundary }}"
          - stop: "Output command deferred by final token boundary."
      - if:
          - condition: template
            value_template: "{{ class_value == 'config' and not config_budget_allowed_boundary | bool }}"
        then:
          - stop: "Config token unexpectedly unavailable at final boundary."

      # Last possible check before mqtt.publish: safety lock, generation and desired intent.
      - variables:
          final_generation_ok: >-
            {{ generation_value < 0
                or generation_value == states('input_number.zendure_dispatch_generation') | int(0) }}
          final_desired_matches: >-
            {% if desired_entity_value | length == 0 %}
              true
            {% elif desired_type_value == 'number' %}
              {{ is_number(states(desired_entity_value))
                   and states(desired_entity_value) | int(-99999) == expected_value_value | int(-99998) }}
            {% elif desired_type_value == 'text_ci' %}
              {{ states(desired_entity_value) | lower == expected_value_value | string | lower }}
            {% else %}
              {{ states(desired_entity_value) == expected_value_value | string }}
            {% endif %}
          final_lock_clear: "{{ is_state('input_boolean.zendure_wire_emergency_lock_u1','off') }}"
          final_publish_valid: "{{ final_generation_ok | bool and final_desired_matches | bool and final_lock_clear | bool }}"
      - if:
          - condition: template
            value_template: "{{ not final_publish_valid | bool }}"
        then:
          - stop: "MQTT publish cancelled by final generation/desired/emergency revalidation."
      - variables:
          publish_ts: "{{ now().timestamp() }}"
      - action: mqtt.publish
        data:
          topic: "{{ topic_value }}"
          payload: "{{ wire_payload }}"
          qos: 1
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.zendure_last_any_publish_ts_u1 }
        data: { timestamp: "{{ publish_ts }}" }
      - event: zendure_wire_publish
        event_data:
          unit: 1
          command_class: "{{ class_value }}"
          source: "{{ source_value }}"
          payload: "{{ wire_payload }}"
          seconds_since_previous: "{{ (publish_ts | float(0) - previous_any_ts | float(0)) | round(3) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ class_value == 'output' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_last_dispatch_ts_u1 }
                data: { timestamp: "{{ publish_ts }}" }
              - if:
                  - condition: template
                    value_template: "{{ output_target | int(0) != dispatched_before_wire | int(0) }}"
                then:
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_last_dispatched_1 }
                    data: { value: "{{ output_target | int(0) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_write_tokens_u1 }
                data: { value: "{{ output_tokens_after_value | float(0) }}" }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_write_budget_ts_u1 }
                data: { timestamp: "{{ publish_ts }}" }
              - action: script.zendure_clear_deferred_u1
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_last_output_publish_u1 }
                data:
                  value: >-
                    {{ now().isoformat() }}|u1|{{ output_target | int(0) }}W|{{ source_value }}|force={{ output_force_value | bool }}|bypass=false|gen={{ generation_value }}|budget={{ output_budget_before_value | round(2) }}
              - event: zendure_outputlimit_publish
                event_data:
                  unit: 1
                  target: "{{ output_target | int(0) }}"
                  source: "{{ source_value }}"
                  force: "{{ output_force_value | bool }}"
                  emergency_bypass: false
                  generation: "{{ generation_value }}"
                  seconds_since_previous: "{{ (publish_ts | float(0) - previous_any_ts | float(0)) | round(3) }}"
                  budget_before: "{{ output_budget_before_value | round(3) }}"
              - variables:
                  readback_now: >-
                    {{ states('sensor.solarflow_1_output_limit') | int(-1)
                       if is_number(states('sensor.solarflow_1_output_limit')) else -1 }}
                  readback_ts_now: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) }}"
                  output_ts_now: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
                  actual_valid_now: >-
                    {{ output_ts_now | float(0) > 1
                       and (as_timestamp(now()) - output_ts_now | float(0)) < 20
                       and is_number(states('sensor.solarflow_1_output_power')) }}
                  actual_now: "{{ states('sensor.solarflow_1_output_power') | float(0) if actual_valid_now | bool else 0 }}"
                  grid_valid_now: "{{ is_number(states('sensor.zendure_grid_power')) }}"
                  grid_now_ack: "{{ states('sensor.zendure_grid_power') | float(0) if grid_valid_now | bool else 0 }}"
                  grid_bias_ack: "{{ states('input_number.zendure_conf_grid_bias') | float(10) }}"
                  export_unresolved_now: >-
                    {{ grid_valid_now | bool
                       and (is_state('binary_sensor.solarflow_persistent_export_guard','on')
                            or grid_now_ack | float(0) < grid_bias_ack | float(10) - 50) }}
                  physical_zero_now: "{{ actual_valid_now | bool and actual_now | float(0) <= 30 }}"
                  zero_ack_safe_now: >-
                    {{ output_target | int(0) != 0
                       or physical_zero_now | bool
                       or (not actual_valid_now | bool and grid_valid_now | bool and not export_unresolved_now | bool) }}
                  ack_already_confirmed: >-
                    {{ readback_now | int(-1) == output_target | int(0)
                       and readback_ts_now >= publish_ts | float(0)
                       and zero_ack_safe_now | bool }}
                  pending_age_wire: >-
                    {{ publish_ts | float(0) - pending_before_wire | float(0)
                       if pending_before_wire | float(0) > 1 else 0 }}
                  next_retry_wire: >-
                    {{ 10 if pending_age_wire | float(0) < 60 else 30 if pending_age_wire | float(0) < 300 else 60 }}
              - if:
                  - condition: template
                    value_template: "{{ ack_already_confirmed | bool }}"
                then:
                  - action: input_datetime.set_datetime
                    target: { entity_id: input_datetime.zendure_output_pending_since_u1 }
                    data: { datetime: "1970-01-01 00:00:00" }
                  - action: timer.cancel
                    target: { entity_id: timer.zendure_ack_retry_u1 }
                else:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ output_target | int(0) != dispatched_before_wire | int(0)
                             or pending_before_wire | float(0) <= 1 }}
                    then:
                      - action: input_datetime.set_datetime
                        target: { entity_id: input_datetime.zendure_output_pending_since_u1 }
                        data: { timestamp: "{{ publish_ts }}" }
                  - action: timer.start
                    target: { entity_id: timer.zendure_ack_retry_u1 }
                    data: { duration: "{{ next_retry_wire | int(10) }}" }
          - conditions:
              - condition: template
                value_template: "{{ class_value == 'config' }}"
            sequence:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_config_write_tokens_u1 }
                data: { value: "{{ config_tokens_after_value | float(0) }}" }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_config_write_budget_ts_u1 }
                data: { timestamp: "{{ publish_ts }}" }
              - if:
                  - condition: template
                    value_template: "{{ last_number | length > 0 }}"
                then:
                  - action: input_number.set_value
                    target: { entity_id: "{{ last_number }}" }
                    data: { value: "{{ wire_payload | int(0) }}" }
              - if:
                  - condition: template
                    value_template: "{{ last_text | length > 0 }}"
                then:
                  - action: input_text.set_value
                    target: { entity_id: "{{ last_text }}" }
                    data: { value: "{{ wire_payload }}" }
              - if:
                  - condition: template
                    value_template: "{{ last_time | length > 0 }}"
                then:
                  - action: input_datetime.set_datetime
                    target: { entity_id: "{{ last_time }}" }
                    data: { timestamp: "{{ publish_ts }}" }
              - if:
                  - condition: template
                    value_template: "{{ state_text | length > 0 }}"
                then:
                  - action: input_text.set_value
                    target: { entity_id: "{{ state_text }}" }
                    data: { value: "{{ wire_payload }}" }
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_last_config_publish_u1 }
                data:
                  value: "{{ now().isoformat() }}|u1|{{ source_value }}|{{ wire_payload }}|budget={{ config_budget_before_value | round(2) }}"
              - event: zendure_config_publish
                event_data:
                  unit: 1
                  source: "{{ source_value }}"
                  payload: "{{ wire_payload }}"
                  budget_before: "{{ config_budget_before_value | round(3) }}"
                  wire_gap: "{{ (publish_ts | float(0) - previous_any_ts | float(0)) | round(3) }}"

  zendure_wire_publish_u2:
    alias: "Zendure: Final Wire Governor U2"
    mode: queued
    max: 20
    max_exceeded: warning
    fields:
      topic: { description: "Resolved MQTT set topic" }
      payload: { description: "MQTT payload" }
      source: { description: "Audit source" }
      command_class: { description: "output or config" }
      generation: { description: "Optional output generation" }
      desired_entity: { description: "Optional current desired helper" }
      desired_type: { description: "number, text, or text_ci" }
      expected_value: { description: "Value that must still be desired" }
      output_tokens_after: { description: "Compatibility field; tokens are recalculated at publish" }
      output_budget_before: { description: "Compatibility audit field" }
      output_force: { description: "Whether this is a forced/recovery output write" }
      output_safety_zero: { description: "Preserved safety-zero context" }
      output_ensure_mode: { description: "Preserved output-mode context" }
      output_reassert_mode: { description: "Preserved mode-reassert context" }
      output_peer_reservation: { description: "Peer reservation used by the coordinator" }
      output_peer_reservation_validated: { description: "Reservation backed by post-transfer physical data" }
      output_coalesce_latest: { description: "Whether the newest Desired target owns this write" }
      config_tokens_after: { description: "Compatibility field; tokens are recalculated at publish" }
      config_budget_before: { description: "Compatibility audit field" }
      last_number_entity: { description: "Optional last-published input_number" }
      last_text_entity: { description: "Optional last-published input_text" }
      last_time_entity: { description: "Optional last-published input_datetime" }
      state_text_entity: { description: "Optional internal text state helper" }
    sequence:
      - wait_template: "{{ is_state('input_boolean.zendure_runtime_writers_ready','on') }}"
        timeout: "00:00:10"
        continue_on_timeout: false
      - variables:
          topic_value: "{{ topic }}"
          payload_value: "{{ payload }}"
          source_value: "{{ source | default('wire') }}"
          class_value: "{{ command_class | default('config') }}"
          generation_value: "{{ generation | default(-1) | int(-1) }}"
          desired_entity_value: "{{ desired_entity | default('') }}"
          desired_type_value: "{{ desired_type | default('none') }}"
          expected_value_value: "{{ expected_value | default(payload) }}"
          output_force_value: "{{ output_force | default(false) | bool }}"
          output_safety_zero_value: "{{ output_safety_zero | default(false) | bool }}"
          output_ensure_mode_value: "{{ output_ensure_mode | default(true) | bool }}"
          output_reassert_mode_value: "{{ output_reassert_mode | default(false) | bool }}"
          output_peer_reservation_value: "{{ [output_peer_reservation | default(0) | int(0), 0] | max }}"
          output_peer_validated_value: "{{ output_peer_reservation_validated | default(false) | bool }}"
          output_coalesce_latest_value: "{{ output_coalesce_latest | default(false) | bool }}"
          last_number: "{{ last_number_entity | default('') }}"
          last_text: "{{ last_text_entity | default('') }}"
          last_time: "{{ last_time_entity | default('') }}"
          state_text: "{{ state_text_entity | default('') }}"
          minimum_wire_gap: 1.2
      # Priority zero owns the lock; normal traffic waits and then revalidates.
      - wait_template: "{{ is_state('input_boolean.zendure_wire_emergency_lock_u2','off') }}"
        timeout: "00:00:10"
        continue_on_timeout: false
      - repeat:
          sequence:
            - variables:
                last_any_loop: "{{ state_attr('input_datetime.zendure_last_any_publish_ts_u2','timestamp') | float(0) }}"
                elapsed_any_loop: "{{ as_timestamp(now()) - last_any_loop | float(0) }}"
                lock_active_loop: "{{ is_state('input_boolean.zendure_wire_emergency_lock_u2','on') }}"
                wait_ms_gap_loop: >-
                  {{ [((((minimum_wire_gap | float(1.2)) - elapsed_any_loop | float(0)) * 1000) + 0.999) | int(0), 0] | max }}
                wait_ms_loop: >-
                  {{ [wait_ms_gap_loop | int(0), (100 if lock_active_loop | bool else 0)] | max }}
            - if:
                - condition: template
                  value_template: "{{ wait_ms_loop | int(0) > 0 }}"
              then:
                - delay:
                    milliseconds: "{{ wait_ms_loop | int(0) }}"
          until:
            - condition: template
              value_template: >-
                {{ is_state('input_boolean.zendure_wire_emergency_lock_u2','off')
                    and (as_timestamp(now()) - (state_attr('input_datetime.zendure_last_any_publish_ts_u2','timestamp') | float(0)))
                        >= minimum_wire_gap | float(1.2) }}
      - variables:
          generation_current: "{{ states('input_number.zendure_dispatch_generation') | int(0) }}"
          generation_ok: "{{ generation_value < 0 or generation_value == generation_current }}"
          desired_matches: >-
            {% if desired_entity_value | length == 0 %}
              true
            {% elif desired_type_value == 'number' %}
              {{ is_number(states(desired_entity_value))
                   and states(desired_entity_value) | int(-99999) == expected_value_value | int(-99998) }}
            {% elif desired_type_value == 'text_ci' %}
              {{ states(desired_entity_value) | lower == expected_value_value | string | lower }}
            {% else %}
              {{ states(desired_entity_value) == expected_value_value | string }}
            {% endif %}
          lock_clear: "{{ is_state('input_boolean.zendure_wire_emergency_lock_u2','off') }}"
          valid_at_boundary: "{{ generation_ok | bool and desired_matches | bool and lock_clear | bool }}"
      - if:
          - condition: template
            value_template: "{{ not valid_at_boundary | bool }}"
        then:
          - stop: "Stale or emergency-locked MQTT write discarded."

      # Recalculate physical limits, effect direction and token state at the real publish boundary.
      - variables:
          now_boundary: "{{ now().timestamp() }}"
          previous_any_ts: "{{ state_attr('input_datetime.zendure_last_any_publish_ts_u2','timestamp') | float(0) }}"
          requested_output_target: "{{ payload_value | int(0) }}"
          dispatched_before_wire: "{{ states('input_number.zendure_last_dispatched_2') | int(0) }}"
          pending_before_wire: "{{ state_attr('input_datetime.zendure_output_pending_since_u2','timestamp') | float(0) }}"
          unit_output_limit_boundary: >-
            {{ [[states('input_number.zendure_conf_max_output_per_unit') | int(800), 0] | max, 800] | min }}
          configured_system_limit_boundary: >-
            {{ [[states('input_number.zendure_conf_max_output') | int(1000), 0] | max, 1000] | min }}
          system_output_limit_boundary: >-
            {{ [configured_system_limit_boundary | int(1000), (unit_output_limit_boundary | int(800)) * 2] | min }}
          peer_output_ts_boundary: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
          peer_output_fresh_boundary: >-
            {{ peer_output_ts_boundary > 1 and (now_boundary - peer_output_ts_boundary) < 12
                and is_number(states('sensor.solarflow_1_output_power')) }}
          peer_limit_ts_boundary: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) }}"
          peer_limit_fresh_boundary: "{{ peer_limit_ts_boundary > 1 and (now_boundary - peer_limit_ts_boundary) < 30 }}"
          peer_dispatched_boundary: "{{ states('input_number.zendure_last_dispatched_1') | int(0) }}"
          peer_confirmed_boundary: "{{ states('input_number.zendure_confirmed_output_1') | int(0) }}"
          peer_actual_boundary: >-
            {{ states('sensor.solarflow_1_output_power') | int(0) if peer_output_fresh_boundary | bool else 0 }}
          peer_conservative_boundary: >-
            {{ [peer_dispatched_boundary | int(0),
                (peer_confirmed_boundary | int(0) if peer_limit_fresh_boundary | bool else 0),
                peer_actual_boundary | int(0), 0] | max }}
          transfer_peer_validation_boundary: >-
            {{ output_peer_validated_value | bool
               and is_state('input_boolean.zendure_transfer_pending','on')
               and states('input_text.zendure_transfer_lower_unit') | lower == 'u1'
               and generation_value >= 0
               and generation_value == states('input_number.zendure_transfer_generation') | int(0)
               and generation_value == states('input_number.zendure_dispatch_generation') | int(0) }}
          reserved_peer_boundary: >-
            {% if transfer_peer_validation_boundary | bool %}
              {{ [output_peer_reservation_value | int(0), 0] | max }}
            {% else %}
              {{ [output_peer_reservation_value | int(0), peer_conservative_boundary | int(0), 0] | max }}
            {% endif %}
          remaining_system_capacity_boundary: >-
            {{ [system_output_limit_boundary | int(0) - reserved_peer_boundary | int(0), 0] | max }}
          output_target: >-
            {{ [0, [requested_output_target | int(0), unit_output_limit_boundary | int(800),
                      remaining_system_capacity_boundary | int(0)] | min] | max }}
          actual_ts_boundary: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) }}"
          actual_valid_boundary: >-
            {{ actual_ts_boundary > 1 and (now_boundary - actual_ts_boundary) < 20
                and is_number(states('sensor.solarflow_2_output_power')) }}
          actual_boundary: "{{ states('sensor.solarflow_2_output_power') | float(0) if actual_valid_boundary | bool else 0 }}"
          confirmed_boundary: "{{ states('input_number.zendure_confirmed_output_2') | int(0) }}"
          confirmed_ts_boundary: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) }}"
          confirmed_fresh_boundary: "{{ confirmed_ts_boundary > 1 and (now_boundary - confirmed_ts_boundary) < 30 }}"
          grid_valid_boundary: "{{ is_number(states('sensor.zendure_grid_power')) }}"
          grid_boundary: >-
            {{ states('sensor.zendure_grid_power') | float(0) if grid_valid_boundary | bool else 0 }}
          bias_boundary: "{{ states('input_number.zendure_conf_grid_bias') | float(10) }}"
          export_unresolved_boundary: >-
            {{ grid_valid_boundary | bool
               and (is_state('binary_sensor.solarflow_persistent_export_guard','on')
                    or grid_boundary | float(0) < bias_boundary | float(10) - 50) }}
          zero_effect_missing_boundary: >-
            {{ output_target | int(0) == 0 and (
                 (actual_valid_boundary | bool and actual_boundary | float(0) > 30)
                 or (not actual_valid_boundary | bool and (
                       (confirmed_fresh_boundary | bool and confirmed_boundary | int(0) > 0)
                       or export_unresolved_boundary | bool
                    ))
               ) }}
          downward_effect_boundary: >-
            {{ zero_effect_missing_boundary | bool
               or output_target | int(0) < dispatched_before_wire | int(0)
               or (output_force_value | bool and actual_valid_boundary | bool
                   and actual_boundary | float(0) > output_target | float(0) + 30)
               or (output_force_value | bool and not actual_valid_boundary | bool
                   and confirmed_fresh_boundary | bool
                   and confirmed_boundary | int(0) > output_target | int(0) + 30)
               or (output_force_value | bool and not actual_valid_boundary | bool
                   and not confirmed_fresh_boundary | bool
                   and grid_boundary | float(0) < bias_boundary | float(10) - 50) }}
          upward_effect_boundary: >-
            {{ output_target | int(0) > dispatched_before_wire | int(0)
               or (output_force_value | bool and not downward_effect_boundary | bool
                   and actual_valid_boundary | bool
                   and actual_boundary | float(0) < output_target | float(0) - 50
                   and grid_boundary | float(0) > bias_boundary | float(10) + 100)
               or (output_force_value | bool and not downward_effect_boundary | bool
                   and not actual_valid_boundary | bool and confirmed_fresh_boundary | bool
                   and confirmed_boundary | int(0) < output_target | int(0) - 50
                   and grid_boundary | float(0) > bias_boundary | float(10) + 100) }}
          output_new_command_boundary: "{{ output_target | int(0) != dispatched_before_wire | int(0) }}"
          output_effect_needed_boundary: "{{ downward_effect_boundary | bool or upward_effect_boundary | bool }}"
          output_publish_needed_boundary: >-
            {{ class_value != 'output' or output_new_command_boundary | bool
                or (output_force_value | bool and output_effect_needed_boundary | bool) }}
          output_capacity_boundary: "{{ states('input_number.zendure_conf_write_bucket_capacity') | float(5) }}"
          output_refill_boundary: "{{ [states('input_number.zendure_conf_write_refill_seconds') | float(4), 0.5] | max }}"
          output_stored_boundary: "{{ states('input_number.zendure_write_tokens_u2') | float(0) }}"
          output_budget_ts_boundary: "{{ state_attr('input_datetime.zendure_write_budget_ts_u2','timestamp') | float(0) }}"
          output_refilled_boundary: >-
            {{ [output_capacity_boundary | float(5), output_stored_boundary | float(0)
                 + ([now_boundary - output_budget_ts_boundary | float(0), 0] | max)
                   / output_refill_boundary | float(4)] | min }}
          reserved_reduction_boundary: >-
            {{ [[states('input_number.zendure_conf_write_reserved_reduction_tokens') | float(1), 0] | max,
                 [output_capacity_boundary | float(5) - 1, 0] | max] | min }}
          output_required_tokens_boundary: >-
            {{ 1 + reserved_reduction_boundary | float(1)
                if upward_effect_boundary | bool and not downward_effect_boundary | bool else 1 }}
          output_budget_allowed_boundary: >-
            {{ output_refilled_boundary | float(0) >= output_required_tokens_boundary | float(1) }}
          output_tokens_after_value: "{{ [output_refilled_boundary | float(0) - 1, 0] | max | round(2) }}"
          output_budget_before_value: "{{ output_refilled_boundary | float(0) }}"
          output_defer_seconds_boundary: >-
            {{ [((((output_required_tokens_boundary | float(1)) - output_refilled_boundary | float(0))
                      * output_refill_boundary | float(4)) + 0.999) | int(1), 1] | max }}
          config_capacity_boundary: "{{ states('input_number.zendure_conf_config_bucket_capacity') | float(3) }}"
          config_refill_boundary: "{{ [states('input_number.zendure_conf_config_refill_seconds') | float(10), 1] | max }}"
          config_stored_boundary: "{{ states('input_number.zendure_config_write_tokens_u2') | float(0) }}"
          config_budget_ts_boundary: "{{ state_attr('input_datetime.zendure_config_write_budget_ts_u2','timestamp') | float(0) }}"
          config_refilled_boundary: >-
            {{ [config_capacity_boundary | float(3), config_stored_boundary | float(0)
                 + ([now_boundary - config_budget_ts_boundary | float(0), 0] | max)
                   / config_refill_boundary | float(10)] | min }}
          config_budget_allowed_boundary: "{{ config_refilled_boundary | float(0) >= 1 }}"
          config_tokens_after_value: "{{ [config_refilled_boundary | float(0) - 1, 0] | max | round(2) }}"
          config_budget_before_value: "{{ config_refilled_boundary | float(0) }}"
          wire_payload: "{{ output_target | int(0) if class_value == 'output' else payload_value }}"
      - if:
          - condition: template
            value_template: "{{ class_value == 'output' and not output_publish_needed_boundary | bool }}"
        then:
          - stop: "Output command already physically/effectively satisfied."
      - if:
          - condition: template
            value_template: "{{ class_value == 'output' and not output_budget_allowed_boundary | bool }}"
        then:
          - action: script.zendure_store_deferred_u2
            data:
              target: "{{ output_target }}"
              force: "{{ output_force_value }}"
              safety_zero: "{{ output_safety_zero_value }}"
              ensure_output_mode: "{{ output_ensure_mode_value }}"
              reassert_output_mode: "{{ output_reassert_mode_value }}"
              generation: "{{ generation_value }}"
              source: "{{ source_value }}"
              peer_reservation: "{{ output_peer_reservation_value }}"
              peer_reservation_validated: "{{ output_peer_validated_value }}"
              coalesce_latest: "{{ output_coalesce_latest_value }}"
              duration: "{{ output_defer_seconds_boundary }}"
          - stop: "Output command deferred by final token boundary."
      - if:
          - condition: template
            value_template: "{{ class_value == 'config' and not config_budget_allowed_boundary | bool }}"
        then:
          - stop: "Config token unexpectedly unavailable at final boundary."

      # Last possible check before mqtt.publish: safety lock, generation and desired intent.
      - variables:
          final_generation_ok: >-
            {{ generation_value < 0
                or generation_value == states('input_number.zendure_dispatch_generation') | int(0) }}
          final_desired_matches: >-
            {% if desired_entity_value | length == 0 %}
              true
            {% elif desired_type_value == 'number' %}
              {{ is_number(states(desired_entity_value))
                   and states(desired_entity_value) | int(-99999) == expected_value_value | int(-99998) }}
            {% elif desired_type_value == 'text_ci' %}
              {{ states(desired_entity_value) | lower == expected_value_value | string | lower }}
            {% else %}
              {{ states(desired_entity_value) == expected_value_value | string }}
            {% endif %}
          final_lock_clear: "{{ is_state('input_boolean.zendure_wire_emergency_lock_u2','off') }}"
          final_publish_valid: "{{ final_generation_ok | bool and final_desired_matches | bool and final_lock_clear | bool }}"
      - if:
          - condition: template
            value_template: "{{ not final_publish_valid | bool }}"
        then:
          - stop: "MQTT publish cancelled by final generation/desired/emergency revalidation."
      - variables:
          publish_ts: "{{ now().timestamp() }}"
      - action: mqtt.publish
        data:
          topic: "{{ topic_value }}"
          payload: "{{ wire_payload }}"
          qos: 1
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.zendure_last_any_publish_ts_u2 }
        data: { timestamp: "{{ publish_ts }}" }
      - event: zendure_wire_publish
        event_data:
          unit: 2
          command_class: "{{ class_value }}"
          source: "{{ source_value }}"
          payload: "{{ wire_payload }}"
          seconds_since_previous: "{{ (publish_ts | float(0) - previous_any_ts | float(0)) | round(3) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ class_value == 'output' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_last_dispatch_ts_u2 }
                data: { timestamp: "{{ publish_ts }}" }
              - if:
                  - condition: template
                    value_template: "{{ output_target | int(0) != dispatched_before_wire | int(0) }}"
                then:
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_last_dispatched_2 }
                    data: { value: "{{ output_target | int(0) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_write_tokens_u2 }
                data: { value: "{{ output_tokens_after_value | float(0) }}" }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_write_budget_ts_u2 }
                data: { timestamp: "{{ publish_ts }}" }
              - action: script.zendure_clear_deferred_u2
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_last_output_publish_u2 }
                data:
                  value: >-
                    {{ now().isoformat() }}|u2|{{ output_target | int(0) }}W|{{ source_value }}|force={{ output_force_value | bool }}|bypass=false|gen={{ generation_value }}|budget={{ output_budget_before_value | round(2) }}
              - event: zendure_outputlimit_publish
                event_data:
                  unit: 2
                  target: "{{ output_target | int(0) }}"
                  source: "{{ source_value }}"
                  force: "{{ output_force_value | bool }}"
                  emergency_bypass: false
                  generation: "{{ generation_value }}"
                  seconds_since_previous: "{{ (publish_ts | float(0) - previous_any_ts | float(0)) | round(3) }}"
                  budget_before: "{{ output_budget_before_value | round(3) }}"
              - variables:
                  readback_now: >-
                    {{ states('sensor.solarflow_2_output_limit') | int(-1)
                       if is_number(states('sensor.solarflow_2_output_limit')) else -1 }}
                  readback_ts_now: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) }}"
                  output_ts_now: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) }}"
                  actual_valid_now: >-
                    {{ output_ts_now | float(0) > 1
                       and (as_timestamp(now()) - output_ts_now | float(0)) < 20
                       and is_number(states('sensor.solarflow_2_output_power')) }}
                  actual_now: "{{ states('sensor.solarflow_2_output_power') | float(0) if actual_valid_now | bool else 0 }}"
                  grid_valid_now: "{{ is_number(states('sensor.zendure_grid_power')) }}"
                  grid_now_ack: "{{ states('sensor.zendure_grid_power') | float(0) if grid_valid_now | bool else 0 }}"
                  grid_bias_ack: "{{ states('input_number.zendure_conf_grid_bias') | float(10) }}"
                  export_unresolved_now: >-
                    {{ grid_valid_now | bool
                       and (is_state('binary_sensor.solarflow_persistent_export_guard','on')
                            or grid_now_ack | float(0) < grid_bias_ack | float(10) - 50) }}
                  physical_zero_now: "{{ actual_valid_now | bool and actual_now | float(0) <= 30 }}"
                  zero_ack_safe_now: >-
                    {{ output_target | int(0) != 0
                       or physical_zero_now | bool
                       or (not actual_valid_now | bool and grid_valid_now | bool and not export_unresolved_now | bool) }}
                  ack_already_confirmed: >-
                    {{ readback_now | int(-1) == output_target | int(0)
                       and readback_ts_now >= publish_ts | float(0)
                       and zero_ack_safe_now | bool }}
                  pending_age_wire: >-
                    {{ publish_ts | float(0) - pending_before_wire | float(0)
                       if pending_before_wire | float(0) > 1 else 0 }}
                  next_retry_wire: >-
                    {{ 10 if pending_age_wire | float(0) < 60 else 30 if pending_age_wire | float(0) < 300 else 60 }}
              - if:
                  - condition: template
                    value_template: "{{ ack_already_confirmed | bool }}"
                then:
                  - action: input_datetime.set_datetime
                    target: { entity_id: input_datetime.zendure_output_pending_since_u2 }
                    data: { datetime: "1970-01-01 00:00:00" }
                  - action: timer.cancel
                    target: { entity_id: timer.zendure_ack_retry_u2 }
                else:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ output_target | int(0) != dispatched_before_wire | int(0)
                             or pending_before_wire | float(0) <= 1 }}
                    then:
                      - action: input_datetime.set_datetime
                        target: { entity_id: input_datetime.zendure_output_pending_since_u2 }
                        data: { timestamp: "{{ publish_ts }}" }
                  - action: timer.start
                    target: { entity_id: timer.zendure_ack_retry_u2 }
                    data: { duration: "{{ next_retry_wire | int(10) }}" }
          - conditions:
              - condition: template
                value_template: "{{ class_value == 'config' }}"
            sequence:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_config_write_tokens_u2 }
                data: { value: "{{ config_tokens_after_value | float(0) }}" }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_config_write_budget_ts_u2 }
                data: { timestamp: "{{ publish_ts }}" }
              - if:
                  - condition: template
                    value_template: "{{ last_number | length > 0 }}"
                then:
                  - action: input_number.set_value
