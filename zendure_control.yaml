          mismatch: >-
            {{ (is_number(actual_raw) and target | int(-2) != actual | int(-1))
                or (not is_number(actual_raw) and target | int(-2) != memory_before | int(-1)) }}
          publish_needed: "{{ mismatch and (target_changed or repeat_due) and (force_mode or since_publish > 2.2 or target_changed) }}"
