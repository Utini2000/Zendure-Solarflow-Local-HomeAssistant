          actual_now: "{{ states('sensor.solarflow_2_output_power') | float(0) if actual_valid | bool else 0 }}"
          grid_valid: "{{ is_number(states('sensor.zendure_grid_power')) }}"
          grid_now: "{{ states('sensor.zendure_grid_power') | float(0) if grid_valid | bool else 0 }}"
          grid_bias_now: "{{ states('input_number.zendure_conf_grid_bias') | float(10) }}"
          export_unresolved: >-
            {{ grid_valid | bool
               and (is_state('binary_sensor.solarflow_persistent_export_guard','on')
                    or grid_now | float(0) < grid_bias_now | float(10) - 50) }}
          zero_effect_missing: >-
            {{ target | int(0) == 0 and (
                 (actual_valid | bool and actual_now | float(0) > 30)
                 or (not actual_valid | bool and (
                       (confirmed_recent | bool and confirmed | int(0) > 0)
                       or export_unresolved | bool
                    ))
               ) }}
          needs_downward_effect: >-
            {{ zero_effect_missing | bool
               or target | int(0) < dispatched_before | int(0)
               or (
                 force_mode | bool
                 and (
                   (actual_valid | bool and actual_now | float(0) > target | float(0) + 30)
                   or (not actual_valid | bool and confirmed_recent | bool
                       and confirmed | int(0) > target | int(0) + 30)
                   or (not actual_valid | bool and not confirmed_recent | bool
                       and grid_now | float(0) < grid_bias_now | float(10) - 50)
                 )
               ) }}
          needs_upward_effect: >-
            {{ target | int(0) > dispatched_before | int(0)
               or (
                 force_mode | bool
                 and not needs_downward_effect | bool
                 and (
                   (actual_valid | bool and actual_now | float(0) < target | float(0) - 50
                    and grid_now | float(0) > grid_bias_now | float(10) + 100)
                   or (not actual_valid | bool and confirmed_recent | bool
                       and confirmed | int(0) < target | int(0) - 50
                       and grid_now | float(0) > grid_bias_now | float(10) + 100)
                 )
               ) }}
          retry_effect_needed: "{{ needs_downward_effect | bool or needs_upward_effect | bool }}"
          bucket_capacity: "{{ states('input_number.zendure_conf_write_bucket_capacity') | float(5) }}"
          refill_seconds: "{{ [states('input_number.zendure_conf_write_refill_seconds') | float(4), 0.5] | max }}"
          bucket_stored: "{{ states('input_number.zendure_write_tokens_u2') | float(bucket_capacity | float(5)) }}"
          bucket_ts: "{{ (state_attr('input_datetime.zendure_write_budget_ts_u2','timestamp') | float(0)) }}"
          bucket_elapsed: "{{ [as_timestamp(now()) - bucket_ts | float(0), 0] | max }}"
          bucket_refilled: >-
            {{ [bucket_capacity | float(5), bucket_stored | float(0)
                 + bucket_elapsed | float(0) / refill_seconds | float(4)] | min }}
          reserved_reduction_tokens_raw: "{{ states('input_number.zendure_conf_write_reserved_reduction_tokens') | float(1) }}"
          reserved_reduction_tokens: >-
            {{ [[reserved_reduction_tokens_raw | float(1), 0] | max,
                 [bucket_capacity | float(5) - 1, 0] | max] | min }}
          is_increase: "{{ needs_upward_effect | bool and not needs_downward_effect | bool }}"
          required_tokens: "{{ (1 + reserved_reduction_tokens | float(1)) if is_increase | bool else 1 }}"
          budget_available: "{{ bucket_refilled | float(0) >= required_tokens | float(1) }}"
          tokens_after_publish: "{{ [bucket_refilled | float(0) - 1, 0] | max | round(2) }}"
          token_wait_seconds: >-
            {{ [((((required_tokens | float(1)) - bucket_refilled | float(0)) * refill_seconds | float(4)) + 0.999) | int(1), 1] | max
                if not budget_available | bool else 1 }}
          next_retry_seconds: >-
            {% set age = as_timestamp(now()) - pending_before_ts if pending_before_ts > 1 else 0 %}
            {{ 10 if age < 60 else 30 if age < 300 else 60 }}
          publish_needed: >-
            {{ new_command | bool or (force_mode | bool and retry_effect_needed | bool) }}
          publish_allowed: >-
            {{ publish_needed | bool and budget_available | bool }}
      - if:
          - condition: template
            value_template: "{{ not generation_ok_final }}"
        then:
          - stop: "Stale U2 dispatch generation dropped immediately before publish."
      - if:
          - condition: template
            value_template: "{{ write_desired and target != desired_before }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_2 }
            data: { value: "{{ target }}" }
      - variables:
          generation_current_publish: "{{ states('input_number.zendure_dispatch_generation') | int(0) }}"
      - if:
          - condition: template
            value_template: "{{ generation_value >= 0 and generation_value != generation_current_publish }}"
        then:
          - stop: "Stale U2 dispatch generation dropped at publish boundary."
      - if:
          - condition: template
            value_template: "{{ publish_allowed | bool }}"
        then:
          - action: script.zendure_wire_publish_u2
            data:
              topic: !secret zendure_topic_u2_number_outputLimit_set
              payload: "{{ target }}"
              source: "{{ command_source }}"
              command_class: "output"
              generation: "{{ generation_value }}"
              desired_entity: "{{ 'input_number.zendure_last_sent_2' if coalesce_mode | bool else '' }}"
              desired_type: "number"
              expected_value: "{{ target }}"
              output_tokens_after: "{{ tokens_after_publish }}"
              output_budget_before: "{{ bucket_refilled }}"
              output_force: "{{ force_mode }}"
              output_safety_zero: "{{ safety_zero_mode }}"
              output_ensure_mode: "{{ ensure_mode }}"
              output_reassert_mode: "{{ reassert_mode }}"
              output_peer_reservation: "{{ peer_reserved_input }}"
              output_peer_reservation_validated: "{{ peer_reserved_validated }}"
              output_coalesce_latest: "{{ coalesce_mode }}"

      - if:
          - condition: template
            value_template: "{{ publish_needed | bool and not publish_allowed | bool }}"
        then:
          - action: script.zendure_store_deferred_u2
            data:
              target: "{{ target }}"
              force: "{{ force_mode }}"
              safety_zero: "{{ safety_zero_mode }}"
              ensure_output_mode: "{{ ensure_mode }}"
              reassert_output_mode: "{{ reassert_mode }}"
              generation: "{{ generation_value }}"
              source: "{{ command_source }}"
              peer_reservation: "{{ peer_reserved_input }}"
              peer_reservation_validated: "{{ peer_reserved_validated }}"
              coalesce_latest: "{{ coalesce_mode }}"
              duration: "{{ token_wait_seconds | int(1) }}"
  zendure_clear_pending_transfer:
    alias: "Zendure: Clear Pending Unit Transfer"
    mode: restart
    max_exceeded: silent
    sequence:
      - action: timer.cancel
        target:
          entity_id:
            - timer.zendure_transfer_timeout
            - timer.zendure_transfer_retry
      - if:
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.zendure_transfer_pending','on')
                 or states('input_text.zendure_transfer_lower_unit') != 'none'
                 or states('input_number.zendure_transfer_target_u1') | int(0) != 0
                 or states('input_number.zendure_transfer_target_u2') | int(0) != 0 }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_transfer_pending }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_transfer_lower_unit }
            data: { value: "none" }
          - parallel:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_generation }
                data: { value: 0 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_target_u1 }
                data: { value: 0 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_target_u2 }
                data: { value: 0 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_start_effective_u1 }
                data: { value: 0 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_start_effective_u2 }
                data: { value: 0 }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_transfer_started }
                data: { timestamp: 0 }

  zendure_dispatch_output_pair:
    alias: "Zendure: Dispatch Output Pair Split-Loop"
    mode: restart
    max_exceeded: silent
    fields:
      target_1: { description: "Final U1 output target" }
      target_2: { description: "Final U2 output target" }
      send_1: { description: "Dispatch U1" }
      send_2: { description: "Dispatch U2" }
      force_1: { description: "Force U1 dispatch" }
      force_2: { description: "Force U2 dispatch" }
      ensure_mode_1: { description: "Ensure U1 Output mode" }
      ensure_mode_2: { description: "Ensure U2 Output mode" }
      reassert_mode_1: { description: "Re-assert U1 Output mode" }
      reassert_mode_2: { description: "Re-assert U2 Output mode" }
      generation: { description: "Dispatch generation" }
      update_desired_1: { description: "Update U1 regulator Desired target" }
      update_desired_2: { description: "Update U2 regulator Desired target" }
      allow_pending_transfer: { description: "Permit lower-first event-driven transfer" }
      cancel_pending_transfer: { description: "Invalidate an older pending transfer" }
      source: { description: "Diagnostic source label" }
      emergency_zero_1: { description: "Use priority one-shot zero writer for U1" }
      emergency_zero_2: { description: "Use priority one-shot zero writer for U2" }
    sequence:
      - variables:
          unit_dispatch_limit: >-
            {{ [[states('input_number.zendure_conf_max_output_per_unit') | int(800), 0] | max, 800] | min }}
          configured_global_dispatch_limit: >-
            {{ [[states('input_number.zendure_conf_max_output') | int(1000), 0] | max, 1000] | min }}
          global_dispatch_limit: >-
            {{ [configured_global_dispatch_limit | int(1000),
                (unit_dispatch_limit | int(800)) * 2] | min }}
          requested_t1_raw: >-
            {{ [0, [target_1 | int(0), unit_dispatch_limit | int(800)] | min] | max }}
          requested_t2_raw: >-
            {{ [0, [target_2 | int(0), unit_dispatch_limit | int(800)] | min] | max }}
          # Floor quantization never exceeds a safety cap or the requested target.
          requested_t1: "{{ ((requested_t1_raw | int(0)) // 5) * 5 }}"
          requested_t2: "{{ ((requested_t2_raw | int(0)) // 5) * 5 }}"
          requested_do1: "{{ send_1 | default(false) | bool }}"
          requested_do2: "{{ send_2 | default(false) | bool }}"
          f1: "{{ force_1 | default(false) | bool }}"
          f2: "{{ force_2 | default(false) | bool }}"
          em1: "{{ ensure_mode_1 | default(true) | bool }}"
          em2: "{{ ensure_mode_2 | default(true) | bool }}"
          rm1: "{{ reassert_mode_1 | default(false) | bool }}"
          rm2: "{{ reassert_mode_2 | default(false) | bool }}"
          gen: "{{ generation | int(-1) }}"
          ud1: "{{ update_desired_1 | default(true) | bool }}"
          ud2: "{{ update_desired_2 | default(true) | bool }}"
          permit_transfer: "{{ allow_pending_transfer | default(true) | bool }}"
          cancel_old_transfer: "{{ cancel_pending_transfer | default(true) | bool }}"
          dispatch_source: "{{ source | default('unspecified') }}"
          emergency_zero1: "{{ emergency_zero_1 | default(false) | bool }}"
          emergency_zero2: "{{ emergency_zero_2 | default(false) | bool }}"
          coalesce_normal: "{{ dispatch_source in ['fast_total','slow_balance'] }}"
          transfer_timeout_base: "{{ states('input_number.zendure_conf_transfer_timeout_s') | int(30) }}"
          output_interval_count1: "{{ state_attr('sensor.solarflow_1_mqtt_freshness','output_power_interval_count') | int(0) }}"
          output_interval_count2: "{{ state_attr('sensor.solarflow_2_mqtt_freshness','output_power_interval_count') | int(0) }}"
          output_recent_max1: "{{ state_attr('sensor.solarflow_1_mqtt_freshness','output_power_recent_max_interval_s') | float(0) }}"
          output_recent_max2: "{{ state_attr('sensor.solarflow_2_mqtt_freshness','output_power_recent_max_interval_s') | float(0) }}"
          transfer_timeout_u1: >-
            {% set cold_base = 90 if output_interval_count1 | int(0) < 3 else transfer_timeout_base | int(30) %}
            {{ [90, [cold_base, (output_recent_max1 | float(0) * 1.25 + 2) | int(cold_base)] | max] | min }}
          transfer_timeout_u2: >-
            {% set cold_base = 90 if output_interval_count2 | int(0) < 3 else transfer_timeout_base | int(30) %}
            {{ [90, [cold_base, (output_recent_max2 | float(0) * 1.25 + 2) | int(cold_base)] | max] | min }}

          desired_now1: "{{ [states('input_number.zendure_last_sent_1') | int(0), 0] | max }}"
          desired_now2: "{{ [states('input_number.zendure_last_sent_2') | int(0), 0] | max }}"
          dispatched_now1: "{{ [states('input_number.zendure_last_dispatched_1') | int(0), 0] | max }}"
          dispatched_now2: "{{ [states('input_number.zendure_last_dispatched_2') | int(0), 0] | max }}"
          confirmed_now1: "{{ [states('input_number.zendure_confirmed_output_1') | int(0), 0] | max }}"
          confirmed_now2: "{{ [states('input_number.zendure_confirmed_output_2') | int(0), 0] | max }}"
          output_ts1: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
          output_ts2: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) }}"
          output_age1: "{{ as_timestamp(now()) - output_ts1 | float(0) }}"
          output_age2: "{{ as_timestamp(now()) - output_ts2 | float(0) }}"
          actual_fresh1: "{{ output_age1 | float(9999) < 12 and is_number(states('sensor.solarflow_1_output_power')) }}"
          actual_fresh2: "{{ output_age2 | float(9999) < 12 and is_number(states('sensor.solarflow_2_output_power')) }}"
          limit_ts1: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) }}"
          limit_ts2: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) }}"
          confirmed_fresh1: "{{ limit_ts1 > 1 and (as_timestamp(now()) - limit_ts1) < 30 }}"
          confirmed_fresh2: "{{ limit_ts2 > 1 and (as_timestamp(now()) - limit_ts2) < 30 }}"
          effective1: >-
            {{ [dispatched_now1 | int(0),
                (confirmed_now1 | int(0) if confirmed_fresh1 | bool else 0),
                (states('sensor.solarflow_1_output_power') | int(0) if actual_fresh1 | bool else 0), 0] | max }}
          effective2: >-
            {{ [dispatched_now2 | int(0),
                (confirmed_now2 | int(0) if confirmed_fresh2 | bool else 0),
                (states('sensor.solarflow_2_output_power') | int(0) if actual_fresh2 | bool else 0), 0] | max }}

          requested_sum: "{{ (requested_t1 | int(0)) + (requested_t2 | int(0)) }}"
          dispatch_scale: >-
            {{ (global_dispatch_limit | float(1000)) / (requested_sum | float(1))
               if requested_do1 | bool and requested_do2 | bool
                  and requested_sum | int(0) > global_dispatch_limit | int(1000)
                  and requested_sum | int(0) > 0
               else 1 }}
          base_t1: >-
            {% set limit = global_dispatch_limit | int(1000) %}
            {% if requested_do1 | bool and requested_do2 | bool %}
              {{ (requested_t1 | int(0) * dispatch_scale | float(1)) | int(0) }}
            {% elif requested_do1 | bool %}
              {{ [requested_t1 | int(0), [limit - effective2 | int(0), 0] | max] | min }}
            {% else %}
              {{ [effective1 | int(0), unit_dispatch_limit | int(800)] | min }}
            {% endif %}
          base_t2: >-
            {% set limit = global_dispatch_limit | int(1000) %}
            {% if requested_do1 | bool and requested_do2 | bool %}
              {{ [(requested_t2 | int(0) * dispatch_scale | float(1)) | int(0),
                  limit - (base_t1 | int(0))] | min | int(0) }}
            {% elif requested_do2 | bool %}
              {{ [requested_t2 | int(0), [limit - effective1 | int(0), 0] | max] | min }}
            {% else %}
              {{ [effective2 | int(0), unit_dispatch_limit | int(800)] | min }}
            {% endif %}

          mode_needed1: >-
            {{ em1 | bool and (rm1 | bool or states('sensor.solarflow_1_ac_mode') != 'Output mode'
               or states('input_text.zendure_ac_mode_u1') != 'Output mode') }}
          mode_needed2: >-
            {{ em2 | bool and (rm2 | bool or states('sensor.solarflow_2_ac_mode') != 'Output mode'
               or states('input_text.zendure_ac_mode_u2') != 'Output mode') }}
          # Confirmed mismatch is deliberately excluded here. ACK Recovery
          # owns all unchanged-target retries, preventing two writers from fighting.
          dispatch_needed1: >-
            {{ requested_do1 | bool and (f1 | bool or mode_needed1 | bool
               or base_t1 | int(0) != dispatched_now1 | int(0)) }}
          dispatch_needed2: >-
            {{ requested_do2 | bool and (f2 | bool or mode_needed2 | bool
               or base_t2 | int(0) != dispatched_now2 | int(0)) }}
          lower1: "{{ requested_do1 | bool and base_t1 | int(0) < effective1 | int(0) }}"
          lower2: "{{ requested_do2 | bool and base_t2 | int(0) < effective2 | int(0) }}"
          raise1: "{{ requested_do1 | bool and base_t1 | int(0) > effective1 | int(0) }}"
          raise2: "{{ requested_do2 | bool and base_t2 | int(0) > effective2 | int(0) }}"
          transfer_u2_to_u1: >-
            {{ permit_transfer | bool and requested_do1 | bool and requested_do2 | bool
               and raise1 | bool and lower2 | bool
               and (base_t1 | int(0) + effective2 | int(0)) > global_dispatch_limit | int(1000) }}
          transfer_u1_to_u2: >-
            {{ permit_transfer | bool and requested_do1 | bool and requested_do2 | bool
               and raise2 | bool and lower1 | bool
               and (base_t2 | int(0) + effective1 | int(0)) > global_dispatch_limit | int(1000) }}
          transfer_needed: "{{ transfer_u2_to_u1 | bool or transfer_u1_to_u2 | bool }}"
          transfer_state_present: >-
            {{ is_state('input_boolean.zendure_transfer_pending','on')
               or states('input_text.zendure_transfer_lower_unit') != 'none'
               or states('input_number.zendure_transfer_target_u1') | int(0) != 0
               or states('input_number.zendure_transfer_target_u2') | int(0) != 0 }}
          reserve_for_u1: >-
            {{ [effective2 | int(0), (base_t2 | int(0) if requested_do2 | bool else effective2 | int(0)), 0] | max }}
          reserve_for_u2: >-
            {{ [effective1 | int(0), (base_t1 | int(0) if requested_do1 | bool else effective1 | int(0)), 0] | max }}

      - if:
          - condition: template
            value_template: "{{ gen >= 0 and gen != states('input_number.zendure_dispatch_generation') | int(0) }}"
        then:
          - stop: "Stale pair generation dropped before split-loop dispatch."

      - if:
          - condition: template
            value_template: >-
              {{ transfer_state_present | bool and
                 (cancel_old_transfer | bool or transfer_needed | bool
                  or not is_state('input_boolean.zendure_transfer_pending','on')) }}
        then:
          - action: script.zendure_clear_pending_transfer

      # Desired is intent only and is independent of the lower-first physical stage.
      - parallel:
          - if:
              - condition: template
                value_template: "{{ requested_do1 | bool and ud1 | bool and base_t1 | int(0) != desired_now1 | int(0) }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_1 }
                data: { value: "{{ base_t1 | int(0) }}" }
          - if:
              - condition: template
                value_template: "{{ requested_do2 | bool and ud2 | bool and base_t2 | int(0) != desired_now2 | int(0) }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_2 }
                data: { value: "{{ base_t2 | int(0) }}" }

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ transfer_u2_to_u1 | bool }}"
            sequence:
              # Pending stays OFF while metadata and the physical lower command are committed.
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_transfer_pending }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_target_u1 }
                data: { value: "{{ base_t1 | int(0) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_target_u2 }
                data: { value: "{{ base_t2 | int(0) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_start_effective_u1 }
                data: { value: "{{ effective1 | int(0) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_start_effective_u2 }
                data: { value: "{{ effective2 | int(0) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_generation }
                data: { value: "{{ gen | int(0) }}" }
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_transfer_lower_unit }
                data: { value: "u2" }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_transfer_started }
                data: { timestamp: "{{ now().timestamp() }}" }
              - if:
                  - condition: template
                    value_template: "{{ gen >= 0 and gen != states('input_number.zendure_dispatch_generation') | int(0) }}"
                then:
                  - action: script.zendure_clear_pending_transfer
                  - stop: "Transfer U2->U1 invalidated before lower publish."
              - action: script.zendure_dispatch_u2_output
                data:
                  power: "{{ base_t2 | int(0) }}"
                  ensure_output_mode: "{{ em2 }}"
                  force: true
                  reassert_output_mode: "{{ rm2 }}"
                  generation: "{{ gen }}"
                  update_desired: false
                  coalesce_latest: false
                  peer_reservation: "{{ reserve_for_u2 | int(0) }}"
                  source: "{{ dispatch_source }}_transfer_lower"
              - if:
                  - condition: template
                    value_template: >-
                      {{ (gen >= 0 and gen != states('input_number.zendure_dispatch_generation') | int(0))
                          or states('input_number.zendure_last_dispatched_2') | int(-1) != base_t2 | int(0) }}
                then:
                  - action: script.zendure_clear_pending_transfer
                  - stop: "Transfer U2->U1 lower command was stale or writer-budget deferred."
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_transfer_pending }
              - action: timer.start
                target: { entity_id: timer.zendure_transfer_timeout }
                data: { duration: "{{ transfer_timeout_u2 | int(30) }}" }

          - conditions:
              - condition: template
                value_template: "{{ transfer_u1_to_u2 | bool }}"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_transfer_pending }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_target_u1 }
                data: { value: "{{ base_t1 | int(0) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_target_u2 }
                data: { value: "{{ base_t2 | int(0) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_start_effective_u1 }
                data: { value: "{{ effective1 | int(0) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_start_effective_u2 }
                data: { value: "{{ effective2 | int(0) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_transfer_generation }
                data: { value: "{{ gen | int(0) }}" }
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_transfer_lower_unit }
                data: { value: "u1" }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_transfer_started }
                data: { timestamp: "{{ now().timestamp() }}" }
              - if:
                  - condition: template
                    value_template: "{{ gen >= 0 and gen != states('input_number.zendure_dispatch_generation') | int(0) }}"
                then:
                  - action: script.zendure_clear_pending_transfer
                  - stop: "Transfer U1->U2 invalidated before lower publish."
              - action: script.zendure_dispatch_u1_output
                data:
                  power: "{{ base_t1 | int(0) }}"
                  ensure_output_mode: "{{ em1 }}"
                  force: true
                  reassert_output_mode: "{{ rm1 }}"
                  generation: "{{ gen }}"
                  update_desired: false
                  coalesce_latest: false
                  peer_reservation: "{{ reserve_for_u1 | int(0) }}"
                  source: "{{ dispatch_source }}_transfer_lower"
              - if:
                  - condition: template
                    value_template: >-
                      {{ (gen >= 0 and gen != states('input_number.zendure_dispatch_generation') | int(0))
                          or states('input_number.zendure_last_dispatched_1') | int(-1) != base_t1 | int(0) }}
                then:
                  - action: script.zendure_clear_pending_transfer
                  - stop: "Transfer U1->U2 lower command was stale or writer-budget deferred."
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_transfer_pending }
              - action: timer.start
                target: { entity_id: timer.zendure_transfer_timeout }
                data: { duration: "{{ transfer_timeout_u1 | int(30) }}" }

        default:
          - parallel:
              - if:
                  - condition: template
                    value_template: "{{ dispatch_needed1 | bool }}"
                then:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ emergency_zero1 | bool and base_t1 | int(0) == 0 }}"
                        sequence:
                          - action: script.zendure_dispatch_u1_emergency_zero
                            data:
                              generation: "{{ gen }}"
                              update_desired: false
                              source: "{{ dispatch_source }}"
                    default:
                      - action: script.zendure_dispatch_u1_output
                        data:
                          power: "{{ base_t1 | int(0) }}"
                          ensure_output_mode: "{{ em1 }}"
                          force: "{{ f1 }}"
                          reassert_output_mode: "{{ rm1 }}"
                          generation: "{{ gen }}"
                          update_desired: false
                          coalesce_latest: "{{ coalesce_normal }}"
                          peer_reservation: "{{ reserve_for_u1 | int(0) }}"
                          source: "{{ dispatch_source }}"
              - if:
                  - condition: template
                    value_template: "{{ dispatch_needed2 | bool }}"
                then:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ emergency_zero2 | bool and base_t2 | int(0) == 0 }}"
                        sequence:
                          - action: script.zendure_dispatch_u2_emergency_zero
                            data:
                              generation: "{{ gen }}"
                              update_desired: false
                              source: "{{ dispatch_source }}"
                    default:
                      - action: script.zendure_dispatch_u2_output
                        data:
                          power: "{{ base_t2 | int(0) }}"
                          ensure_output_mode: "{{ em2 }}"
                          force: "{{ f2 }}"
                          reassert_output_mode: "{{ rm2 }}"
                          generation: "{{ gen }}"
                          update_desired: false
                          coalesce_latest: "{{ coalesce_normal }}"
                          peer_reservation: "{{ reserve_for_u2 | int(0) }}"
                          source: "{{ dispatch_source }}"

