          output_power_max_interval_s: >
            {% set previous_max = this.attributes.get('output_power_max_interval_s', 0) | float(0) %}
            {% set previous_ts = as_timestamp(this.attributes.get('output_power_ts', '1970-01-01T00:00:00+00:00'), 0) %}
            {% set current = (as_timestamp(now()) - previous_ts) if trigger.id == 'output_power' and previous_ts > 1 else 0 %}
            {{ 0 if trigger.id == 'startup_reset' else [previous_max, current] | max | round(3) }}
          output_power_ts: >
            {{ '1970-01-01T00:00:00+00:00' if trigger.id == 'startup_reset'
               else now().isoformat() if trigger.id == 'output_power'
               else this.attributes.get('output_power_ts', '1970-01-01T00:00:00+00:00') }}
          output_limit_ts: >
            {{ '1970-01-01T00:00:00+00:00' if trigger.id == 'startup_reset'
               else now().isoformat() if trigger.id == 'output_limit'
               else this.attributes.get('output_limit_ts', '1970-01-01T00:00:00+00:00') }}
          solar_ts: >
            {{ '1970-01-01T00:00:00+00:00' if trigger.id == 'startup_reset'
               else now().isoformat() if trigger.id == 'solar'
               else this.attributes.get('solar_ts', '1970-01-01T00:00:00+00:00') }}
          soc_ts: >
            {{ '1970-01-01T00:00:00+00:00' if trigger.id == 'startup_reset'
               else now().isoformat() if trigger.id == 'soc'
               else this.attributes.get('soc_ts', '1970-01-01T00:00:00+00:00') }}
          vmin_ts: >
            {{ '1970-01-01T00:00:00+00:00' if trigger.id == 'startup_reset'
               else now().isoformat() if trigger.id == 'vmin'
               else this.attributes.get('vmin_ts', '1970-01-01T00:00:00+00:00') }}
          vmin_valid_ts: >
            {% set previous = this.attributes.get('vmin_valid_ts', '1970-01-01T00:00:00+00:00') %}
            {% if trigger.id == 'startup_reset' %}
              {{ '1970-01-01T00:00:00+00:00' }}
            {% elif trigger.id == 'vmin' %}
              {% set raw = trigger.payload | float(none) %}
              {% if raw is none %}{% set val = none %}
              {% elif raw > 2000 %}{% set val = raw / 1000 %}
              {% elif raw > 20 %}{% set val = raw / 100 %}
              {% else %}{% set val = raw %}{% endif %}
              {{ now().isoformat() if val is not none and val > 0.5 and val < 5.5 else previous }}
            {% else %}
              {{ previous }}
            {% endif %}
          battery_temp_ts: >
            {{ '1970-01-01T00:00:00+00:00' if trigger.id == 'startup_reset'
               else now().isoformat() if trigger.id == 'battery_temp'
               else this.attributes.get('battery_temp_ts', '1970-01-01T00:00:00+00:00') }}
          battery_temp_valid_ts: >
            {% set previous = this.attributes.get('battery_temp_valid_ts', '1970-01-01T00:00:00+00:00') %}
            {% if trigger.id == 'startup_reset' %}
              {{ '1970-01-01T00:00:00+00:00' }}
            {% elif trigger.id == 'battery_temp' %}
              {% set raw = trigger.payload | float(none) %}
              {% if raw is none %}{% set val = none %}
              {% elif raw > 1000 %}{% set val = (raw - 2731) / 10 %}
              {% elif raw > 150 %}{% set val = raw - 273.1 %}
              {% else %}{% set val = raw %}{% endif %}
              {{ now().isoformat() if val is not none and val >= -30 and val <= 90 else previous }}
            {% else %}
              {{ previous }}
            {% endif %}
          hub_temp_ts: >
            {{ '1970-01-01T00:00:00+00:00' if trigger.id == 'startup_reset'
               else now().isoformat() if trigger.id == 'hub_temp'
               else this.attributes.get('hub_temp_ts', '1970-01-01T00:00:00+00:00') }}
          hub_temp_valid_ts: >
            {% set previous = this.attributes.get('hub_temp_valid_ts', '1970-01-01T00:00:00+00:00') %}
            {% if trigger.id == 'startup_reset' %}
              {{ '1970-01-01T00:00:00+00:00' }}
            {% elif trigger.id == 'hub_temp' %}
              {% set raw = trigger.payload | float(none) %}
              {% if raw is none %}{% set val = none %}
              {% elif raw > 1000 %}{% set val = (raw - 2731) / 10 %}
              {% elif raw > 150 %}{% set val = raw - 273.1 %}
              {% else %}{% set val = raw %}{% endif %}
              {{ now().isoformat() if val is not none and val >= -30 and val <= 100 else previous }}
            {% else %}
              {{ previous }}
            {% endif %}

