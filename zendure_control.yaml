                    value_template: "{{ auto_off | bool and current_desired | int(0) != 0 }}"
                then:
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_last_sent_1 }
                    data: { value: 0 }
              - if:
                  - condition: template
