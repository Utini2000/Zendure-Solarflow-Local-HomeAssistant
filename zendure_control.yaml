          ts_mode: "{{ (state_attr('input_datetime.zendure_last_ac_mode_dispatch_ts_u1','timestamp') | float(0)) }}"
          since_mode: "{{ as_timestamp(now()) - ts_mode }}"
          mode_ok: "{{ since_mode > 20 }}"
          mode_same_recent: >-
            {{ states('input_text.zendure_ac_mode_u1') == 'Output mode' and since_mode <= 20 }}
      - if:
          - condition: template
            value_template: >-
              {{ ensure_mode and (mode_mismatch or reassert_mode)
                  and not mode_same_recent and (mode_ok or force_mode or reassert_mode) }}
        then:
          - action: script.zendure_dispatch_u1_ac_mode
