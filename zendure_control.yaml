          {% elif not batt_temp_valid and not hub_temp_valid %} temperature_both_invalid
          {% elif batt_temp_valid and (is_state('input_boolean.zendure_batt_temp_cooldown_u2','on') or batt_temp >= 58) %} battery_temp_cooldown_58
          {% elif hub_temp_valid and (is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') or hub_temp >= 65) %} hub_temp_cooldown_65
          {% elif batt_temp_valid and batt_temp >= 55 %} battery_temp_pv_only_55
          {% elif batt_temp_valid and batt_temp >= 53 %} battery_temp_softcap_53
          {% elif batt_temp_valid and batt_temp >= 50 %} battery_temp_softcap_50
          {% elif hub_temp_valid and hub_temp >= 62 %} hub_temp_softcap_62
          {% elif hub_temp_valid and hub_temp >= 60 %} hub_temp_softcap_60
          {% elif hub_temp_valid and hub_temp >= 58 %} hub_temp_softcap_58
          {% elif hub_temp_valid and hub_temp >= 55 %} hub_temp_softcap_55
          {% elif not batt_temp_valid %} temperature_degraded_battery_missing
          {% elif not hub_temp_valid %} temperature_degraded_hub_missing
          {% else %} freigegeben {% endif %}
      - name: "SolarFlow 1 Charge Temperature Cap"
        unique_id: solarflow_1_charge_temperature_cap
        default_entity_id: sensor.solarflow_1_charge_temperature_cap
        unit_of_measurement: "W"
        device_class: power
        state: >
          {% set batt_state = states('sensor.solarflow_1_battery_temp_control') %}
          {% set hub_state = states('sensor.solarflow_1_hub_temp_control') %}
          {% set batt_valid = is_number(batt_state) %}
          {% set hub_valid = is_number(hub_state) %}
          {% set batt = batt_state | float(999) %}
          {% set hub = hub_state | float(999) %}
          {% set single_cap = states('input_number.zendure_conf_single_temp_charge_cap') | int(150) %}
          {% if not batt_valid and not hub_valid %}
            0
          {% else %}
            {% set known_cold = batt if batt_valid else hub %}
            {% set cold_cap = 100 if known_cold < 5 else (300 if known_cold < 10 else 800) %}
            {% set batt_cap = 0 if is_state('input_boolean.zendure_batt_temp_cooldown_u1','on') else (0 if batt_valid and batt >= 55 else (100 if batt_valid and batt >= 53 else (300 if batt_valid and batt >= 50 else 800))) %}
            {% set hub_cap = 0 if is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') else (0 if hub_valid and hub >= 65 else (100 if hub_valid and hub >= 62 else (200 if hub_valid and hub >= 60 else (400 if hub_valid and hub >= 58 else (600 if hub_valid and hub >= 55 else 800))))) %}
            {% set degraded_cap = 800 if batt_valid and hub_valid else single_cap %}
            {{ [cold_cap | int, batt_cap | int, hub_cap | int, degraded_cap | int] | min }}
          {% endif %}
        attributes:
          temperature_mode: >
            {% set b = is_number(states('sensor.solarflow_1_battery_temp_control')) %}
            {% set h = is_number(states('sensor.solarflow_1_hub_temp_control')) %}
            {{ 'both' if b and h else 'battery_only' if b else 'hub_only' if h else 'none' }}

      - name: "SolarFlow 2 Charge Temperature Cap"
        unique_id: solarflow_2_charge_temperature_cap
        default_entity_id: sensor.solarflow_2_charge_temperature_cap
        unit_of_measurement: "W"
        device_class: power
        state: >
          {% set batt_state = states('sensor.solarflow_2_battery_temp_control') %}
          {% set hub_state = states('sensor.solarflow_2_hub_temp_control') %}
          {% set batt_valid = is_number(batt_state) %}
          {% set hub_valid = is_number(hub_state) %}
          {% set batt = batt_state | float(999) %}
          {% set hub = hub_state | float(999) %}
          {% set single_cap = states('input_number.zendure_conf_single_temp_charge_cap') | int(150) %}
          {% if not batt_valid and not hub_valid %}
            0
          {% else %}
            {% set known_cold = batt if batt_valid else hub %}
            {% set cold_cap = 100 if known_cold < 5 else (300 if known_cold < 10 else 800) %}
            {% set batt_cap = 0 if is_state('input_boolean.zendure_batt_temp_cooldown_u2','on') else (0 if batt_valid and batt >= 55 else (100 if batt_valid and batt >= 53 else (300 if batt_valid and batt >= 50 else 800))) %}
            {% set hub_cap = 0 if is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') else (0 if hub_valid and hub >= 65 else (100 if hub_valid and hub >= 62 else (200 if hub_valid and hub >= 60 else (400 if hub_valid and hub >= 58 else (600 if hub_valid and hub >= 55 else 800))))) %}
            {% set degraded_cap = 800 if batt_valid and hub_valid else single_cap %}
            {{ [cold_cap | int, batt_cap | int, hub_cap | int, degraded_cap | int] | min }}
          {% endif %}
        attributes:
          temperature_mode: >
            {% set b = is_number(states('sensor.solarflow_2_battery_temp_control')) %}
            {% set h = is_number(states('sensor.solarflow_2_hub_temp_control')) %}
            {{ 'both' if b and h else 'battery_only' if b else 'hub_only' if h else 'none' }}

      - name: "SolarFlow System Total Charge Power V24"
        unique_id: solarflow_system_total_charge_power_v24
        default_entity_id: sensor.solarflow_system_total_charge_power_v24
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set solar = states('sensor.solarflow_total_solar_input') | float(0) %}
          {% set grid_in = states('sensor.solarflow_total_grid_input') | float(0) %}
          {% set output = states('sensor.solarflow_system_total_output') | float(0) %}
          {% set total_in = solar + grid_in %}
          {% set diff = total_in - output %}
          {{ diff if diff > 0 else 0 }}

      - name: "SolarFlow System Total Discharge Power V24"
        unique_id: solarflow_system_total_discharge_power_v24
        default_entity_id: sensor.solarflow_system_total_discharge_power_v24
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set solar = states('sensor.solarflow_total_solar_input') | float(0) %}
          {% set grid_in = states('sensor.solarflow_total_grid_input') | float(0) %}
          {% set output = states('sensor.solarflow_system_total_output') | float(0) %}
          {% set total_in = solar + grid_in %}
          {% set diff = output - total_in %}
          {{ diff if diff > 0 else 0 }}

      - name: "SolarFlow Remaining Energy"
        unique_id: solarflow_remaining_energy_wh
        default_entity_id: sensor.solarflow_remaining_energy
        unit_of_measurement: "Wh"
        state: >
          {% set soc1 = states('sensor.solarflow_1_battery_level') | float(0) %}
          {% set soc2 = states('sensor.solarflow_2_battery_level') | float(0) %}
          {% set c1 = states('input_number.zendure_conf_u1_capacity_wh') | float(1920) %}
          {% set c2 = states('input_number.zendure_conf_u2_capacity_wh') | float(1920) %}
          {% set wh1 = (c1 * soc1 / 100) %}
          {% set wh2 = (c2 * soc2 / 100) %}
          {{ [wh1 + wh2, 0] | max | round(0) }}

      - name: "SolarFlow Remaining Usable Energy"
        unique_id: solarflow_remaining_usable_energy_wh
        default_entity_id: sensor.solarflow_remaining_usable_energy
        unit_of_measurement: "Wh"
        state: >
          {% set soc1 = states('sensor.solarflow_1_battery_level') | float(0) %}
          {% set soc2 = states('sensor.solarflow_2_battery_level') | float(0) %}
          {% set c1 = states('input_number.zendure_conf_u1_capacity_wh') | float(1920) %}
          {% set c2 = states('input_number.zendure_conf_u2_capacity_wh') | float(1920) %}
          {% set soc_off = states('input_number.zendure_conf_soc_off') | float(20) %}
          {% set usable1 = c1 * ((soc1 - soc_off) / 100) %}
          {% set usable2 = c2 * ((soc2 - soc_off) / 100) %}
          {{ [usable1 + usable2, 0] | max | round(0) }}

