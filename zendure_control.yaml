  - alias: "Zendure: Emergency Zero Bypass Rearm"
    id: "zendure_emergency_zero_bypass_rearm"
    mode: parallel
    max: 2
    max_exceeded: warning
    initial_state: true
    triggers:
      - trigger: template
        id: u1
        value_template: >-
          {% set dispatch_ts = (state_attr('input_datetime.zendure_last_dispatch_ts_u1','timestamp') | float(0)) %}
          {% set emergency_ts = (state_attr('input_datetime.zendure_last_emergency_zero_ts_u1','timestamp') | float(0)) %}
          {% set limit_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) %}
          {% set output_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) %}
          {% set target = states('input_number.zendure_last_dispatched_1') | int(0) %}
          {% set positive_command_after_zero = target > 0 and dispatch_ts > emergency_ts and emergency_ts > 1 %}
          {% set positive_confirmed = positive_command_after_zero
             and states('input_number.zendure_confirmed_output_1') | int(-1) == target
             and limit_ts >= dispatch_ts %}
          {% set positive_actual = positive_command_after_zero
             and output_ts >= dispatch_ts and (as_timestamp(now()) - output_ts) < 20
             and states('sensor.solarflow_1_output_power') | float(0) > 30 %}
          {% set block_reason = states('sensor.solarflow_1_output_block_reason') | lower %}
          {% set unsafe_reasons = ['unknown','unavailable','status_offline','heartbeat_stale','telemetry_initializing','soc_invalid',
             'vmin_stale','vmin_invalid','vmin_hard_guard','vmin_early_stop','soc_off_guard','bypass_wait_restart','vmin_pv_only_guard',
             'battery_temp_stale','hub_temp_stale','battery_temp_invalid','hub_temp_invalid','temperature_both_stale',
             'temperature_both_invalid','data_invalid','battery_temp_cooldown_58','hub_temp_cooldown_65',
             'emergency_charge','calibration_mode','discharging_calib','vguard_latch'] %}
          {{ is_state('input_boolean.zendure_emergency_zero_bypass_used_u1','on')
             and is_state('input_boolean.zendure_runtime_writers_ready','on')
             and is_state('input_boolean.zendure_auto_mode','on')
             and states('sensor.solarflow_1_status_raw') | upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
             and block_reason not in unsafe_reasons
             and is_state('input_boolean.zendure_emergency_u1','off')
             and is_state('input_boolean.zendure_calib_mode_u1','off')
             and is_state('input_boolean.zendure_calib_discharge_u1','off')
             and is_state('input_boolean.zendure_vguard_u1','off')
             and is_state('input_boolean.zendure_bypass_u1','off')
             and is_state('input_boolean.zendure_batt_temp_cooldown_u1','off')
             and is_state('input_boolean.zendure_hub_temp_cooldown_u1','off')
             and (positive_confirmed or positive_actual) }}
        for: "00:00:10"
      - trigger: template
        id: u2
        value_template: >-
          {% set dispatch_ts = (state_attr('input_datetime.zendure_last_dispatch_ts_u2','timestamp') | float(0)) %}
          {% set emergency_ts = (state_attr('input_datetime.zendure_last_emergency_zero_ts_u2','timestamp') | float(0)) %}
          {% set limit_ts = as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) %}
          {% set output_ts = as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) %}
          {% set target = states('input_number.zendure_last_dispatched_2') | int(0) %}
          {% set positive_command_after_zero = target > 0 and dispatch_ts > emergency_ts and emergency_ts > 1 %}
          {% set positive_confirmed = positive_command_after_zero
             and states('input_number.zendure_confirmed_output_2') | int(-1) == target
             and limit_ts >= dispatch_ts %}
          {% set positive_actual = positive_command_after_zero
             and output_ts >= dispatch_ts and (as_timestamp(now()) - output_ts) < 20
             and states('sensor.solarflow_2_output_power') | float(0) > 30 %}
          {% set block_reason = states('sensor.solarflow_2_output_block_reason') | lower %}
          {% set unsafe_reasons = ['unknown','unavailable','status_offline','heartbeat_stale','telemetry_initializing','soc_invalid',
             'vmin_stale','vmin_invalid','vmin_hard_guard','vmin_early_stop','soc_off_guard','bypass_wait_restart','vmin_pv_only_guard',
             'battery_temp_stale','hub_temp_stale','battery_temp_invalid','hub_temp_invalid','temperature_both_stale',
             'temperature_both_invalid','data_invalid','battery_temp_cooldown_58','hub_temp_cooldown_65',
             'emergency_charge','calibration_mode','discharging_calib','vguard_latch'] %}
          {{ is_state('input_boolean.zendure_emergency_zero_bypass_used_u2','on')
             and is_state('input_boolean.zendure_runtime_writers_ready','on')
             and is_state('input_boolean.zendure_auto_mode','on')
             and states('sensor.solarflow_2_status_raw') | upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
             and block_reason not in unsafe_reasons
             and is_state('input_boolean.zendure_emergency_u2','off')
             and is_state('input_boolean.zendure_calib_mode_u2','off')
             and is_state('input_boolean.zendure_calib_discharge_u2','off')
             and is_state('input_boolean.zendure_vguard_u2','off')
             and is_state('input_boolean.zendure_bypass_u2','off')
             and is_state('input_boolean.zendure_batt_temp_cooldown_u2','off')
             and is_state('input_boolean.zendure_hub_temp_cooldown_u2','off')
             and (positive_confirmed or positive_actual) }}
        for: "00:00:10"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u1' }}"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_emergency_zero_bypass_used_u1 }
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u2' }}"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_emergency_zero_bypass_used_u2 }
  # Ordered per-unit MQTT readback synchronization: U1 and U2 stay independent,
  # while readbacks for the same unit are processed in broker arrival order.
  - alias: "Zendure: Sync Confirmed Output MQTT U1"
    id: "zendure_sync_confirmed_output_mqtt_u1"
    mode: queued
    max: 10
    max_exceeded: warning
    initial_state: true
    triggers:
      - trigger: mqtt
        topic: !secret zendure_topic_u1_number_outputLimit
        variables:
          mqtt_received_ts: "{{ as_timestamp(now()) }}"
    conditions:
      - condition: template
        value_template: "{{ trigger.payload is defined and is_number(trigger.payload) }}"
    actions:
      - variables:
          received_ts: "{{ mqtt_received_ts | float(0) }}"
          readback: "{{ [[trigger.payload | int(0), 0] | max, 800] | min }}"
          desired: "{{ states('input_number.zendure_last_sent_1') | int(0) }}"
          dispatched: "{{ states('input_number.zendure_last_dispatched_1') | int(0) }}"
          pending_ts: "{{ state_attr('input_datetime.zendure_output_pending_since_u1','timestamp') | float(0) }}"
          dispatch_ts: "{{ state_attr('input_datetime.zendure_last_dispatch_ts_u1','timestamp') | float(0) }}"
          auto_on: "{{ is_state('input_boolean.zendure_auto_mode','on') }}"
          status_age: >-
            {{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','status_ts'), 0) }}
          status_ok: >-
            {{ states('sensor.solarflow_1_status_raw') | upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
               and status_age | float(9999) < 300 }}
          output_ts: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
          actual_valid: >-
            {{ output_ts | float(0) > 1
               and (as_timestamp(now()) - output_ts | float(0)) < 20
               and is_number(states('sensor.solarflow_1_output_power')) }}
          actual_output: "{{ states('sensor.solarflow_1_output_power') | float(0) if actual_valid | bool else 0 }}"
          grid_valid: "{{ is_number(states('sensor.zendure_grid_power')) }}"
          grid_now: "{{ states('sensor.zendure_grid_power') | float(0) if grid_valid | bool else 0 }}"
          grid_bias: "{{ states('input_number.zendure_conf_grid_bias') | float(10) }}"
          export_unresolved: >-
            {{ grid_valid | bool
               and (is_state('binary_sensor.solarflow_persistent_export_guard','on')
                    or grid_now | float(0) < grid_bias | float(10) - 50) }}
          physical_zero: "{{ actual_valid | bool and actual_output | float(0) <= 30 }}"
          zero_ack_safe: >-
            {{ dispatched | int(0) != 0
               or physical_zero | bool
               or (not actual_valid | bool and grid_valid | bool and not export_unresolved | bool) }}
          ack_match: >-
            {{ pending_ts | float(0) > 1
               and dispatch_ts | float(0) > 1
               and received_ts | float(0) >= dispatch_ts | float(0)
               and readback | int(0) == dispatched | int(0)
               and zero_ack_safe | bool
               and (auto_on | bool or dispatched | int(0) == 0) }}
          zero_still_needed: >-
            {{ (not auto_on | bool or desired | int(0) == 0)
               and (readback | int(0) > 0
                    or (actual_valid | bool and actual_output | float(0) > 30)
                    or (not actual_valid | bool and export_unresolved | bool)) }}
          deferred_zero_active: >-
            {{ is_state('timer.zendure_writer_deferred_u1','active')
               or is_state('input_boolean.zendure_deferred_safety_zero_u1','on') }}
          zero_new_episode: >-
            {{ zero_still_needed | bool
               and pending_ts | float(0) <= 1
               and not deferred_zero_active | bool }}
          zero_pending_timer_missing: >-
            {{ zero_still_needed | bool
               and pending_ts | float(0) > 1
               and not is_state('timer.zendure_ack_retry_u1','active') }}
          pending_age: >-
            {{ [received_ts | float(0) - pending_ts | float(0), 0] | max
               if pending_ts | float(0) > 1 else 0 }}
          retry_interval: "{{ 10 if pending_age | float(0) < 60 else 30 if pending_age | float(0) < 300 else 60 }}"
          since_dispatch: >-
            {{ [received_ts | float(0) - dispatch_ts | float(0), 0] | max
               if dispatch_ts | float(0) > 1 else 0 }}
          zero_timer_delay: >-
            {% if not actual_valid | bool and not grid_valid | bool
                  and since_dispatch | float(0) >= retry_interval | float(10) %}
              {{ retry_interval | int(10) }}
            {% else %}
              {{ [1, retry_interval | int(10) - since_dispatch | int(0)] | max }}
            {% endif %}
      - condition: template
        value_template: "{{ status_ok }}"
      - if:
          - condition: template
            value_template: "{{ readback != states('input_number.zendure_confirmed_output_1') | int(-1) }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_confirmed_output_1 }
            data: { value: "{{ readback }}" }
      - if:
          - condition: template
            value_template: "{{ ack_match | bool }}"
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_output_pending_since_u1 }
            data: { datetime: "1970-01-01 00:00:00" }
          - action: timer.cancel
            target: { entity_id: timer.zendure_ack_retry_u1 }
      - if:
          - condition: template
            value_template: "{{ not auto_on | bool and desired | int(0) != 0 }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_1 }
            data: { value: 0 }
      - if:
          - condition: template
            value_template: "{{ zero_new_episode | bool }}"
        then:
          - action: script.zendure_set_u1_outputlimit_zero
            data:
              source: "live_mqtt_zero_start"
      - if:
          - condition: template
            value_template: "{{ zero_pending_timer_missing | bool }}"
        then:
          - action: timer.start
            target: { entity_id: timer.zendure_ack_retry_u1 }
            data: { duration: "{{ zero_timer_delay | int(10) }}" }


