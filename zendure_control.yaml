  # --- V172 PERSISTENT EXPORT GUARD ---
  - binary_sensor:
      - name: "SolarFlow Persistent Export Guard"
        unique_id: solarflow_persistent_export_guard
        default_entity_id: binary_sensor.solarflow_persistent_export_guard
        device_class: problem
        state: >
          {{ is_number(states('sensor.zendure_grid_power')) and states('sensor.zendure_grid_power') | float(0) < -80 }}
        delay_on: "00:00:03"
        delay_off: "00:00:02"

      - name: "SolarFlow Persistent Import Guard"
        unique_id: solarflow_persistent_import_guard
        default_entity_id: binary_sensor.solarflow_persistent_import_guard
        device_class: problem
        state: >
          {% set bias = states('input_number.zendure_conf_grid_bias') | float(10) %}
          {{ is_number(states('sensor.zendure_grid_power'))
             and states('sensor.zendure_grid_power') | float(0) > bias + 150 }}
        delay_on: "00:00:03"
        delay_off: "00:00:02"

  - triggers:
      - trigger: state
        id: "eta_inputs_changed"
        entity_id:
          - sensor.solarflow_1_battery_level
          - sensor.solarflow_2_battery_level
          - sensor.solarflow_1_cell_min_vol
          - sensor.solarflow_2_cell_min_vol
          - input_boolean.zendure_bypass_u1
          - input_boolean.zendure_bypass_u2
          - input_boolean.zendure_emergency_u1
          - input_boolean.zendure_emergency_u2
          - input_boolean.zendure_vguard_u1
          - input_boolean.zendure_vguard_u2
          - input_boolean.zendure_calib_mode_u1
          - input_boolean.zendure_calib_mode_u2
          - input_boolean.zendure_calib_discharge_u1
          - input_boolean.zendure_calib_discharge_u2
          - input_boolean.zendure_batt_temp_cooldown_u1
          - input_boolean.zendure_batt_temp_cooldown_u2
          - input_boolean.zendure_hub_temp_cooldown_u1
          - input_boolean.zendure_hub_temp_cooldown_u2
          - sensor.solarflow_1_battery_temp_control
          - sensor.solarflow_2_battery_temp_control
          - sensor.solarflow_1_hub_temp_control
          - sensor.solarflow_2_hub_temp_control
          - input_number.zendure_conf_soc_off
          - input_number.zendure_conf_soc_bypass
          - input_number.zendure_conf_u1_capacity_wh
          - input_number.zendure_conf_u2_capacity_wh
          - sensor.power_consumption
          - sensor.solarflow_house_load_mean_15m
          - sensor.solarflow_system_total_output
          - sensor.solarflow_system_total_discharge_power_v24
          - sensor.solarflow_discharge_mean_60s
          - sensor.solarflow_discharge_mean_15m
          - sensor.zendure_grid_power

      - trigger: time_pattern
        id: "eta_tick"
        minutes: "/1"

    conditions:
      - condition: template
        value_template: >
          {{ has_value('sensor.solarflow_1_battery_level')
             and has_value('sensor.solarflow_2_battery_level') }}

    sensor:
      - name: "SolarFlow Remaining Time (5m Avg)"
        unique_id: solarflow_remaining_time_5m_avg_h
        default_entity_id: sensor.solarflow_remaining_time_5m_avg
        unit_of_measurement: "h"
        icon: mdi:timer-sand
        state: >
          {% set c1 = states('input_number.zendure_conf_u1_capacity_wh') | float(1920) %}
          {% set c2 = states('input_number.zendure_conf_u2_capacity_wh') | float(1920) %}
          {% set stop_soc = states('input_number.zendure_conf_soc_off') | float(20) %}
          {% set soc1 = states('sensor.solarflow_1_battery_level') | float(0) %}
          {% set soc2 = states('sensor.solarflow_2_battery_level') | float(0) %}
          {% set v1 = states('sensor.solarflow_1_cell_min_vol') | float(99) %}
          {% set v2 = states('sensor.solarflow_2_cell_min_vol') | float(99) %}
          {% set batt_t1 = states('sensor.solarflow_1_battery_temp_control') | float(999) %}
          {% set batt_t2 = states('sensor.solarflow_2_battery_temp_control') | float(999) %}
          {% set hub_t1 = states('sensor.solarflow_1_hub_temp_control') | float(999) %}
          {% set hub_t2 = states('sensor.solarflow_2_hub_temp_control') | float(999) %}

          {% set blocked1 =
               is_state('input_boolean.zendure_bypass_u1','on')
               or is_state('input_boolean.zendure_emergency_u1','on')
               or is_state('input_boolean.zendure_vguard_u1','on')
               or is_state('input_boolean.zendure_calib_mode_u1','on')
               or is_state('input_boolean.zendure_calib_discharge_u1','on')
               or is_state('input_boolean.zendure_batt_temp_cooldown_u1','on')
               or is_state('input_boolean.zendure_hub_temp_cooldown_u1','on')
               or (batt_t1 < 200 and batt_t1 >= 55)
               or (hub_t1 < 200 and hub_t1 >= 65)
               or soc1 <= stop_soc
               or v1 < 3.12 %}
          {% set blocked2 =
               is_state('input_boolean.zendure_bypass_u2','on')
               or is_state('input_boolean.zendure_emergency_u2','on')
               or is_state('input_boolean.zendure_vguard_u2','on')
               or is_state('input_boolean.zendure_calib_mode_u2','on')
               or is_state('input_boolean.zendure_calib_discharge_u2','on')
               or is_state('input_boolean.zendure_batt_temp_cooldown_u2','on')
               or is_state('input_boolean.zendure_hub_temp_cooldown_u2','on')
               or (batt_t2 < 200 and batt_t2 >= 55)
               or (hub_t2 < 200 and hub_t2 >= 65)
               or soc2 <= stop_soc
               or v2 < 3.12 %}

          {% set wh1 = 0 if blocked1 else c1 * ([soc1 - stop_soc, 0] | max) / 100 %}
          {% set wh2 = 0 if blocked2 else c2 * ([soc2 - stop_soc, 0] | max) / 100 %}
          {% set remaining_output_wh = [wh1 + wh2, 0] | max %}

          {% set load_avg_state = states('sensor.solarflow_house_load_mean_15m') %}
          {% set load_now_state = states('sensor.power_consumption') %}
          {% if is_number(load_avg_state) and load_avg_state | float(0) > 20 %}
            {% set house_w = load_avg_state | float(0) %}
          {% elif is_number(load_now_state) %}
            {% set house_w = load_now_state | float(0) %}
          {% else %}
            {% set meter = 'sensor.zendure_grid_power' %}
            {% set grid_w = states(meter) | float(0) %}
            {% set output_w = states('sensor.solarflow_system_total_output') | float(0) %}
            {% set house_w = [output_w + grid_w, 0] | max %}
          {% endif %}

          {% set dis15_state = states('sensor.solarflow_discharge_mean_15m') %}
          {% set dis60_state = states('sensor.solarflow_discharge_mean_60s') %}
          {% set dis_now = states('sensor.solarflow_system_total_discharge_power_v24') | float(0) %}
          {% set dis15 = dis15_state | float(0) if is_number(dis15_state) else 0 %}
          {% set dis60 = dis60_state | float(0) if is_number(dis60_state) else 0 %}

          {% set effective_w = [house_w, dis15, dis60, dis_now, 80] | max %}

          {% if remaining_output_wh <= 0 %}
            0.0
          {% else %}
            {{ (remaining_output_wh / effective_w) | round(1) }}
          {% endif %}

        attributes:
          based_on: "remaining energy until soc_off / max(house_consumption, battery_discharge, 80W)"
          note: "V172: ETA to soc_off; restart uses max(soc_bypass, soc_off+3); shows 0h when blocked, vmin < 3.12V, battery PV-only/cooldown is active, or hub cooldown is active."
          stop_soc: "{{ states('input_number.zendure_conf_soc_off') | float(20) }}"
          restart_soc: >
            {{ [states('input_number.zendure_conf_soc_bypass') | float(25),
                (states('input_number.zendure_conf_soc_off') | float(20)) + 3] | max }}
          remaining_output_usable_wh: >
            {% set c1 = states('input_number.zendure_conf_u1_capacity_wh') | float(1920) %}
            {% set c2 = states('input_number.zendure_conf_u2_capacity_wh') | float(1920) %}
            {% set stop_soc = states('input_number.zendure_conf_soc_off') | float(20) %}
            {% set soc1 = states('sensor.solarflow_1_battery_level') | float(0) %}
            {% set soc2 = states('sensor.solarflow_2_battery_level') | float(0) %}
            {% set v1 = states('sensor.solarflow_1_cell_min_vol') | float(99) %}
            {% set v2 = states('sensor.solarflow_2_cell_min_vol') | float(99) %}
            {% set batt_t1 = states('sensor.solarflow_1_battery_temp_control') | float(999) %}
            {% set batt_t2 = states('sensor.solarflow_2_battery_temp_control') | float(999) %}
            {% set hub_t1 = states('sensor.solarflow_1_hub_temp_control') | float(999) %}
            {% set hub_t2 = states('sensor.solarflow_2_hub_temp_control') | float(999) %}
            {% set blocked1 = is_state('input_boolean.zendure_bypass_u1','on') or is_state('input_boolean.zendure_emergency_u1','on') or is_state('input_boolean.zendure_vguard_u1','on') or is_state('input_boolean.zendure_calib_mode_u1','on') or is_state('input_boolean.zendure_calib_discharge_u1','on') or is_state('input_boolean.zendure_batt_temp_cooldown_u1','on') or is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') or (batt_t1 < 200 and batt_t1 >= 55) or (hub_t1 < 200 and hub_t1 >= 65) or soc1 <= stop_soc or v1 < 3.12 %}
            {% set blocked2 = is_state('input_boolean.zendure_bypass_u2','on') or is_state('input_boolean.zendure_emergency_u2','on') or is_state('input_boolean.zendure_vguard_u2','on') or is_state('input_boolean.zendure_calib_mode_u2','on') or is_state('input_boolean.zendure_calib_discharge_u2','on') or is_state('input_boolean.zendure_batt_temp_cooldown_u2','on') or is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') or (batt_t2 < 200 and batt_t2 >= 55) or (hub_t2 < 200 and hub_t2 >= 65) or soc2 <= stop_soc or v2 < 3.12 %}
            {% set wh1 = 0 if blocked1 else c1 * ([soc1 - stop_soc, 0] | max) / 100 %}
            {% set wh2 = 0 if blocked2 else c2 * ([soc2 - stop_soc, 0] | max) / 100 %}
            {{ ([wh1 + wh2, 0] | max) | round(0) }}
          assumed_load_w: >
            {% set load_avg_state = states('sensor.solarflow_house_load_mean_15m') %}
            {% set load_now_state = states('sensor.power_consumption') %}
            {% if is_number(load_avg_state) and load_avg_state | float(0) > 20 %}
              {{ load_avg_state | float(0) | round(0) }}
            {% elif is_number(load_now_state) %}
              {{ load_now_state | float(0) | round(0) }}
            {% else %}
              {% set meter = 'sensor.zendure_grid_power' %}
              {% set grid_w = states(meter) | float(0) %}
              {% set output_w = states('sensor.solarflow_system_total_output') | float(0) %}
              {{ [output_w + grid_w, 0] | max | round(0) }}
            {% endif %}
          assumed_discharge_w: >
            {% set dis15_state = states('sensor.solarflow_discharge_mean_15m') %}
            {% set dis60_state = states('sensor.solarflow_discharge_mean_60s') %}
            {% set dis_now = states('sensor.solarflow_system_total_discharge_power_v24') | float(0) %}
            {% set dis15 = dis15_state | float(0) if is_number(dis15_state) else 0 %}
            {% set dis60 = dis60_state | float(0) if is_number(dis60_state) else 0 %}
            {{ [dis15, dis60, dis_now] | max | round(0) }}
          eta_to_zero_h: >
            {% set total_wh = states('sensor.solarflow_remaining_energy') | float(0) %}
            {% set pc_state = states('sensor.power_consumption') %}
            {% if is_number(pc_state) %}
              {% set house_w = pc_state | float(0) %}
            {% else %}
              {% set meter = 'sensor.zendure_grid_power' %}
              {% set grid_w = states(meter) | float(0) %}
              {% set output_w = states('sensor.solarflow_system_total_output') | float(0) %}
              {% set house_w = [output_w + grid_w, 0] | max %}
            {% endif %}
            {% set dis15_state = states('sensor.solarflow_discharge_mean_15m') %}
            {% set dis60_state = states('sensor.solarflow_discharge_mean_60s') %}
            {% set dis_now = states('sensor.solarflow_system_total_discharge_power_v24') | float(0) %}
            {% set dis15 = dis15_state | float(0) if is_number(dis15_state) else 0 %}
            {% set dis60 = dis60_state | float(0) if is_number(dis60_state) else 0 %}
            {% set effective_w = [house_w, dis15, dis60, dis_now, 80] | max %}
            {{ (total_wh / effective_w) | round(1) }}
          pretty: >
            {% set h = this.state | float(0) %}
            {% set total_min = (h * 60) | int(0) %}
            {% set hh = (total_min // 60) | int(0) %}
            {% set mm = (total_min % 60) | int(0) %}
            {{ '%02d:%02d' | format(hh, mm) }}

