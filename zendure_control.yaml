    alias: "Zendure: Priority Emergency Zero U1"
    mode: single
    max_exceeded: warning
    fields:
      generation: { description: "Optional generation" }
      update_desired: { description: "Update Desired to zero" }
      source: { description: "Diagnostic source" }
    sequence:
      - wait_template: "{{ is_state('input_boolean.zendure_runtime_writers_ready','on') }}"
        timeout: "00:00:10"
        continue_on_timeout: false
      - variables:
          generation_value: "{{ generation | default(-1) | int(-1) }}"
