template:
  # --- V176 SINGLE POWER-METER PROXY WITH SOURCE FREEZE GUARD ---
  - unique_id: zendure_grid_power_proxy_block
    variables:
      source_entity: !secret power_meter_total_consumption
    triggers:
      - trigger: state
        entity_id: !secret power_meter_total_consumption
        id: source_update
      - trigger: time_pattern
        seconds: "/10"
        id: freshness_check
      - trigger: homeassistant
        event: start
        id: startup
    sensor:
      - name: "Zendure Grid Power"
        unique_id: zendure_grid_power_proxy
        default_entity_id: sensor.zendure_grid_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {% set src = (expand(source_entity) | first) %}
          {% set val = src.state if src is not none else 'unknown' %}
          {% set reported = as_timestamp(src.last_reported, 0)
               if src is not none and src.last_reported is defined else 0 %}
          {% set changed = as_timestamp(src.last_changed, 0) if src is not none else 0 %}
          {% set seen = [reported, changed] | max %}
          {{ src is not none
             and val | upper not in ['UNAVAILABLE','UNKNOWN','NONE']
             and is_number(val)
             and seen > 1
             and (as_timestamp(now()) - seen) < 30 }}
        state: >
          {% set v = states(source_entity) %}
          {{ v | float(0) if is_number(v) else none }}
        attributes:
          source_entity: "{{ source_entity }}"
          source_last_seen: >
            {% set src = (expand(source_entity) | first) %}
            {% set reported = as_timestamp(src.last_reported, 0)
                 if src is not none and src.last_reported is defined else 0 %}
            {% set changed = as_timestamp(src.last_changed, 0) if src is not none else 0 %}
            {{ [reported, changed] | max }}
          source_fresh: >
            {% set src = (expand(source_entity) | first) %}
            {% set val = src.state if src is not none else 'unknown' %}
            {% set reported = as_timestamp(src.last_reported, 0)
                 if src is not none and src.last_reported is defined else 0 %}
            {% set changed = as_timestamp(src.last_changed, 0) if src is not none else 0 %}
            {% set seen = [reported, changed] | max %}
            {{ src is not none and is_number(val) and seen > 1
               and (as_timestamp(now()) - seen) < 30 }}

  # V176: compact live-only diagnostics for troubleshooting dispatch ownership.
  - sensor:
      - name: "Zendure Dispatch State"
        unique_id: zendure_dispatch_state
        default_entity_id: sensor.zendure_dispatch_state
        icon: mdi:state-machine
        state: >-
          {% if is_state('input_boolean.zendure_transfer_pending','on') %}
            transfer_{{ states('input_text.zendure_transfer_lower_unit') | lower }}
          {% elif (state_attr('input_datetime.zendure_output_pending_since_u1','timestamp') | float(0)) > 1
                 or (state_attr('input_datetime.zendure_output_pending_since_u2','timestamp') | float(0)) > 1 %}
            ack_pending
          {% else %}idle{% endif %}
        attributes:
          generation: "{{ states('input_number.zendure_dispatch_generation') | int(0) }}"
          desired_u1: "{{ states('input_number.zendure_last_sent_1') | int(0) }}"
          desired_u2: "{{ states('input_number.zendure_last_sent_2') | int(0) }}"
          dispatched_u1: "{{ states('input_number.zendure_last_dispatched_1') | int(0) }}"
          dispatched_u2: "{{ states('input_number.zendure_last_dispatched_2') | int(0) }}"
          confirmed_u1: "{{ states('input_number.zendure_confirmed_output_1') | int(0) }}"
          confirmed_u2: "{{ states('input_number.zendure_confirmed_output_2') | int(0) }}"
          pending_u1: "{{ (state_attr('input_datetime.zendure_output_pending_since_u1','timestamp') | float(0)) > 1 }}"
          pending_u2: "{{ (state_attr('input_datetime.zendure_output_pending_since_u2','timestamp') | float(0)) > 1 }}"
          transfer_generation: "{{ states('input_number.zendure_transfer_generation') | int(0) }}"
          transfer_lower_unit: "{{ states('input_text.zendure_transfer_lower_unit') }}"
          transfer_target_u1: "{{ states('input_number.zendure_transfer_target_u1') | int(0) }}"
          transfer_target_u2: "{{ states('input_number.zendure_transfer_target_u2') | int(0) }}"
          write_budget_u1: >-
            {% set cap = states('input_number.zendure_conf_write_bucket_capacity') | float(5) %}
            {% set refill = [states('input_number.zendure_conf_write_refill_seconds') | float(4), 0.5] | max %}
            {% set stored = states('input_number.zendure_write_tokens_u1') | float(cap) %}
            {% set ts = (state_attr('input_datetime.zendure_write_budget_ts_u1','timestamp') | float(0)) %}
            {{ [cap, stored + ([as_timestamp(now()) - ts, 0] | max) / refill] | min | round(2) }}
          write_budget_u2: >-
            {% set cap = states('input_number.zendure_conf_write_bucket_capacity') | float(5) %}
            {% set refill = [states('input_number.zendure_conf_write_refill_seconds') | float(4), 0.5] | max %}
            {% set stored = states('input_number.zendure_write_tokens_u2') | float(cap) %}
            {% set ts = (state_attr('input_datetime.zendure_write_budget_ts_u2','timestamp') | float(0)) %}
            {{ [cap, stored + ([as_timestamp(now()) - ts, 0] | max) / refill] | min | round(2) }}
          last_publish_u1: "{{ states('input_text.zendure_last_output_publish_u1') }}"
          last_publish_u2: "{{ states('input_text.zendure_last_output_publish_u2') }}"

