          write_desired: "{{ update_desired | default(true) | bool }}"
          command_source: "{{ source | default('emergency_zero') }}"
          dispatched_before: "{{ states('input_number.zendure_last_dispatched_1') | int(0) }}"
          confirmed_before: "{{ states('input_number.zendure_confirmed_output_1') | int(0) }}"
          actual_ts: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
          actual_valid: "{{ actual_ts > 1 and (as_timestamp(now()) - actual_ts) < 20 and is_number(states('sensor.solarflow_1_output_power')) }}"
          actual_before: "{{ states('sensor.solarflow_1_output_power') | float(0) if actual_valid | bool else 0 }}"
          bypass_used: "{{ is_state('input_boolean.zendure_emergency_zero_bypass_used_u1','on') }}"
          last_emergency_zero_ts: "{{ state_attr('input_datetime.zendure_last_emergency_zero_ts_u1','timestamp') | float(0) }}"
          last_any_publish_ts: "{{ state_attr('input_datetime.zendure_last_any_publish_ts_u1','timestamp') | float(0) }}"
          emergency_bypass_cooldown_ok: "{{ (as_timestamp(now()) - last_emergency_zero_ts | float(0)) >= 5 }}"
          grid_now: "{{ states('sensor.zendure_grid_power') | float(0) }}"
          grid_bias: "{{ states('input_number.zendure_conf_grid_bias') | float(10) }}"
          zero_effect_needed: >-
            {{ (actual_valid | bool and actual_before | float(0) > 30)
                or (not actual_valid | bool and confirmed_before | int(0) > 0)
                or (not actual_valid | bool and confirmed_before | int(0) <= 0
                    and grid_now | float(0) < grid_bias | float(10) - 50)
                or dispatched_before | int(0) > 0 }}
      - variables:
          generation_stale: "{{ generation_value >= 0 and generation_value != generation_current }}"
          desired_is_zero: "{{ states('input_number.zendure_last_sent_1') | int(0) == 0 }}"
      - if:
          - condition: template
            value_template: "{{ generation_stale | bool and not desired_is_zero | bool }}"
        then:
          - stop: "Stale emergency-zero generation dropped after a positive owner took control."
      - if:
          - condition: template
            value_template: "{{ write_desired and states('input_number.zendure_last_sent_1') | int(0) != 0 }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_1 }
            data: { value: 0 }
      - if:
          - condition: template
            value_template: "{{ zero_effect_needed | bool and not bypass_used | bool and emergency_bypass_cooldown_ok | bool }}"
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_wire_emergency_lock_u1 }
          - action: script.turn_off
            target: { entity_id: script.zendure_wire_publish_u1 }
          - action: script.zendure_clear_deferred_u1
          - variables:
              desired_zero_recheck: "{{ states('input_number.zendure_last_sent_1') | int(0) == 0 }}"
              priority_valid: "{{ desired_zero_recheck | bool }}"
          - if:
              - condition: template
                value_template: "{{ not priority_valid | bool }}"
            then:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_wire_emergency_lock_u1 }
              - stop: "Emergency zero invalidated before priority publish."
          - variables:
              dispatch_ts: "{{ now().timestamp() }}"
          - action: mqtt.publish
            data: { topic: !secret zendure_topic_u1_number_outputLimit_set, payload: "0", qos: 1 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_any_publish_ts_u1 }
            data: { timestamp: "{{ dispatch_ts }}" }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_dispatch_ts_u1 }
            data: { timestamp: "{{ dispatch_ts }}" }
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_dispatched_1 }
            data: { value: 0 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_output_pending_since_u1 }
            data: { timestamp: "{{ dispatch_ts }}" }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_emergency_zero_bypass_used_u1 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_emergency_zero_ts_u1 }
            data: { timestamp: "{{ dispatch_ts }}" }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_last_output_publish_u1 }
            data:
              value: >-
                {{ now().isoformat() }}|u1|0W|{{ command_source }}|force=true|bypass=true|gen={{ generation_value }}|budget=emergency
          - event: zendure_outputlimit_publish
            event_data:
              unit: 1
              target: 0
              source: "{{ command_source }}"
              force: true
              emergency_bypass: true
              generation: "{{ generation_value }}"
              seconds_since_previous: "{{ (dispatch_ts | float(0) - last_any_publish_ts | float(0)) | round(3) }}"
              budget_before: emergency
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_wire_emergency_lock_u1 }
          - action: timer.start
            target: { entity_id: timer.zendure_ack_retry_u1 }
            data: { duration: 10 }
        else:
          - if:
              - condition: template
                value_template: "{{ zero_effect_needed | bool and (bypass_used | bool or not emergency_bypass_cooldown_ok | bool) }}"
            then:
              - action: script.zendure_dispatch_u1_output
                data:
                  power: 0
                  ensure_output_mode: false
                  force: true
                  reassert_output_mode: false
                  generation: "{{ states('input_number.zendure_dispatch_generation') | int(0) }}"
                  update_desired: false
                  coalesce_latest: false
                  peer_reservation: 0
                  peer_reservation_validated: false
                  safety_zero: true
                  source: "{{ command_source }}_bounded_retry"

