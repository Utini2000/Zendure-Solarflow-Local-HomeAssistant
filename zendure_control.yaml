      generation:
        description: "Optional dispatch generation; stale generations are dropped"
      update_desired:
        description: "If true, update the regulator Desired helper"
      coalesce_latest:
        description: "For normal control, send the newest Desired value instead of an obsolete queued target"
      peer_reservation:
        description: "Coordinator reservation for the other unit in W"
      peer_reservation_validated:
        description: "True only for a fresh post-transfer physical peer measurement"
      safety_zero:
        description: "Preserve safety-zero semantics across deferral"
      source:
        description: "Diagnostic command source"
