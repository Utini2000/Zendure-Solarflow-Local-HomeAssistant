        {% set previous = states(entity_id) | float(none) %}
        {% if raw is none %}
          {{ previous | round(1) if previous is not none else none }}
        {% else %}
          {% if raw > 1000 %}
            {% set val = (raw - 2731) / 10 %}
          {% elif raw > 150 %}
            {% set val = raw - 273.1 %}
          {% else %}
            {% set val = raw %}
          {% endif %}
          {% if val >= -30 and val <= 100 %}
