            {% elif raw > 150 %}{% set val = raw - 273.1 %}
            {% else %}{% set val = raw %}{% endif %}
            {% if val is not none and val >= -30 and val <= 100 %}{{ val | round(1) }}
            {% elif fresh_old %}{{ old }}
            {% else %}{{ none }}{% endif %}
          {% elif fresh_old %}{{ old }}
          {% else %}{{ none }}{% endif %}
        attributes:
          last_good: >
            {% set old_ts = this.attributes.get('last_good', '1970-01-01T00:00:00+00:00') %}
            {% if trigger.id == 'hub_temp' %}
